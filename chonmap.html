<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO - CHỌN MAP</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* ==================================================
   KHUNG THIẾT KẾ
================================================== */

#gameFrame{
    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}

/* ==================================================
   NỀN
================================================== */

#background{
    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}

/* ==================================================
   NÚT QUAY LẠI
================================================== */

.back-hit{
    position:absolute;

    left:18px;
    top:18px;

    width:70px;
    height:65px;

    border:0;
    outline:0;

    background:transparent;

    cursor:pointer;

    z-index:20;
}

/* ==================================================
   VÙNG MAP BẤM ẨN
================================================== */

.map-hit{
    position:absolute;

    border:0;
    outline:0;

    background:transparent;

    cursor:pointer;

    z-index:10;

    padding:0;
}

.map-hit:active{
    background:
        rgba(255,255,255,.04);
}

/* ==================================================
   MAP 1
================================================== */

#map1{
    left:220px;
    top:130px;

    width:410px;
    height:300px;
}

/* ==================================================
   MAP 2
================================================== */

#map2{
    left:865px;
    top:120px;

    width:390px;
    height:310px;
}

/* ==================================================
   MAP 3
================================================== */

#map3{
    left:570px;
    top:320px;

    width:350px;
    height:190px;
}

/* ==================================================
   MAP 4
================================================== */

#map4{
    left:230px;
    top:455px;

    width:390px;
    height:300px;
}

/* ==================================================
   MAP 5
================================================== */

#map5{
    left:875px;
    top:455px;

    width:400px;
    height:300px;
}

/* ==================================================
   KHÓA MAP
================================================== */

.map-hit.locked{
    cursor:not-allowed;
}

.map-hit.locked::after{

    content:"🔒";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        rgba(0,0,0,.58);

    border:
        2px solid
        rgba(255,255,255,.55);

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.35);

    font-size:32px;

    pointer-events:none;
}

/* ==================================================
   THÔNG BÁO
================================================== */

#message{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.92);

    min-width:280px;
    max-width:80%;

    padding:
        16px
        22px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,214,90,.42);

    background:
        rgba(0,0,0,.82);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    z-index:100;

    transition:
        opacity .18s ease,
        transform .18s ease;
}

#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

}

/* ==================================================
   PANEL TIẾN ĐỘ
   Chỉ hiện rất nhỏ ở góc để không phá ảnh
================================================== */

#progressPanel{

    position:absolute;

    right:18px;
    bottom:16px;

    z-index:30;

    padding:
        8px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.16);

    color:#fff;

    font-size:10px;

    font-weight:900;

}

/* ==================================================
   MOBILE / SCALE
================================================== */

@media (orientation:landscape){

    #gameFrame{

        transform:
            translate(-50%,-50%)
            scale(
                min(
                    100vw / 1536,
                    100vh / 864
                )
            );

    }

}

@media (orientation:portrait){

    #gameFrame{

        transform:
            translate(-50%,-50%)
            rotate(90deg)
            scale(
                min(
                    100vw / 864,
                    100vh / 1536
                )
            );

    }

}

</style>
</head>

<body>

<div id="app">

    <div id="gameFrame">

        <!-- NỀN BẠN ĐÃ UPLOAD -->
        <img
            id="background"
            src="./chonmap.png"
            alt="Chọn bản đồ">


        <!-- QUAY LẠI -->
        <button
            class="back-hit"
            aria-label="Quay lại"
            onclick="goBack()">
        </button>


        <!-- MAP 1 -->
        <button
            id="map1"
            class="map-hit"
            aria-label="Map 1"
            onclick="selectMap(1)">
        </button>


        <!-- MAP 2 -->
        <button
            id="map2"
            class="map-hit"
            aria-label="Map 2"
            onclick="selectMap(2)">
        </button>


        <!-- MAP 3 -->
        <button
            id="map3"
            class="map-hit"
            aria-label="Map 3"
            onclick="selectMap(3)">
        </button>


        <!-- MAP 4 -->
        <button
            id="map4"
            class="map-hit"
            aria-label="Map 4"
            onclick="selectMap(4)">
        </button>


        <!-- MAP 5 -->
        <button
            id="map5"
            class="map-hit"
            aria-label="Map 5"
            onclick="selectMap(5)">
        </button>


        <!-- THÔNG BÁO -->
        <div id="message"></div>


        <!-- TIẾN ĐỘ -->
        <div id="progressPanel">
            MAP 1 • 0/20
        </div>

    </div>

</div>


<script>

/* ==================================================
   CẤU HÌNH
================================================== */

const TOTAL_MAPS = 5;

const STAGES_PER_MAP = 20;


/* ==================================================
   LOCAL STORAGE
==================================================

   map1Progress = số màn đã vượt
   map2Progress = số màn đã vượt
   ...
================================================== */

function getProgress(mapNumber){

    return Number(
        localStorage.getItem(
            "animeDorado_map" +
            mapNumber +
            "_progress"
        ) || 0
    );

}


function setProgress(
    mapNumber,
    progress
){

    progress =
        Math.max(
            0,
            Math.min(
                STAGES_PER_MAP,
                Number(progress) || 0
            )
        );

    localStorage.setItem(
        "animeDorado_map" +
        mapNumber +
        "_progress",
        progress
    );

}


/* ==================================================
   KIỂM TRA MAP ĐÃ MỞ
================================================== */

function isMapUnlocked(
    mapNumber
){

    /*
       MAP 1 luôn mở.
    */

    if(
        mapNumber === 1
    ){

        return true;

    }


    /*
       Map sau chỉ mở khi map trước
       đã vượt đủ 20 màn.
    */

    return (
        getProgress(
            mapNumber - 1
        ) >=
        STAGES_PER_MAP
    );

}


/* ==================================================
   CẬP NHẬT KHÓA
================================================== */

function updateMapLocks(){

    for(
        let i = 1;
        i <= TOTAL_MAPS;
        i++
    ){

        const map =
            document.getElementById(
                "map" + i
            );


        if(
            !map
        ){

            continue;

        }


        if(
            isMapUnlocked(i)
        ){

            map.classList.remove(
                "locked"
            );

            map.disabled =
                false;

        }
        else{

            map.classList.add(
                "locked"
            );

            map.disabled =
                true;

        }

    }

}


/* ==================================================
   CHỌN MAP
================================================== */

function selectMap(
    mapNumber
){

    if(
        !isMapUnlocked(
            mapNumber
        )
    ){

        showMessage(
            "MAP " +
            mapNumber +
            " CHƯA ĐƯỢC MỞ!"
        );

        return;

    }


    /*
       Lưu map hiện tại
    */

    localStorage.setItem(
        "animeDorado_currentMap",
        mapNumber
    );


    /*
       Luôn bắt đầu chọn stage
       của map đã chọn.
    */

    window.location.href =
        "./chonstage.html";

}


/* ==================================================
   THÔNG BÁO
================================================== */

let messageTimer = null;

function showMessage(
    text
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function(){

                box.classList.remove(
                    "show"
                );

            },
            1300
        );

}


/* ==================================================
   BACK
================================================== */

function goBack(){

    window.location.href =
        "./index.html";

}


/* ==================================================
   HIỂN THỊ TIẾN ĐỘ
================================================== */

function updateProgressPanel(){

    let currentMap =
        Number(
            localStorage.getItem(
                "animeDorado_currentMap"
            ) || 1
        );


    if(
        !isMapUnlocked(
            currentMap
        )
    ){

        currentMap =
            1;

    }


    const progress =
        getProgress(
            currentMap
        );


    document
        .getElementById(
            "progressPanel"
        )
        .textContent =

        "MAP " +
        currentMap +
        " • " +
        progress +
        "/" +
        STAGES_PER_MAP;

}


/* ==================================================
   SCALE
================================================== */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    if(
        width >= height
    ){

        const scale =
            Math.min(
                width / 1536,
                height / 864
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

    }
    else{

        const scale =
            Math.min(
                width / 864,
                height / 1536
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "rotate(90deg) " +
            "scale(" +
            scale +
            ")";

    }

}


/* ==================================================
   START
================================================== */

updateMapLocks();

updateProgressPanel();

scaleGame();


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);

</script>

</body>
</html>
