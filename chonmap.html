<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO - CHỌN MAP</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select:none;
}


/* ==================================================
   APP
================================================== */

#app{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}


/* ==================================================
   GAME FRAME
================================================== */

#gameFrame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

}


/* ==================================================
   NỀN CHỌN MAP
================================================== */

#background{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    user-select:none;

    -webkit-user-drag:none;

}


/* ==================================================
   NÚT QUAY LẠI
================================================== */

.back-button{

    position:absolute;

    left:15px;
    top:15px;

    width:70px;
    height:65px;

    border:0;
    outline:0;

    background:transparent;

    cursor:pointer;

    z-index:50;

}


/* ==================================================
   MAP HITBOX
================================================== */

.map-button{

    position:absolute;

    border:0;
    outline:0;

    padding:0;

    background:transparent;

    cursor:pointer;

    z-index:20;

}


/* ==================================================
   MAP 1
================================================== */

#map1{

    left:220px;
    top:130px;

    width:410px;
    height:300px;

}


/* ==================================================
   MAP 2
================================================== */

#map2{

    left:865px;
    top:120px;

    width:390px;
    height:310px;

}


/* ==================================================
   MAP 3
================================================== */

#map3{

    left:570px;
    top:320px;

    width:350px;
    height:190px;

}


/* ==================================================
   MAP 4
================================================== */

#map4{

    left:230px;
    top:455px;

    width:390px;
    height:300px;

}


/* ==================================================
   MAP 5
================================================== */

#map5{

    left:875px;
    top:455px;

    width:400px;
    height:300px;

}


/* ==================================================
   MAP KHÓA
================================================== */

.map-button.locked{

    cursor:not-allowed;

}


/*
   Không phủ khóa lên Map 1.
   Chỉ Map chưa mở mới có khóa.
*/

.map-button.locked::after{

    content:"🔒";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:64px;
    height:64px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:
        rgba(0,0,0,.58);

    border:
        2px solid
        rgba(255,255,255,.5);

    box-shadow:
        0 8px 24px
        rgba(0,0,0,.4);

    font-size:31px;

    pointer-events:none;

}


/* ==================================================
   MESSAGE
================================================== */

#message{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    min-width:280px;

    max-width:80%;

    padding:
        15px
        22px;

    border-radius:15px;

    background:
        rgba(0,0,0,.84);

    border:
        1px solid
        rgba(255,214,90,.42);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    z-index:100;

    transition:
        opacity .18s ease,
        transform .18s ease;

}

#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

}


/* ==================================================
   TIẾN ĐỘ
================================================== */

#progress{

    position:absolute;

    right:18px;
    bottom:16px;

    z-index:40;

    padding:
        8px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.16);

    color:#fff;

    font-size:10px;

    font-weight:900;

}


/* ==================================================
   CHẠM
================================================== */

.map-button:active{

    background:
        rgba(255,255,255,.035);

}


/* ==================================================
   DESKTOP / MOBILE
================================================== */

@media(max-width:700px){

    #progress{

        right:8px;
        bottom:8px;

        font-size:9px;

        padding:
            7px 9px;

    }

}

</style>

</head>


<body>


<div id="app">


    <div id="gameFrame">


        <!-- ==========================================
             NỀN
        =========================================== -->

        <img
            id="background"
            src="./chonmap.png"
            alt="ANIME DORADO - CHỌN MAP">


        <!-- ==========================================
             QUAY LẠI
        =========================================== -->

        <button
            class="back-button"
            aria-label="Quay lại"
            onclick="goBack()">
        </button>


        <!-- ==========================================
             MAP 1
        =========================================== -->

        <button
            id="map1"
            class="map-button"
            aria-label="Map 1"
            onclick="selectMap(1)">
        </button>


        <!-- ==========================================
             MAP 2
        =========================================== -->

        <button
            id="map2"
            class="map-button"
            aria-label="Map 2"
            onclick="selectMap(2)">
        </button>


        <!-- ==========================================
             MAP 3
        =========================================== -->

        <button
            id="map3"
            class="map-button"
            aria-label="Map 3"
            onclick="selectMap(3)">
        </button>


        <!-- ==========================================
             MAP 4
        =========================================== -->

        <button
            id="map4"
            class="map-button"
            aria-label="Map 4"
            onclick="selectMap(4)">
        </button>


        <!-- ==========================================
             MAP 5
        =========================================== -->

        <button
            id="map5"
            class="map-button"
            aria-label="Map 5"
            onclick="selectMap(5)">
        </button>


        <!-- ==========================================
             THÔNG BÁO
        =========================================== -->

        <div id="message"></div>


        <!-- ==========================================
             TIẾN ĐỘ
        =========================================== -->

        <div id="progress">
            MAP 1 • 0/20
        </div>


    </div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const TOTAL_MAPS =
    5;

const STAGES_PER_MAP =
    20;


/* ==================================================
   LOCAL STORAGE
================================================== */

function getMapProgress(
    mapNumber
){

    const key =
        "animeDorado_map" +
        mapNumber +
        "_progress";


    const value =
        Number(
            localStorage.getItem(
                key
            )
        );


    if(
        !Number.isFinite(value)
    ){

        return 0;

    }


    return Math.max(
        0,
        Math.min(
            STAGES_PER_MAP,
            value
        )
    );

}


/* ==================================================
   MAP UNLOCK
================================================== */

function isMapUnlocked(
    mapNumber
){

    /*
       Map 1 luôn mở.
    */

    if(
        mapNumber === 1
    ){

        return true;

    }


    /*
       Map N mở khi Map N-1
       đã hoàn thành đủ 20 màn.
    */

    return (
        getMapProgress(
            mapNumber - 1
        ) >=
        STAGES_PER_MAP
    );

}


/* ==================================================
   UPDATE LOCK
================================================== */

function updateMapLocks(){

    for(
        let i = 1;
        i <= TOTAL_MAPS;
        i++
    ){

        const button =
            document.getElementById(
                "map" + i
            );


        if(
            !button
        ){

            continue;

        }


        const unlocked =
            isMapUnlocked(i);


        if(
            unlocked
        ){

            button.classList.remove(
                "locked"
            );

            button.disabled =
                false;

        }
        else{

            button.classList.add(
                "locked"
            );

            button.disabled =
                true;

        }

    }

}


/* ==================================================
   SELECT MAP
================================================== */

function selectMap(
    mapNumber
){

    /*
       Kiểm tra khóa lần nữa
       để tránh bấm bằng script.
    */

    if(
        !isMapUnlocked(
            mapNumber
        )
    ){

        showMessage(
            "MAP " +
            mapNumber +
            " CHƯA ĐƯỢC MỞ!"
        );

        return;

    }


    /*
       Lưu map hiện tại.
    */

    localStorage.setItem(
        "animeDorado_currentMap",
        String(mapNumber)
    );


    /*
       MAP 1 → CHONMANMAP1
    */

    if(
        mapNumber === 1
    ){

        window.location.href =
            "./chonmanmap1.html";

        return;

    }


    /*
       Các map khác chưa tạo.
       Không 404, chỉ báo khóa/chưa có.
    */

    showMessage(
        "MAP " +
        mapNumber +
        " CHƯA CÓ!"
    );

}


/* ==================================================
   MESSAGE
================================================== */

let messageTimer =
    null;


function showMessage(
    text
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function(){

                box.classList.remove(
                    "show"
                );

            },
            1300
        );

}


/* ==================================================
   BACK
================================================== */

function goBack(){

    window.location.href =
        "./index.html";

}


/* ==================================================
   PROGRESS PANEL
================================================== */

function updateProgress(){

    let currentMap =
        Number(
            localStorage.getItem(
                "animeDorado_currentMap"
            ) || 1
        );


    if(
        currentMap < 1 ||
        currentMap > TOTAL_MAPS
    ){

        currentMap =
            1;

    }


    /*
       Nếu map hiện tại chưa mở,
       quay về Map 1.
    */

    if(
        !isMapUnlocked(
            currentMap
        )
    ){

        currentMap =
            1;

    }


    const progress =
        getMapProgress(
            currentMap
        );


    document
        .getElementById(
            "progress"
        )
        .textContent =

        "MAP " +
        currentMap +
        " • " +
        progress +
        "/" +
        STAGES_PER_MAP;

}


/* ==================================================
   SCALE
================================================== */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );


    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /*
       MÀN HÌNH NGANG
    */

    if(
        screenWidth >=
        screenHeight
    ){

        const scale =
            Math.min(
                screenWidth /
                1536,

                screenHeight /
                864
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

        return;

    }


    /*
       MÀN HÌNH DỌC:
       xoay game ngang.
    */

    const scale =
        Math.min(
            screenWidth /
            864,

            screenHeight /
            1536
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "rotate(90deg) " +
        "scale(" +
        scale +
        ")";

}


/* ==================================================
   IMAGE ERROR CHECK
================================================== */

document
    .getElementById(
        "background"
    )
    .addEventListener(
        "error",
        function(){

            showMessage(
                "Không tìm thấy chonmap.png"
            );

        }
    );


/* ==================================================
   START
================================================== */

updateMapLocks();

updateProgress();

scaleGame();


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);

</script>

</body>

</html>
