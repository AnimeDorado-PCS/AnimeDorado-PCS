<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Superman - Keyframe Chiến Đấu & Bay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: 90vw;
            max-width: 900px;
            height: 70vh;
            max-height: 600px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            background: radial-gradient(ellipse at center, #1e3c5a 0%, #050f1e 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin: 20px auto;
            overflow: hidden;
            cursor: default;
        }

        /* Khung chứa nhân vật – kích thước khớp với frame gốc, sẽ scale nhỏ lại */
        #superman {
            position: absolute;
            width: 384px;   /* frame width */
            height: 939px;  /* frame height tấn công, mặc định */
            transform: scale(0.35); /* thu nhỏ vừa màn hình */
            transform-origin: top left;
            background-repeat: no-repeat;
            background-size: 1536px 939px; /* kích thước sprite tấn công */
            background-position: 0 0;
            image-rendering: auto;
            z-index: 10;
            /* animation sẽ gán bằng class */
        }

        /* Animation tấn công: chạy 4 frame trong 0.4s, 1 lần */
        @keyframes attackAnim {
            0%   { background-position: 0 0; }
            100% { background-position: -1536px 0; }
        }

        /* Animation bay: chạy 4 frame liên tục */
        @keyframes flyAnim {
            0%   { background-position: 0 0; }
            100% { background-position: -1536px 0; }
        }

        .attacking {
            animation: attackAnim 0.4s steps(4) forwards;
        }

        .flying {
            animation: flyAnim 0.6s steps(4) infinite;
        }

        /* Điều khiển */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 20px;
            z-index: 30;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(180deg, #f4c842, #b96d0a);
            border: none;
            border-radius: 30px;
            color: #1a1304;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }

        button.punch-btn {
            background: linear-gradient(180deg, #ff5555, #aa2020);
            color: white;
        }

        .info {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            text-align: center;
            margin: 10px;
        }

        /* Sóng xung kích khi đấm (tùy chọn) */
        .shockwave {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: shockwaveEffect 0.5s ease-out forwards;
            z-index: 20;
        }

        @keyframes shockwaveEffect {
            0% {
                width: 20px;
                height: 20px;
                opacity: 1;
                margin-left: -10px;
                margin-top: -10px;
            }
            100% {
                width: 140px;
                height: 140px;
                opacity: 0;
                margin-left: -70px;
                margin-top: -70px;
            }
        }
    </style>
</head>
<body>
    <div class="info">
        ← → : Di chuyển (tự động bay) &nbsp;|&nbsp; SPACE hoặc Nút : Đấm
    </div>

    <div id="stage">
        <div id="superman"></div>
    </div>

    <div class="controls">
        <button class="punch-btn" id="punchButton">💥 ĐẤM</button>
    </div>

    <script>
        (function() {
            const superman = document.getElementById('superman');
            const stage = document.getElementById('stage');

            // --- Thông số sprite ---
            const ATTACK_SPRITE = 'https://i.postimg.cc/VLTzTyt5/20260812-191849.png';
            const FLY_SPRITE = 'https://i.postimg.cc/7ZWX0Vpr/20260812-191835.png';

            const FRAME_WIDTH = 384;            // pixel
            const ATTACK_FRAME_HEIGHT = 939;
            const FLY_FRAME_HEIGHT = 688;
            const ATTACK_TOTAL_WIDTH = 1536;
            const FLY_TOTAL_WIDTH = 1536;

            const SCALE = 0.35;                 // tỉ lệ hiển thị

            // --- Trạng thái ---
            let x = stage.clientWidth / 2;       // vị trí tâm (pixel trước scale)
            let y = stage.clientHeight * 0.7;    // top position
            let isAttacking = false;
            let isFlying = false;                // đang di chuyển/bay
            let facingRight = true;
            let keys = { left: false, right: false };

            // --- Cập nhật sprite hiện tại (idle hoặc fly) ---
            function setIdleSprite() {
                superman.style.backgroundImage = `url('${ATTACK_SPRITE}')`;
                superman.style.width = FRAME_WIDTH + 'px';
                superman.style.height = ATTACK_FRAME_HEIGHT + 'px';
                superman.style.backgroundSize = ATTACK_TOTAL_WIDTH + 'px ' + ATTACK_FRAME_HEIGHT + 'px';
                superman.style.backgroundPosition = '0 0';
                superman.classList.remove('attacking', 'flying');
            }

            function setFlySprite() {
                superman.style.backgroundImage = `url('${FLY_SPRITE}')`;
                superman.style.width = FRAME_WIDTH + 'px';
                superman.style.height = FLY_FRAME_HEIGHT + 'px';
                superman.style.backgroundSize = FLY_TOTAL_WIDTH + 'px ' + FLY_FRAME_HEIGHT + 'px';
                superman.style.backgroundPosition = '0 0';
                superman.classList.remove('attacking');
                superman.classList.add('flying');
            }

            // --- Di chuyển ---
            function updatePosition() {
                if (keys.left) {
                    x -= 5;
                    facingRight = false;
                    if (!isFlying && !isAttacking) {
                        setFlySprite();
                        isFlying = true;
                    }
                } else if (keys.right) {
                    x += 5;
                    facingRight = true;
                    if (!isFlying && !isAttacking) {
                        setFlySprite();
                        isFlying = true;
                    }
                } else {
                    if (isFlying && !isAttacking) {
                        setIdleSprite();
                        isFlying = false;
                    }
                }

                // Giới hạn trong stage (tính theo kích thước thực sau scale)
                const halfW = (FRAME_WIDTH * SCALE) / 2;
                const halfH = (isFlying ? FLY_FRAME_HEIGHT : ATTACK_FRAME_HEIGHT) * SCALE / 2;
                x = Math.max(halfW, Math.min(stage.clientWidth - halfW, x));
                y = Math.max(halfH, Math.min(stage.clientHeight - halfH, y));

                superman.style.left = x + 'px';
                superman.style.top = y + 'px';
                // Lật mặt nếu cần (dùng transform scaleX kết hợp với scale gốc)
                if (!facingRight) {
                    superman.style.transform = `scale(${SCALE}) scaleX(-1)`;
                } else {
                    superman.style.transform = `scale(${SCALE}) scaleX(1)`;
                }

                requestAnimationFrame(updatePosition);
            }

            // --- Tấn công ---
            function punch() {
                if (isAttacking) return;
                isAttacking = true;

                // Dừng bay nếu có, chuyển sang sprite tấn công
                superman.classList.remove('flying');
                superman.style.backgroundImage = `url('${ATTACK_SPRITE}')`;
                superman.style.width = FRAME_WIDTH + 'px';
                superman.style.height = ATTACK_FRAME_HEIGHT + 'px';
                superman.style.backgroundSize = ATTACK_TOTAL_WIDTH + 'px ' + ATTACK_FRAME_HEIGHT + 'px';
                superman.style.backgroundPosition = '0 0';
                superman.classList.add('attacking');

                // Hiệu ứng sóng xung kích
                createShockwave(x, y);

                // Kết thúc tấn công sau animation
                const onAttackEnd = () => {
                    superman.classList.remove('attacking');
                    isAttacking = false;
                    // Quay về trạng thái trước đó (idle hoặc bay nếu đang giữ phím)
                    if (keys.left || keys.right) {
                        setFlySprite();
                        isFlying = true;
                    } else {
                        setIdleSprite();
                        isFlying = false;
                    }
                    superman.removeEventListener('animationend', onAttackEnd);
                };
                superman.addEventListener('animationend', onAttackEnd);
            }

            function createShockwave(px, py) {
                const wave = document.createElement('div');
                wave.className = 'shockwave';
                wave.style.left = px + 'px';
                wave.style.top = py + 'px';
                stage.appendChild(wave);
                wave.addEventListener('animationend', () => wave.remove());
            }

            // --- Sự kiện phím ---
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    keys.left = true;
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    keys.right = true;
                    e.preventDefault();
                } else if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    punch();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') {
                    keys.left = false;
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    keys.right = false;
                    e.preventDefault();
                }
            });

            document.getElementById('punchButton').addEventListener('click', punch);

            // --- Khởi tạo ---
            setIdleSprite();
            superman.style.left = x + 'px';
            superman.style.top = y + 'px';
            requestAnimationFrame(updatePosition);
        })();
    </script>
</body>
</html>
