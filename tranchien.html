<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>ANIME DORADO - TRẬN CHIẾN</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button{
    font:inherit;
}


/* =====================================================
   GAME
===================================================== */

#game{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}


/* =====================================================
   DESIGN FRAME
===================================================== */

#gameFrame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}


/* =====================================================
   BATTLE BACKGROUND
===================================================== */

#battleBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    z-index:0;

    user-select:none;

    -webkit-user-drag:none;
}


/* =====================================================
   TOP UI
===================================================== */

.top-ui{

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:76px;

    z-index:100;

    display:flex;

    align-items:center;

    padding:
        10px
        18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.72),
            rgba(0,0,0,0)
        );
}


.wave-box{

    min-width:190px;

    padding:
        9px
        18px;

    border-radius:18px;

    background:
        rgba(0,0,0,.53);

    border:
        1px solid
        rgba(255,255,255,.25);

    color:#fff;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.22);
}


.wave-small{

    color:#9fe1aa;

    font-size:12px;

    font-weight:900;
}


.wave-main{

    margin-top:2px;

    font-size:20px;

    font-weight:1000;
}


.gold-box{

    margin-left:auto;

    min-width:170px;

    padding:
        10px
        17px;

    border-radius:18px;

    background:
        rgba(0,0,0,.53);

    border:
        1px solid
        rgba(255,214,90,.3);

    color:#ffd65a;

    text-align:center;

    font-size:17px;

    font-weight:1000;
}


/* =====================================================
   BATTLE FIELD
===================================================== */

#battleField{

    position:absolute;

    left:0;
    top:76px;

    width:1536px;
    height:610px;

    overflow:hidden;

    z-index:5;
}


/* =====================================================
   HOME TOWER
===================================================== */

.tower{

    position:absolute;

    bottom:92px;

    width:120px;
    height:150px;

    border:
        3px solid
        rgba(235,247,255,.92);

    border-radius:
        22px
        22px
        10px
        10px;

    background:
        linear-gradient(
            180deg,
            #859eae,
            #344d5b
        );

    box-shadow:
        0 14px 30px
        rgba(0,0,0,.4),

        inset 0 2px 0
        rgba(255,255,255,.3);

    z-index:12;
}


.tower::before{

    content:"";

    position:absolute;

    left:12%;
    right:12%;

    top:-37px;

    height:48px;

    border:
        3px solid
        rgba(235,247,255,.92);

    border-radius:
        19px
        19px
        8px
        8px;

    background:
        linear-gradient(
            180deg,
            #91adbb,
            #435c6a
        );
}


.tower::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:
        translateX(-50%);

    width:40px;
    height:60px;

    border-radius:
        18px
        18px
        0
        0;

    background:#17252e;
}


.tower-left{

    left:115px;
}


.tower-right{

    right:115px;
}


/* =====================================================
   TOWER HP
===================================================== */

.tower-hp{

    position:absolute;

    left:50%;
    top:-18px;

    transform:
        translateX(-50%);

    width:152px;
    height:11px;

    border-radius:10px;

    overflow:hidden;

    background:#270b11;

    border:
        1px solid
        rgba(255,255,255,.28);
}


.tower-hp-bar{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #32d952,
            #a0ff4e
        );

    transition:
        width .2s linear;
}


/* =====================================================
   SPAWN MARKER
===================================================== */

.spawn-marker{

    position:absolute;

    right:190px;

    bottom:170px;

    width:28px;
    height:28px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,214,90,.55);

    background:
        rgba(255,214,90,.1);

    box-shadow:
        0 0 20px
        rgba(255,214,90,.12);

    z-index:8;

    pointer-events:none;
}


.spawn-marker::before{

    content:"";

    position:absolute;

    inset:6px;

    border-radius:50%;

    background:#ffd65a;

    opacity:.55;
}


/* =====================================================
   UNIT COMMON
===================================================== */

.unit{

    position:absolute;

    z-index:35;

    width:384px;
    height:939px;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.24);

    transform-origin:center center;

    will-change:left,top;
}


.unit-image{

    position:absolute;

    left:0;
    top:0;

    width:384px;
    height:939px;

    background-repeat:no-repeat;

    background-position:
        0 0;

}


/* =====================================================
   SUPERMAN IDLE / ATTACK
===================================================== */

.superman .unit-image{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;
}


/* =====================================================
   SUPERMAN FLY
===================================================== */

.superman.fly .unit-image{

    width:384px;

    height:688px;

    background-image:
        url(
            "https://i.postimg.cc/7ZWX0Vpr/20260812-191835.png"
        );

    background-size:
        1536px 688px;

    animation:
        supermanFly
        .6s
        steps(4)
        infinite;
}


@keyframes supermanFly{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            -1536px 0;
    }

}


/* =====================================================
   SUPERMAN ATTACK
===================================================== */

.superman.attack .unit-image{

    width:384px;

    height:939px;

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

    animation:
        supermanAttack
        .42s
        steps(4)
        1;
}


@keyframes supermanAttack{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            -1536px 0;
    }

}


/* =====================================================
   ENEMY
===================================================== */

.enemy{

    position:absolute;

    width:90px;
    height:90px;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    will-change:left,top;
}


.enemy img{

    width:90px;
    height:90px;

    object-fit:contain;

    display:block;
}


.enemy-hp{

    position:absolute;

    left:50%;
    top:-12px;

    transform:
        translateX(-50%);

    width:88px;
    height:8px;

    border-radius:8px;

    overflow:hidden;

    background:#29090e;

}


.enemy-hp-bar{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff3030,
            #ff9b32
        );

    transition:
        width .18s linear;
}


.enemy-name{

    position:absolute;

    left:50%;
    bottom:-18px;

    transform:
        translateX(-50%);

    white-space:nowrap;

    color:#fff;

    font-size:10px;

    font-weight:900;

    text-shadow:
        0 2px 4px #000;
}


/* =====================================================
   DAMAGE
===================================================== */

.damage{

    position:absolute;

    z-index:120;

    pointer-events:none;

    color:#ffd65a;

    font-size:30px;

    font-weight:1000;

    text-shadow:
        0 3px 8px #000;

    animation:
        damageFloat
        .55s
        ease-out
        forwards;
}


@keyframes damageFloat{

    0%{

        opacity:1;

        transform:
            translateY(0)
            scale(.8);

    }

    100%{

        opacity:0;

        transform:
            translateY(-60px)
            scale(1.12);

    }

}


/* =====================================================
   SUMMON BAR
===================================================== */

#summonBar{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:178px;

    z-index:150;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        12px
        20px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.04),
            rgba(0,0,0,.9)
        );
}


.energy{

    width:225px;

    flex:0 0 225px;
}


.energy-label{

    margin-bottom:5px;

    color:#fff;

    font-size:12px;

    font-weight:900;
}


.energy-bar{

    width:100%;

    height:14px;

    overflow:hidden;

    border-radius:12px;

    background:#121a24;

    border:
        1px solid
        rgba(255,255,255,.18);
}


.energy-fill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #5c7dff,
            #8bd8ff
        );

    transition:
        width .2s linear;
}


/* =====================================================
   SUMMON CARD
===================================================== */

.summon-card{

    position:relative;

    width:125px;
    height:142px;

    flex:0 0 125px;

    border:
        2px solid
        rgba(255,214,90,.5);

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #865d1e,
            #35230e
        );

    color:#fff;

    overflow:hidden;

    cursor:pointer;

    box-shadow:
        0 7px 16px
        rgba(0,0,0,.35);
}


.summon-card:active{

    transform:
        scale(.96);

}


.summon-card img{

    width:100%;

    height:100px;

    display:block;

    object-fit:contain;
}


.summon-cost{

    position:absolute;

    right:5px;
    top:5px;

    z-index:5;

    padding:
        4px
        7px;

    border-radius:9px;

    background:
        rgba(0,0,0,.72);

    color:#ffd65a;

    font-size:10px;

    font-weight:900;
}


.summon-name{

    position:absolute;

    left:0;
    right:0;
    bottom:5px;

    text-align:center;

    color:#fff;

    font-size:11px;

    font-weight:900;
}


/* =====================================================
   MESSAGE
===================================================== */

#message{

    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%);

    z-index:300;

    min-width:270px;

    padding:
        15px
        23px;

    border:
        1px solid
        rgba(255,214,90,.4);

    border-radius:15px;

    background:
        rgba(0,0,0,.84);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s;
}


#message.show{
    opacity:1;
}


/* =====================================================
   WIN
===================================================== */

#winScreen{

    position:absolute;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(5px);
}


.win-box{

    width:min(
        470px,
        90vw
    );

    padding:
        34px
        24px;

    border:
        2px solid
        #ffd65a;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            #28405a,
            #111c29
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);

    text-align:center;
}


.win-title{

    color:#ffd65a;

    font-size:
        clamp(
            36px,
            10vw,
            60px
        );

    font-weight:1000;
}


.win-text{

    margin-top:10px;

    color:#d3dbe5;

    font-size:14px;
}


.win-button{

    margin-top:22px;

    min-width:190px;

    height:50px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    #summonBar{

        height:150px;

        padding:8px;

        gap:7px;

    }

    .energy{

        width:120px;

        flex-basis:120px;

    }

    .summon-card{

        width:88px;

        height:112px;

        flex-basis:88px;

    }

    .summon-card img{

        height:78px;

    }

    .summon-name{

        font-size:9px;

    }

}


/* =====================================================
   PORTRAIT
===================================================== */

@media(orientation:portrait){

    #gameFrame{

        transform:
            translate(-50%,-50%)
            rotate(90deg)
            scale(
                min(
                    100vw / 864,
                    100vh / 1536
                )
            );

    }

}

</style>

</head>


<body>


<div id="game">


<div id="gameFrame">


<!-- =====================================================
     BACKGROUND
===================================================== -->

<img
    id="battleBackground"
    src="./tranchien.jpg"
    alt="Trận chiến">


<!-- =====================================================
     TOP
===================================================== -->

<div class="top-ui">


    <div class="wave-box">

        <div class="wave-small">
            NORMAL
        </div>

        <div class="wave-main">
            WAVE 1
        </div>

    </div>


    <div
        id="gold"
        class="gold-box">

        💰 500

    </div>


</div>


<!-- =====================================================
     BATTLEFIELD
===================================================== -->

<div id="battleField">


    <!-- THÁP NHÀ MÌNH -->

    <div
        class="tower tower-left">

        <div class="tower-hp">

            <div
                id="towerHpLeft"
                class="tower-hp-bar">
            </div>

        </div>

    </div>


    <!-- THÁP ĐỊCH -->

    <div
        class="tower tower-right">

        <div class="tower-hp">

            <div
                id="towerHpRight"
                class="tower-hp-bar">
            </div>

        </div>

    </div>


    <!-- VỊ TRÍ SPAWN QUÁI -->

    <div class="spawn-marker"></div>


    <!-- NHÂN VẬT -->

    <div id="units"></div>


    <!-- QUÁI -->

    <div id="enemies"></div>


    <!-- DAMAGE -->

    <div id="damageLayer"></div>


</div>


<!-- =====================================================
     SUMMON BAR
===================================================== -->

<div id="summonBar">


    <div class="energy">

        <div
            id="energyLabel"
            class="energy-label">

            💧 NĂNG LƯỢNG 100 / 100

        </div>


        <div class="energy-bar">

            <div
                id="energyFill"
                class="energy-fill">
            </div>

        </div>

    </div>


    <!-- SUPERMAN -->

    <button
        id="supermanCard"
        class="summon-card">

        <div class="summon-cost">
            💧 50
        </div>


        <img
            src="https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
            alt="Superman">


        <div class="summon-name">
            SUPERMAN
        </div>

    </button>


    <!-- LUFFY CHƯA LÀM -->

    <button
        class="summon-card"
        onclick="showMessage('Luffy sẽ được thêm sau')">

        <div class="summon-cost">
            🔒
        </div>

        <div
            style="
                height:100px;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#8d99a7;
                font-weight:900;
            ">

            LUFFY

        </div>

        <div class="summon-name">
            LUFFY
        </div>

    </button>


    <!-- GOKU CHƯA LÀM -->

    <button
        class="summon-card"
        onclick="showMessage('Goku sẽ được thêm sau')">

        <div class="summon-cost">
            🔒
        </div>

        <div
            style="
                height:100px;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#8d99a7;
                font-weight:900;
            ">

            GOKU

        </div>

        <div class="summon-name">
            GOKU
        </div>

    </button>


</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- WIN -->

<div id="winScreen">

    <div class="win-box">

        <div class="win-title">
            VICTORY!
        </div>

        <div class="win-text">
            Bạn đã phá hủy tháp địch.
        </div>

        <button
            class="win-button"
            onclick="restartBattle()">

            CHƠI LẠI

        </button>

    </div>

</div>


</div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

    MAX_ENERGY:100,

    SUPERMAN_COST:50,

    SUPERMAN_DAMAGE:120,

    ENEMY_HP:500,

    TOWER_HP:1000,

    MOVE_SPEED:3.0,

    ATTACK_DISTANCE:145,

    ATTACK_INTERVAL:850,

    ENEMY_SPAWN_INTERVAL:3000

};


/* =====================================================
   ELEMENTS
===================================================== */

const frame =
    document.getElementById(
        "gameFrame"
    );


const battleField =
    document.getElementById(
        "battleField"
    );


const unitsLayer =
    document.getElementById(
        "units"
    );


const enemiesLayer =
    document.getElementById(
        "enemies"
    );


const damageLayer =
    document.getElementById(
        "damageLayer"
    );


const energyLabel =
    document.getElementById(
        "energyLabel"
    );


const energyFill =
    document.getElementById(
        "energyFill"
    );


const goldElement =
    document.getElementById(
        "gold"
    );


const messageElement =
    document.getElementById(
        "message"
    );


const winScreen =
    document.getElementById(
        "winScreen"
    );


/* =====================================================
   STATE
===================================================== */

let energy = 100;

let gold = 500;

let towerRightHP =
    CONFIG.TOWER_HP;

let towerLeftHP =
    CONFIG.TOWER_HP;

let enemies = [];

let units = [];

let enemyId =
    1;

let unitId =
    1;

let gameWon =
    false;


/* =====================================================
   UI
===================================================== */

function updateEnergy(){

    energyLabel.textContent =
        "💧 NĂNG LƯỢNG " +
        Math.floor(energy) +
        " / " +
        CONFIG.MAX_ENERGY;

    energyFill.style.width =
        (
            energy /
            CONFIG.MAX_ENERGY *
            100
        ) + "%";

}


function updateGold(){

    goldElement.textContent =
        "💰 " +
        gold;

}


function showMessage(
    text
){

    messageElement.textContent =
        text;

    messageElement.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            function(){

                messageElement.classList.remove(
                    "show"
                );

            },
            1100
        );

}


/* =====================================================
   SCALE
===================================================== */

function scaleGame(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    if(
        w >= h
    ){

        const scale =
            Math.min(
                w / 1536,
                h / 864
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

    }
    else{

        const scale =
            Math.min(
                w / 864,
                h / 1536
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "rotate(90deg) " +
            "scale(" +
            scale +
            ")";

    }

}


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);


/* =====================================================
   SUMMON SUPERMAN
   XUẤT HIỆN TRƯỚC NHÀ MÌNH
===================================================== */

function summonSuperman(){

    if(
        gameWon
    ){

        return;

    }


    if(
        energy <
        CONFIG.SUPERMAN_COST
    ){

        showMessage(
            "Không đủ năng lượng!"
        );

        return;

    }


    energy -=
        CONFIG.SUPERMAN_COST;

    updateEnergy();


    const unitElement =
        document.createElement(
            "div"
        );


    unitElement.className =
        "unit superman";


    /*
       Superman xuất hiện
       ngay phía trước tháp nhà mình.
    */

    const startX =
        235;

    const startY =
        385;


    unitElement.style.left =
        startX + "px";

    unitElement.style.top =
        startY + "px";


    unitElement.innerHTML = `

        <div class="unit-image"></div>

    `;


    unitsLayer.appendChild(
        unitElement
    );


    const unit = {

        id:
            unitId++,

        element:
            unitElement,

        x:
            startX,

        y:
            startY,

        hp:
            1000,

        maxHp:
            1000,

        target:
            null,

        targetType:
            null,

        alive:
            true,

        attacking:
            false,

        lastAttack:
            0

    };


    units.push(
        unit
    );


    /*
       Không bay ngay vào tháp.
       Đứng trước nhà, chờ mục tiêu.
    */

    chooseTarget(
        unit
    );


    showMessage(
        "SUPERMAN ĐÃ TRIỆU HỒI!"
    );

}


/* =====================================================
   SUPERMAN BUTTON
===================================================== */

document
    .getElementById(
        "supermanCard"
    )
    .addEventListener(
        "click",
        summonSuperman
    );


/* =====================================================
   SET UNIT POSITION
===================================================== */

function setUnitPosition(
    unit
){

    unit.element.style.left =
        unit.x + "px";

    unit.element.style.top =
        unit.y + "px";

}


/* =====================================================
   FIND NEAREST ENEMY
===================================================== */

function findNearestEnemy(
    unit
){

    let nearest =
        null;

    let nearestDistance =
        Infinity;


    enemies.forEach(
        function(enemy){

            if(
                !enemy.alive
            ){

                return;

            }


            const dx =
                enemy.x -
                unit.x;

            const dy =
                enemy.y -
                unit.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(
                distance <
                nearestDistance
            ){

                nearest =
                    enemy;

                nearestDistance =
                    distance;

            }

        }
    );


    return nearest;

}


/* =====================================================
   CHOOSE TARGET
===================================================== */

function chooseTarget(
    unit
){

    if(
        !unit.alive
    ){

        return;

    }


    /*
       Luôn ưu tiên quái.
    */

    const enemy =
        findNearestEnemy(
            unit
        );


    if(
        enemy
    ){

        unit.target =
            enemy;

        unit.targetType =
            "enemy";

        setFly(
            unit
        );

        return;

    }


    /*
       Không có quái:
       đứng trước nhà, KHÔNG bay đi xa.
    */

    unit.target = null;

    unit.targetType =
        "wait";


    unit.element.classList.remove(
        "fly"
    );

    unit.element.classList.remove(
        "attack"
    );

}


/* =====================================================
   SET FLY
===================================================== */

function setFly(
    unit
){

    if(
        unit.attacking
    ){

        return;

    }


    unit.element.classList.remove(
        "attack"
    );


    unit.element.classList.add(
        "fly"
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(
    unit,
    target
){

    const dx =
        target.x -
        unit.x;

    const dy =
        target.y -
        unit.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   UPDATE UNITS
===================================================== */

function updateUnits(
    now
){

    units.forEach(
        function(unit){

            if(
                !unit.alive
            ){

                return;

            }


            /*
               Nếu đang chờ và có quái mới,
               lấy quái.
            */

            if(
                unit.targetType ===
                "wait"
            ){

                const newEnemy =
                    findNearestEnemy(
                        unit
                    );


                if(
                    newEnemy
                ){

                    unit.target =
                        newEnemy;

                    unit.targetType =
                        "enemy";

                    setFly(
                        unit
                    );

                }


                return;

            }


            /*
               Mất mục tiêu
            */

            if(
                !unit.target ||
                !unit.target.alive
            ){

                chooseTarget(
                    unit
                );

                return;

            }


            const target =
                unit.target;


            const distance =
                getDistance(
                    unit,
                    target
                );


            /*
               CÒN XA
            */

            if(
                distance >
                CONFIG.ATTACK_DISTANCE
            ){

                setFly(
                    unit
                );


                const dx =
                    target.x -
                    unit.x;

                const dy =
                    target.y -
                    unit.y;


                const length =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if(
                    length > 0
                ){

                    unit.x +=
                        dx /
                        length *
                        CONFIG.MOVE_SPEED;


                    /*
                       Bay hợp lý:
                       giữ nhân vật trong
                       đường chiến đấu.
                    */

                    const desiredY =
                        target.y;


                    unit.y +=
                        (
                            desiredY -
                            unit.y
                        ) *
                        .07;

                }


                /*
                   Không vượt qua
                   khu nhà mình.
                */

                unit.x =
                    Math.max(
                        225,
                        Math.min(
                            battlefield.clientWidth - 160,
                            unit.x
                        )
                    );


                /*
                   Không bay quá cao/thấp.
                */

                unit.y =
                    Math.max(
                        200,
                        Math.min(
                            415,
                            unit.y
                        )
                    );


                setUnitPosition(
                    unit
                );


                return;

            }


            /*
               Đã tới gần.
            */

            if(
                now -
                unit.lastAttack >=
                CONFIG.ATTACK_INTERVAL
            ){

                attackEnemy(
                    unit,
                    target,
                    now
                );

            }

        }
    );

}


/* =====================================================
   ATTACK
===================================================== */

function attackEnemy(
    unit,
    enemy,
    now
){

    if(
        unit.attacking ||
        !enemy.alive
    ){

        return;

    }


    unit.attacking =
        true;

    unit.lastAttack =
        now;


    /*
       Hướng mặt
    */

    if(
        enemy.x <
        unit.x
    ){

        unit.element.style.transform =
            "translate(-50%,-50%) " +
            "scale(-.24,.24)";

    }
    else{

        unit.element.style.transform =
            "translate(-50%,-50%) " +
            "scale(.24,.24)";

    }


    /*
       Attack animation
    */

    unit.element.classList.remove(
        "fly"
    );


    void unit.element.offsetWidth;


    unit.element.classList.add(
        "attack"
    );


    /*
       Damage giữa cú đấm
    */

    setTimeout(
        function(){

            if(
                unit.alive &&
                enemy.alive
            ){

                damageEnemy(
                    enemy,
                    CONFIG.SUPERMAN_DAMAGE
                );

            }

        },
        180
    );


    /*
       Kết thúc đấm
    */

    setTimeout(
        function(){

            unit.element.classList.remove(
                "attack"
            );


            unit.attacking =
                false;


            if(
                unit.alive
            ){

                chooseTarget(
                    unit
                );

            }

        },
        430
    );

}


/* =====================================================
   DAMAGE ENEMY
===================================================== */

function damageEnemy(
    enemy,
    damage
){

    if(
        !enemy.alive
    ){

        return;

    }


    enemy.hp -=
        damage;


    if(
        enemy.hp <
        0
    ){

        enemy.hp =
            0;

    }


    enemy.hpBar.style.width =
        (
            enemy.hp /
            enemy.maxHp *
            100
        ) + "%";


    createDamage(
        enemy.x,
        enemy.y,
        damage
    );


    if(
        enemy.hp <= 0
    ){

        killEnemy(
            enemy
        );

    }

}


/* =====================================================
   CREATE DAMAGE
===================================================== */

function createDamage(
    x,
    y,
    damage
){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "damage";


    element.textContent =
        "-" +
        damage;


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    damageLayer.appendChild(
        element
    );


    setTimeout(
        function(){

            element.remove();

        },
        600
    );

}


/* =====================================================
   SPAWN ENEMY
   MỖI 3 GIÂY
===================================================== */

function spawnEnemy(){

    if(
        gameWon
    ){

        return;

    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "enemy";


    element.innerHTML = `

        <div class="enemy-hp">

            <div
                class="enemy-hp-bar">
            </div>

        </div>


        <img
            src="./quai1.png"
            alt="Quái">


        <div class="enemy-name">
            QUÁI
        </div>

    `;


    enemiesLayer.appendChild(
        element
    );


    /*
       Quái sinh ra ngay trước
       tháp địch.
    */

    const startX =
        battlefield.clientWidth -
        220;


    const startY =
        360 +
        (
            Math.random() *
            55
        );


    const enemy = {

        id:
            enemyId++,

        element:
            element,

        x:
            startX,

        y:
            startY,

        hp:
            CONFIG.ENEMY_HP,

        maxHp:
            CONFIG.ENEMY_HP,

        alive:
            true,

        hpBar:
            element.querySelector(
                ".enemy-hp-bar"
            )

    };


    enemies.push(
        enemy
    );


    setEnemyPosition(
        enemy
    );


    /*
       Hiện tại nếu có Superman,
       nó lập tức nhận quái mới.
    */

    units.forEach(
        function(unit){

            if(
                unit.alive &&
                !unit.attacking
            ){

                const current =
                    findNearestEnemy(
                        unit
                    );


                if(
                    current
                ){

                    unit.target =
                        current;

                    unit.targetType =
                        "enemy";

                    setFly(
                        unit
                    );

                }

            }

        }
    );

}


/* =====================================================
   SET ENEMY POSITION
===================================================== */

function setEnemyPosition(
    enemy
){

    enemy.element.style.left =
        enemy.x + "px";


    enemy.element.style.top =
        enemy.y + "px";

}


/* =====================================================
   UPDATE ENEMIES
===================================================== */

function updateEnemies(){

    enemies.forEach(
        function(enemy){

            if(
                !enemy.alive
            ){

                return;

            }


            /*
               Nếu chưa bị Superman áp sát,
               quái tiến về nhà.
            */

            const attacker =
                units.find(
                    function(unit){

                        return (
                            unit.alive &&
                            unit.target ===
                            enemy
                        );

                    }
                );


            if(
                attacker
            ){

                const distance =
                    getDistance(
                        attacker,
                        enemy
                    );


                if(
                    distance <=
                    CONFIG.ATTACK_DISTANCE + 15
                ){

                    return;

                }

            }


            /*
               Quái đi dần sang trái.
            */

            enemy.x -=
                0.65;


            setEnemyPosition(
                enemy
            );


            /*
               Tới gần nhà:
               quái đánh tháp,
               nhưng KHÔNG biến mất ngay.
            */

            const towerZone =
                255;


            if(
                enemy.x <=
                towerZone
            ){

                enemy.x =
                    towerZone;


                setEnemyPosition(
                    enemy
                );

            }

        }
    );

}


/* =====================================================
   QUÁI ĐÁNH THÁP
===================================================== */

let lastEnemyTowerAttack =
    0;


function enemyAttackTower(
    now
){

    const attackers =
        enemies.filter(
            function(enemy){

                return (
                    enemy.alive &&
                    enemy.x <= 260
                );

            }
        );


    if(
        attackers.length === 0
    ){

        return;

    }


    if(
        now -
        lastEnemyTowerAttack <
        1000
    ){

        return;

    }


    lastEnemyTowerAttack =
        now;


    towerLeftHP -=
        attackers.length * 20;


    if(
        towerLeftHP <
        0
    ){

        towerLeftHP =
            0;

    }


    document
        .getElementById(
            "towerHpLeft"
        )
        .style.width =
        (
            towerLeftHP /
            CONFIG.TOWER_HP *
            100
        ) + "%";


    createDamage(
        170,
        335,
        attackers.length *
        20
    );


    if(
        towerLeftHP <=
        0
    ){

        loseGame();

    }

}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(
    enemy
){

    if(
        !enemy.alive
    ){

        return;

    }


    enemy.alive =
        false;


    enemy.element.remove();


    gold += 50;

    updateGold();


    /*
       Superman tìm mục tiêu khác.
    */

    units.forEach(
        function(unit){

            if(
                unit.alive &&
                unit.target ===
                enemy
            ){

                unit.target =
                    null;

                chooseTarget(
                    unit
                );

            }

        }
    );

}


/* =====================================================
   WIN
===================================================== */

function winGame(){

    if(
        gameWon
    ){

        return;

    }


    gameWon =
        true;


    winScreen.style.display =
        "flex";

}


/* =====================================================
   LOSE
===================================================== */

function loseGame(){

    if(
        gameWon
    ){

        return;

    }


    gameWon =
        true;


    showMessage(
        "THÁP NHÀ BẠN ĐÃ BỊ PHÁ!"
    );

}


/* =====================================================
   RESTART
===================================================== */

function restartBattle(){

    window.location.reload();

}


/* =====================================================
   SPAWN QUÁI MỖI 3 GIÂY
===================================================== */

setTimeout(
    function(){

        spawnEnemy();

        setInterval(
            function(){

                spawnEnemy();

            },
            CONFIG.ENEMY_SPAWN_INTERVAL
        );

    },
    3000
);


/* =====================================================
   NĂNG LƯỢNG HỒI
===================================================== */

setInterval(
    function(){

        if(
            energy <
            CONFIG.MAX_ENERGY
        ){

            energy +=
                1;

            if(
                energy >
                CONFIG.MAX_ENERGY
            ){

                energy =
                    CONFIG.MAX_ENERGY;

            }

            updateEnergy();

        }

    },
    500
);


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(
    now
){

    if(
        !gameWon
    ){

        updateUnits(
            now
        );


        updateEnemies();


        enemyAttackTower(
            now
        );

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   START
===================================================== */

updateEnergy();

updateGold();

scaleGame();

requestAnimationFrame(
    gameLoop
);

</script>
