<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>ANIME DORADO - TRẬN CHIẾN</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font:inherit;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}


/* ==================================================
   KHUNG GAME
================================================== */

#gameFrame{
    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}


/* ==================================================
   NỀN
================================================== */

#battleBackground{
    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    object-fit:fill;

    z-index:0;

    user-select:none;
    -webkit-user-drag:none;
}


/* ==================================================
   TOP
================================================== */

.top-ui{
    position:absolute;

    left:0;
    right:0;
    top:0;

    height:74px;

    z-index:50;

    display:flex;
    align-items:center;

    padding:10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.70),
            rgba(0,0,0,0)
        );
}

.wave-box{
    min-width:180px;

    padding:10px 18px;

    border-radius:18px;

    background:rgba(0,0,0,.55);

    border:
        1px solid
        rgba(255,255,255,.25);

    color:#fff;
}

.wave-small{
    color:#9fe3aa;
    font-size:12px;
    font-weight:bold;
}

.wave-main{
    margin-top:2px;
    font-size:20px;
    font-weight:900;
}

.gold-box{
    margin-left:auto;

    min-width:165px;

    padding:10px 16px;

    border-radius:18px;

    background:rgba(0,0,0,.55);

    border:
        1px solid
        rgba(255,214,90,.28);

    color:#ffd65a;

    text-align:center;

    font-size:17px;
    font-weight:900;
}


/* ==================================================
   BATTLE FIELD
================================================== */

#battleField{
    position:absolute;

    left:0;
    top:74px;

    width:1536px;
    height:610px;

    overflow:hidden;

    z-index:5;
}


/* ==================================================
   TOWER
================================================== */

.tower{
    position:absolute;

    bottom:92px;

    width:116px;
    height:145px;

    border:
        3px solid
        rgba(235,247,255,.9);

    border-radius:
        22px 22px 9px 9px;

    background:
        linear-gradient(
            180deg,
            #819aa9,
            #334b59
        );

    box-shadow:
        0 12px 28px
        rgba(0,0,0,.4),

        inset 0 2px 0
        rgba(255,255,255,.32);

    z-index:12;
}

.tower::before{
    content:"";

    position:absolute;

    left:13%;
    right:13%;

    top:-35px;

    height:46px;

    border:
        3px solid
        rgba(235,247,255,.9);

    border-radius:
        18px 18px 7px 7px;

    background:
        linear-gradient(
            180deg,
            #91aebb,
            #425a68
        );
}

.tower::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:
        translateX(-50%);

    width:38px;
    height:58px;

    border-radius:
        18px 18px 0 0;

    background:#15222b;
}

.tower-left{
    left:120px;
}

.tower-right{
    right:120px;
}


/* ==================================================
   TOWER HP
================================================== */

.tower-hp{
    position:absolute;

    left:50%;
    top:-17px;

    transform:
        translateX(-50%);

    width:150px;
    height:11px;

    border-radius:10px;

    overflow:hidden;

    background:#250d12;

    border:
        1px solid
        rgba(255,255,255,.3);
}

.tower-hp-bar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #30da50,
            #a3ff53
        );

    transition:
        width .2s linear;
}


/* ==================================================
   SUPERMAN
================================================== */

.unit{
    position:absolute;

    width:384px;
    height:939px;

    z-index:30;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.24);

    transform-origin:
        center center;
}

.unit-image{
    width:384px;
    height:939px;

    background-repeat:no-repeat;
    background-position:0 0;

    display:block;
}


/* ==================================================
   SUPERMAN IDLE
================================================== */

.superman .unit-image{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;
}


/* ==================================================
   BAY
================================================== */

.superman.fly .unit-image{

    width:384px;
    height:688px;

    background-image:
        url(
            "https://i.postimg.cc/7ZWX0Vpr/20260812-191835.png"
        );

    background-size:
        1536px 688px;

    animation:
        supermanFly
        .6s
        steps(4)
        infinite;
}

@keyframes supermanFly{

    from{
        background-position:0 0;
    }

    to{
        background-position:-1536px 0;
    }
}


/* ==================================================
   ĐẤM
================================================== */

.superman.attack .unit-image{

    width:384px;
    height:939px;

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

    animation:
        supermanAttack
        .42s
        steps(4)
        1;
}

@keyframes supermanAttack{

    from{
        background-position:0 0;
    }

    to{
        background-position:-1536px 0;
    }
}


/* ==================================================
   QUÁI
================================================== */

.enemy{
    position:absolute;

    width:90px;
    height:90px;

    z-index:25;

    display:flex;

    align-items:center;
    justify-content:center;
}

.enemy img{
    width:90px;
    height:90px;

    object-fit:contain;

    display:block;
}

.enemy-hp{
    position:absolute;

    left:50%;
    top:-12px;

    transform:
        translateX(-50%);

    width:88px;
    height:8px;

    background:#2b0910;

    border-radius:8px;

    overflow:hidden;
}

.enemy-hp-bar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff3131,
            #ff9b32
        );

    transition:
        width .2s linear;
}

.enemy-name{
    position:absolute;

    left:50%;
    bottom:-18px;

    transform:
        translateX(-50%);

    color:#fff;

    font-size:10px;
    font-weight:900;

    white-space:nowrap;

    text-shadow:
        0 2px 4px #000;
}


/* ==================================================
   TRIỆU HỒI BAR
================================================== */

#summonBar{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:180px;

    z-index:100;

    padding:14px 20px;

    display:flex;

    align-items:center;

    gap:12px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.04),
            rgba(0,0,0,.88)
        );
}

.energy{
    width:230px;
    flex:0 0 230px;
}

.energy-label{
    color:#fff;

    font-size:12px;
    font-weight:900;

    margin-bottom:5px;
}

.energy-bar{
    width:100%;
    height:14px;

    border-radius:12px;

    background:#151d27;

    border:
        1px solid
        rgba(255,255,255,.18);

    overflow:hidden;
}

.energy-fill{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #5c7dff,
            #8ad8ff
        );
}


/* ==================================================
   SUMMON CARD
================================================== */

.summon-card{
    position:relative;

    width:125px;
    height:142px;

    flex:0 0 125px;

    border:
        2px solid
        rgba(255,214,90,.5);

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #865d1e,
            #35230e
        );

    color:#fff;

    overflow:hidden;

    cursor:pointer;
}

.summon-card:active{
    transform:scale(.96);
}

.summon-card img{
    width:100%;
    height:100px;

    display:block;

    object-fit:contain;
}

.summon-name{
    position:absolute;

    left:0;
    right:0;
    bottom:4px;

    text-align:center;

    font-size:11px;
    font-weight:900;
}

.summon-cost{
    position:absolute;

    right:5px;
    top:5px;

    padding:4px 7px;

    border-radius:9px;

    background:
        rgba(0,0,0,.72);

    color:#ffd65a;

    font-size:10px;
    font-weight:900;

}


/* ==================================================
   DAMAGE
================================================== */

.damage{
    position:absolute;

    z-index:100;

    pointer-events:none;

    color:#ffd65a;

    font-size:30px;

    font-weight:1000;

    text-shadow:
        0 3px 7px #000;

    animation:
        damageFloat
        .55s
        ease-out
        forwards;
}

@keyframes damageFloat{

    from{
        opacity:1;

        transform:
            translateY(0)
            scale(.8);
    }

    to{
        opacity:0;

        transform:
            translateY(-60px)
            scale(1.15);
    }
}


/* ==================================================
   MESSAGE
================================================== */

#message{
    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%);

    z-index:200;

    min-width:270px;

    padding:
        16px
        24px;

    border:
        1px solid
        rgba(255,214,90,.4);

    border-radius:15px;

    background:
        rgba(0,0,0,.84);

    color:#ffd65a;

    text-align:center;

    font-size:15px;
    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s;
}

#message.show{
    opacity:1;
}


/* ==================================================
   WIN
================================================== */

#winScreen{
    position:absolute;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(5px);
}

.win-box{
    width:min(
        470px,
        90vw
    );

    padding:35px 25px;

    text-align:center;

    border:
        2px solid
        #ffd65a;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            #28405a,
            #111c29
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);
}

.win-title{

    color:#ffd65a;

    font-size:
        clamp(
            35px,
            10vw,
            60px
        );

    font-weight:1000;
}

.win-text{

    margin-top:10px;

    color:#d3dbe5;

    font-size:14px;
}

.win-button{

    margin-top:22px;

    min-width:190px;

    height:50px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:800px){

    #summonBar{

        height:150px;

        padding:8px;

        gap:7px;
    }

    .energy{

        width:120px;

        flex-basis:120px;
    }

    .summon-card{

        width:88px;

        height:112px;

        flex-basis:88px;
    }

    .summon-card img{

        height:78px;
    }

    .summon-name{

        font-size:9px;
    }

}


/* ==================================================
   PORTRAIT
================================================== */

@media(orientation:portrait){

    #gameFrame{

        transform:
            translate(-50%,-50%)
            rotate(90deg)
            scale(
                min(
                    100vw / 864px,
                    100vh / 1536px
                )
            );
    }

}

</style>

</head>


<body>

<div id="game">

<div id="gameFrame">


<!-- ==================================================
     NỀN
================================================== -->

<img
    id="battleBackground"
    src="./tranchien.jpg"
    alt="Trận chiến">


<!-- ==================================================
     TOP UI
================================================== -->

<div class="top-ui">

    <div class="wave-box">

        <div class="wave-small">
            NORMAL
        </div>

        <div class="wave-main">
            WAVE 1
        </div>

    </div>


    <div
        id="gold"
        class="gold-box">

        💰 500

    </div>

</div>


<!-- ==================================================
     BATTLEFIELD
================================================== -->

<div id="battleField">


    <!-- THÁP CỦA BẠN -->

    <div
        id="towerLeft"
        class="tower tower-left">

        <div class="tower-hp">

            <div
                id="towerHpLeft"
                class="tower-hp-bar">
            </div>

        </div>

    </div>


    <!-- THÁP ĐỊCH -->

    <div
        id="towerRight"
        class="tower tower-right">

        <div class="tower-hp">

            <div
                id="towerHpRight"
                class="tower-hp-bar">
            </div>

        </div>

    </div>


    <!-- NHÂN VẬT -->

    <div id="units"></div>


    <!-- QUÁI -->

    <div id="enemies"></div>


    <!-- DAMAGE -->

    <div id="damageLayer"></div>

</div>


<!-- ==================================================
     TRIỆU HỒI
================================================== -->

<div id="summonBar">


    <div class="energy">

        <div
            id="energyLabel"
            class="energy-label">

            💧 NĂNG LƯỢNG 100 / 100

        </div>


        <div class="energy-bar">

            <div
                id="energyFill"
                class="energy-fill">
            </div>

        </div>

    </div>


    <!-- SUPERMAN -->

    <button
        id="supermanCard"
        class="summon-card">

        <div class="summon-cost">
            💧 50
        </div>

        <img
            src="https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
            alt="Superman">

        <div class="summon-name">
            SUPERMAN
        </div>

    </button>


    <!-- SAU NÀY -->

    <button
        class="summon-card"
        onclick="showMessage('Luffy sẽ làm sau')">

        <div class="summon-cost">
            🔒
        </div>

        <div
            style="
                height:100px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:900;
                color:#8994a2;
            ">

            LUFFY

        </div>

        <div class="summon-name">
            LUFFY
        </div>

    </button>


    <button
        class="summon-card"
        onclick="showMessage('Goku sẽ làm sau')">

        <div class="summon-cost">
            🔒
        </div>

        <div
            style="
                height:100px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:900;
                color:#8994a2;
            ">

            GOKU

        </div>

        <div class="summon-name">
            GOKU
        </div>

    </button>


</div>


<!-- ==================================================
     MESSAGE
================================================== -->

<div id="message"></div>


<!-- ==================================================
     WIN
================================================== -->

<div id="winScreen">

    <div class="win-box">

        <div class="win-title">
            VICTORY!
        </div>

        <div class="win-text">
            Bạn đã đánh bại mục tiêu.
        </div>

        <button
            class="win-button"
            onclick="restartBattle()">

            CHƠI LẠI

        </button>

    </div>

</div>


</div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const CONFIG = {

    MAX_ENERGY:100,

    SUPERMAN_COST:50,

    SUPERMAN_DAMAGE:120,

    ENEMY_HP:500,

    TOWER_HP:1000,

    ATTACK_DISTANCE:155,

    MOVE_SPEED:3.0,

    ATTACK_TIME:850,

    ENEMY_SPAWN_DELAY:5000

};


/* ==================================================
   ELEMENTS
================================================== */

const battlefield =
    document.getElementById(
        "battleField"
    );

const unitsLayer =
    document.getElementById(
        "units"
    );

const enemiesLayer =
    document.getElementById(
        "enemies"
    );

const damageLayer =
    document.getElementById(
        "damageLayer"
    );

const energyLabel =
    document.getElementById(
        "energyLabel"
    );

const energyFill =
    document.getElementById(
        "energyFill"
    );

const goldElement =
    document.getElementById(
        "gold"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const winScreen =
    document.getElementById(
        "winScreen"
    );


/* ==================================================
   STATE
================================================== */

let energy = 100;

let gold = 500;

let towerRightHP =
    CONFIG.TOWER_HP;

let towerLeftHP =
    CONFIG.TOWER_HP;

let enemies = [];

let units = [];

let nextEnemyId = 1;

let nextUnitId = 1;

let gameWon = false;


/* ==================================================
   UI
================================================== */

function updateEnergy(){

    energyLabel.textContent =
        "💧 NĂNG LƯỢNG " +
        Math.floor(energy) +
        " / 100";

    energyFill.style.width =
        (
            energy /
            CONFIG.MAX_ENERGY *
            100
        ) + "%";

}


function updateGold(){

    goldElement.textContent =
        "💰 " + gold;

}


function showMessage(
    text
){

    messageElement.textContent =
        text;

    messageElement.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            function(){

                messageElement.classList.remove(
                    "show"
                );

            },
            1200
        );

}


/* ==================================================
   SCALE
================================================== */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    if(
        w >= h
    ){

        const scale =
            Math.min(
                w / 1536,
                h / 864
            );

        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

    }
    else{

        const scale =
            Math.min(
                w / 864,
                h / 1536
            );

        frame.style.transform =
            "translate(-50%,-50%) " +
            "rotate(90deg) " +
            "scale(" +
            scale +
            ")";

    }

}


window.addEventListener(
    "resize",
    scaleGame
);


/* ==================================================
   SUMMON SUPERMAN
================================================== */

function summonSuperman(){

    if(
        gameWon
    ){

        return;

    }


    if(
        energy <
        CONFIG.SUPERMAN_COST
    ){

        showMessage(
            "Không đủ năng lượng!"
        );

        return;

    }


    energy -=
        CONFIG.SUPERMAN_COST;

    updateEnergy();


    const element =
        document.createElement(
            "div"
        );

    element.className =
        "unit superman";


    /*
       Spawn phía trái.
    */

    const startX =
        battlefield.clientWidth *
        0.30;

    const startY =
        battlefield.clientHeight *
        0.52;


    element.style.left =
        startX + "px";

    element.style.top =
        startY + "px";


    element.innerHTML = `

        <div class="unit-image"></div>

    `;


    unitsLayer.appendChild(
        element
    );


    const unit = {

        id:
            nextUnitId++,

        type:
            "superman",

        element:
            element,

        x:
            startX,

        y:
            startY,

        hp:
            1000,

        maxHp:
            1000,

        target:
            null,

        targetType:
            null,

        lastAttack:
            0,

        attacking:
            false,

        alive:
            true

    };


    units.push(
        unit
    );


    setUnitPosition(
        unit
    );


    showMessage(
        "SUPERMAN ĐÃ TRIỆU HỒI!"
    );


    /*
       QUAN TRỌNG:
       Ngay cả khi chưa có quái,
       Superman vẫn có mục tiêu là tháp.
    */

    chooseTarget(
        unit
    );

}


/* ==================================================
   BUTTON
================================================== */

document
    .getElementById(
        "supermanCard"
    )
    .addEventListener(
        "click",
        summonSuperman
    );


/* ==================================================
   SET POSITION
================================================== */

function setUnitPosition(
    unit
){

    unit.element.style.left =
        unit.x + "px";

    unit.element.style.top =
        unit.y + "px";

}


/* ==================================================
   CHOOSE TARGET
================================================== */

function chooseTarget(
    unit
){

    if(
        !unit.alive
    ){

        return;

    }


    /*
       ƯU TIÊN QUÁI
    */

    const aliveEnemy =
        enemies.find(
            function(enemy){

                return enemy.alive;

            }
        );


    if(
        aliveEnemy
    ){

        unit.target =
            aliveEnemy;

        unit.targetType =
            "enemy";

        setFlyState(
            unit
        );

        return;

    }


    /*
       KHÔNG CÓ QUÁI
       → ĐI ĐÁNH THÁP.
    */

    unit.target =
        {
            type:"tower",
            x:
                battlefield.clientWidth *
                0.90,
            y:
                battlefield.clientHeight *
                0.55
        };

    unit.targetType =
        "tower";

    setFlyState(
        unit
    );

}


/* ==================================================
   FLY STATE
================================================== */

function setFlyState(
    unit
){

    if(
        unit.attacking
    ){

        return;

    }


    unit.element.classList.remove(
        "attack"
    );

    unit.element.classList.add(
        "fly"
    );

}


/* ==================================================
   ATTACK STATE
================================================== */

function setAttackState(
    unit
){

    unit.element.classList.remove(
        "fly"
    );

    /*
       Reset animation.
    */

    void unit.element.offsetWidth;

    unit.element.classList.add(
        "attack"
    );

}


/* ==================================================
   DISTANCE
================================================== */

function distanceTo(
    unit,
    target
){

    const dx =
        target.x -
        unit.x;

    const dy =
        target.y -
        unit.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ==================================================
   UPDATE UNITS
================================================== */

function updateUnits(
    time
){

    units.forEach(
        function(unit){

            if(
                !unit.alive
            ){

                return;

            }


            /*
               Nếu quái mới xuất hiện,
               ưu tiên quái.
            */

            if(
                unit.targetType ===
                "tower"
            ){

                const enemy =
                    enemies.find(
                        function(e){

                            return e.alive;

                        }
                    );


                if(
                    enemy
                ){

                    unit.target =
                        enemy;

                    unit.targetType =
                        "enemy";

                    setFlyState(
                        unit
                    );

                }

            }


            if(
                !unit.target
            ){

                chooseTarget(
                    unit
                );

                return;

            }


            const target =
                unit.target;


            const dist =
                distanceTo(
                    unit,
                    target
                );


            /*
               CHƯA ĐẾN MỤC TIÊU
            */

            if(
                dist >
                CONFIG.ATTACK_DISTANCE
            ){

                setFlyState(
                    unit
                );


                const dx =
                    target.x -
                    unit.x;

                const dy =
                    target.y -
                    unit.y;


                const length =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if(
                    length > 0
                ){

                    unit.x +=
                        dx /
                        length *
                        CONFIG.MOVE_SPEED;

                    unit.y +=
                        dy /
                        length *
                        CONFIG.MOVE_SPEED;

                }


                setUnitPosition(
                    unit
                );


                return;

            }


            /*
               ĐÃ ĐẾN MỤC TIÊU
            */

            if(
                time -
                unit.lastAttack <
                CONFIG.ATTACK_TIME
            ){

                return;

            }


            if(
                unit.attacking
            ){

                return;

            }


            unit.lastAttack =
                time;

            attackTarget(
                unit
            );

        }
    );

}


/* ==================================================
   ATTACK TARGET
================================================== */

function attackTarget(
    unit
){

    if(
        !unit.target
    ){

        return;

    }


    unit.attacking =
        true;


    /*
       ĐẤM.
    */

    setAttackState(
        unit
    );


    /*
       Gây damage giữa animation.
    */

    setTimeout(
        function(){

            if(
                !unit.alive
            ){

                return;

            }


            if(
                unit.targetType ===
                "enemy"
            ){

                const enemy =
                    unit.target;

                if(
                    enemy &&
                    enemy.alive
                ){

                    damageEnemy(
                        enemy,
                        CONFIG.SUPERMAN_DAMAGE
                    );

                }

            }
            else{

                damageTower(
                    120
                );

            }

        },
        180
    );


    /*
       Xong animation.
    */

    setTimeout(
        function(){

            unit.attacking =
                false;


            unit.element.classList.remove(
                "attack"
            );


            if(
                unit.alive
            ){

                chooseTarget(
                    unit
                );

            }

        },
        440
    );

}


/* ==================================================
   DAMAGE ENEMY
================================================== */

function damageEnemy(
    enemy,
    damage
){

    if(
        !enemy.alive
    ){

        return;

    }


    enemy.hp -=
        damage;


    if(
        enemy.hp < 0
    ){

        enemy.hp =
            0;

    }


    enemy.hpBar.style.width =
        (
            enemy.hp /
            enemy.maxHp *
            100
        ) + "%";


    createDamage(
        enemy.x,
        enemy.y,
        damage
    );


    if(
        enemy.hp <= 0
    ){

        killEnemy(
            enemy
        );

    }

}


/* ==================================================
   DAMAGE TOWER
================================================== */

function damageTower(
    damage
){

    if(
        gameWon
    ){

        return;

    }


    towerRightHP -=
        damage;


    if(
        towerRightHP < 0
    ){

        towerRightHP =
            0;

    }


    document
        .getElementById(
            "towerHpRight"
        )
        .style.width =
        (
            towerRightHP /
            CONFIG.TOWER_HP *
            100
        ) + "%";


    createDamage(
        battlefield.clientWidth *
            .90,

        battlefield.clientHeight *
            .42,

        damage
    );


    if(
        towerRightHP <= 0
    ){

        winGame();

    }

}


/* ==================================================
   CREATE DAMAGE
================================================== */

function createDamage(
    x,
    y,
    damage
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "damage";

    element.textContent =
        "-" +
        damage;

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    damageLayer.appendChild(
        element
    );


    setTimeout(
        function(){

            element.remove();

        },
        600
    );

}


/* ==================================================
   SPAWN ENEMY
================================================== */

function spawnEnemy(){

    if(
        gameWon
    ){

        return;

    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "enemy";


    element.innerHTML = `

        <div class="enemy-hp">

            <div
                class="enemy-hp-bar">
            </div>

        </div>

        <img
            src="./quai1.png"
            alt="Quái">

        <div class="enemy-name">
            QUÁI
        </div>

    `;


    enemiesLayer.appendChild(
        element
    );


    const startX =
        battlefield.clientWidth -
        150;

    const startY =
        battlefield.clientHeight *
        .53;


    const enemy = {

        id:
            nextEnemyId++,

        element:
            element,

        x:
            startX,

        y:
            startY,

        hp:
            CONFIG.ENEMY_HP,

        maxHp:
            CONFIG.ENEMY_HP,

        alive:
            true,

        hpBar:
            element.querySelector(
                ".enemy-hp-bar"
            )

    };


    enemies.push(
        enemy
    );


    positionEnemy(
        enemy
    );


    showMessage(
        "QUÁI ĐÃ XUẤT HIỆN!"
    );


    /*
       Tất cả Superman đang đánh tháp
       sẽ chuyển sang quái.
    */

    units.forEach(
        function(unit){

            if(
                unit.alive
            ){

                unit.target =
                    enemy;

                unit.targetType =
                    "enemy";

            }

        }
    );

}


/* ==================================================
   POSITION ENEMY
================================================== */

function positionEnemy(
    enemy
){

    enemy.element.style.left =
        enemy.x + "px";

    enemy.element.style.top =
        enemy.y + "px";

}


/* ==================================================
   MOVE ENEMY
================================================== */

function updateEnemies(){

    enemies.forEach(
        function(enemy){

            if(
                !enemy.alive
            ){

                return;

            }


            /*
               Nếu Superman đang ở gần,
               quái đứng lại.
            */

            const hasAttacker =
                units.some(
                    function(unit){

                        return (
                            unit.alive &&
                            unit.target ===
                            enemy &&
                            distanceTo(
                                unit,
                                enemy
                            )
                            <=
                            CONFIG.ATTACK_DISTANCE
                        );

                    }
                );


            if(
                hasAttacker
            ){

                return;

            }


            /*
               Quái đi về tháp bên phải.
            */

            enemy.x -=
                0.7;


            positionEnemy(
                enemy
            );


            /*
               Nếu quái tới tháp.
            */

            if(
                enemy.x <=
                battlefield.clientWidth -
                160
            ){

                damageTower(
                    40
                );

                killEnemy(
                    enemy
                );

            }

        }
    );

}


/* ==================================================
   KILL ENEMY
================================================== */

function killEnemy(
    enemy
){

    if(
        !enemy.alive
    ){

        return;

    }


    enemy.alive =
        false;


    enemy.element.remove();


    gold += 50;

    updateGold();


    /*
       Superman tìm mục tiêu mới.
    */

    units.forEach(
        function(unit){

            if(
                unit.alive
            ){

                unit.target =
                    null;

                chooseTarget(
                    unit
                );

            }

        }
    );

}


/* ==================================================
   WIN
================================================== */

function winGame(){

    if(
        gameWon
    ){

        return;

    }


    gameWon =
        true;


    units.forEach(
        function(unit){

            unit.alive =
                false;

        }
    );


    document
        .getElementById(
            "winScreen"
        )
        .style.display =
        "flex";


    showMessage(
        "CHIẾN THẮNG!"
    );

}


/* ==================================================
   RESTART
================================================== */

function restartBattle(){

    window.location.reload();

}


/* ==================================================
   START ENEMY TIMER
================================================== */

setTimeout(
    function(){

        spawnEnemy();

    },
    CONFIG.ENEMY_SPAWN_DELAY
);


/* ==================================================
   ENERGY REGEN
================================================== */

setInterval(
    function(){

        if(
            energy <
            CONFIG.MAX_ENERGY
        ){

            energy +=
                1;

            if(
                energy >
                CONFIG.MAX_ENERGY
            ){

                energy =
                    CONFIG.MAX_ENERGY;

            }

            updateEnergy();

        }

    },
    500
);


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(
    time
){

    if(
        !gameWon
    ){

        updateUnits(
            time
        );

        updateEnemies();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* ==================================================
   START
================================================== */

updateEnergy();

updateGold();

scaleGame();

requestAnimationFrame(
    gameLoop
);

</script>
