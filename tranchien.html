<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no">

<title>ANIME DORADO - TRẬN CHIẾN</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font:inherit;
}


/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#frame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}


/* =========================================================
   NỀN
========================================================= */

#battleBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    object-fit:fill;

    z-index:0;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================================================
   TOP UI
========================================================= */

#topUI{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:78px;

    z-index:100;

    padding:10px 18px;

    display:flex;

    align-items:center;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.72),
            transparent
        );
}

.waveBox{

    min-width:185px;

    padding:9px 17px;

    border-radius:16px;

    background:rgba(0,0,0,.52);

    border:
        1px solid
        rgba(255,255,255,.22);

    color:#fff;
}

.waveSmall{

    font-size:11px;

    color:#9fe1aa;

    font-weight:900;
}

.waveMain{

    margin-top:2px;

    font-size:19px;

    font-weight:1000;
}

.energyTop{

    margin-left:14px;

    width:220px;
}

.energyText{

    color:#fff;

    font-size:11px;

    font-weight:900;

    margin-bottom:5px;
}

.energyBar{

    width:100%;

    height:12px;

    overflow:hidden;

    border-radius:10px;

    background:#131c27;

    border:
        1px solid
        rgba(255,255,255,.16);
}

.energyFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #4e7cff,
            #8bd8ff
        );
}

.goldBox{

    margin-left:auto;

    min-width:150px;

    padding:10px 15px;

    border-radius:16px;

    background:rgba(0,0,0,.52);

    border:
        1px solid
        rgba(255,214,90,.25);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:1000;
}


/* =========================================================
   BATTLE FIELD
========================================================= */

#battleField{

    position:absolute;

    left:0;
    top:78px;

    width:1536px;
    height:606px;

    overflow:hidden;

    z-index:5;
}


/* =========================================================
   ĐƯỜNG CHIẾN ĐẤU
========================================================= */

#battleLane{

    position:absolute;

    left:145px;

    right:145px;

    bottom:210px;

    height:150px;

    border-radius:80px;

    background:
        rgba(85,62,39,.20);

    pointer-events:none;

}


/* =========================================================
   THÁP
========================================================= */

.tower{

    position:absolute;

    bottom:95px;

    width:118px;

    height:150px;

    border:
        3px solid
        rgba(236,247,255,.92);

    border-radius:
        20px
        20px
        9px
        9px;

    background:
        linear-gradient(
            180deg,
            #839dac,
            #344c59
        );

    box-shadow:
        0 14px 28px
        rgba(0,0,0,.4);

    z-index:12;

}

.tower::before{

    content:"";

    position:absolute;

    left:12%;

    right:12%;

    top:-37px;

    height:48px;

    border:
        3px solid
        rgba(236,247,255,.92);

    border-radius:
        18px
        18px
        8px
        8px;

    background:
        linear-gradient(
            180deg,
            #90aeba,
            #405a67
        );
}

.tower::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:0;

    transform:
        translateX(-50%);

    width:40px;

    height:58px;

    border-radius:
        18px
        18px
        0
        0;

    background:#17252d;
}

.playerTower{

    left:95px;

}

.enemyTower{

    right:95px;

}


/* =========================================================
   THÁP HP
========================================================= */

.towerHP{

    position:absolute;

    left:50%;

    top:-19px;

    transform:
        translateX(-50%);

    width:150px;

    height:11px;

    border-radius:10px;

    overflow:hidden;

    background:#250b10;

    border:
        1px solid
        rgba(255,255,255,.25);
}

.towerHPFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #2fd950,
            #a3ff52
        );

    transition:
        width .15s linear;
}


/* =========================================================
   UNITS
========================================================= */

.unit{

    position:absolute;

    width:110px;

    height:125px;

    z-index:30;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

}


/* =========================================================
   SUPERMAN SPRITE
========================================================= */

.sprite{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.22);

    transform-origin:center center;

    width:384px;

    height:939px;

    background-repeat:no-repeat;

    background-position:0 0;
}


/* =========================================================
   SUPERMAN IDLE
========================================================= */

.superman .sprite{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;
}


/* =========================================================
   SUPERMAN ATTACK
========================================================= */

.superman.attacking .sprite{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

    animation:
        supermanAttack
        .42s
        steps(4)
        1;
}

@keyframes supermanAttack{

    from{
        background-position:0 0;
    }

    to{
        background-position:-1536px 0;
    }

}


/* =========================================================
   QUÁI
========================================================= */

.enemy{

    position:absolute;

    width:82px;

    height:92px;

    z-index:28;

    pointer-events:none;

}

.enemy img{

    width:82px;

    height:82px;

    object-fit:contain;

    display:block;

}


/* =========================================================
   QUÁI HP
========================================================= */

.enemyHP{

    position:absolute;

    left:50%;

    top:-9px;

    transform:
        translateX(-50%);

    width:78px;

    height:7px;

    border-radius:7px;

    overflow:hidden;

    background:#28080d;
}

.enemyHPFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff3030,
            #ff9830
        );
}


/* =========================================================
   DAMAGE
========================================================= */

.damage{

    position:absolute;

    z-index:200;

    pointer-events:none;

    color:#ffd65a;

    font-size:25px;

    font-weight:1000;

    text-shadow:
        0 3px 6px #000;

    animation:
        damageUp
        .55s
        ease-out
        forwards;
}

@keyframes damageUp{

    from{

        opacity:1;

        transform:
            translateY(0)
            scale(.8);

    }

    to{

        opacity:0;

        transform:
            translateY(-48px)
            scale(1.12);

    }

}


/* =========================================================
   SUMMON BAR
========================================================= */

#summonBar{

    position:absolute;

    left:0;
    bottom:0;

    width:1536px;
    height:180px;

    z-index:150;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        10px 18px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );
}

.summonCard{

    position:relative;

    width:120px;
    height:140px;

    flex:0 0 120px;

    border:
        2px solid
        #d9a83c;

    border-radius:15px;

    background:
        linear-gradient(
            #77521b,
            #2e1f0b
        );

    overflow:hidden;

    cursor:pointer;

}

.summonCard img{

    width:100%;

    height:103px;

    object-fit:contain;

}

.summonName{

    position:absolute;

    left:0;
    right:0;
    bottom:5px;

    text-align:center;

    color:#fff;

    font-size:10px;

    font-weight:900;

}

.cost{

    position:absolute;

    right:5px;
    top:5px;

    padding:4px 6px;

    border-radius:8px;

    background:#050505;

    color:#ffd65a;

    font-size:9px;

    font-weight:900;

}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    position:absolute;

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    z-index:400;

    padding:
        13px 20px;

    border-radius:12px;

    background:
        rgba(0,0,0,.8);

    border:
        1px solid
        rgba(255,214,90,.3);

    color:#ffd65a;

    font-size:14px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .18s;
}

#message.show{

    opacity:1;

}


/* =========================================================
   RESULT
========================================================= */

#result{

    position:absolute;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.74);

    backdrop-filter:blur(4px);

}

.resultBox{

    width:min(
        430px,
        88vw
    );

    padding:30px 22px;

    border:
        2px solid
        #ffd65a;

    border-radius:22px;

    background:#162433;

    text-align:center;

    color:#fff;

}

.resultTitle{

    color:#ffd65a;

    font-size:48px;

    font-weight:1000;

}

.resultButton{

    margin-top:18px;

    width:175px;

    height:46px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #summonBar{

        height:145px;

        padding:6px;

        gap:6px;

    }

    .summonCard{

        width:88px;

        height:108px;

        flex-basis:88px;

    }

    .summonCard img{

        height:77px;

    }

}


/* =========================================================
   PORTRAIT
========================================================= */

@media(orientation:portrait){

    #frame{

        transform:
            translate(-50%,-50%)
            rotate(90deg);

    }

}

</style>

</head>

<body>

<div id="game">

<div id="frame">


<!-- =========================================================
     NỀN
========================================================= -->

<img
    id="battleBackground"
    src="./tranchien.jpg"
    alt="Trận chiến">


<!-- =========================================================
     TOP
========================================================= -->

<div id="topUI">

    <div class="waveBox">

        <div class="waveSmall">
            NORMAL
        </div>

        <div class="waveMain">
            WAVE 1
        </div>

    </div>


    <div class="energyTop">

        <div class="energyText">

            🔋 NĂNG LƯỢNG

            <span id="energyText">
                100
            </span>
            /100

        </div>

        <div class="energyBar">

            <div
                id="energyFill"
                class="energyFill">
            </div>

        </div>

    </div>


    <div
        id="gold"
        class="goldBox">

        💰 500

    </div>

</div>


<!-- =========================================================

========================================================= -->

<div id="battleField">


    <div id="battleLane"></div>


    <!-- THÁP MÌNH -->

    <!-- THÁP ĐỊCH -->

<!-- =========================================================
     SUMMON
========================================================= -->

<div id="summonBar">


    <!-- SUPERMAN -->

    <button
        id="supermanCard"
        class="summonCard">

        <span class="cost">
            🔋 20
        </span>

        <img
            src="https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
            alt="Superman">

        <span class="summonName">
            SUPERMAN
        </span>

    </button>


    <!-- LUFFY -->
    <button
        class="summonCard"
        onclick="showMessage('Luffy sẽ được thêm sau')">

        <span class="cost">
            🔒
        </span>

        <span
            style="
                display:flex;
                width:100%;
                height:103px;
                align-items:center;
                justify-content:center;
                color:#8994a1;
                font-weight:900;
            "
        >
            LUFFY
        </span>

        <span class="summonName">
            LUFFY
        </span>

    </button>


    <!-- GOKU -->
    <button
        class="summonCard"
        onclick="showMessage('Goku sẽ được thêm sau')">

        <span class="cost">
            🔒
        </span>

        <span
            style="
                display:flex;
                width:100%;
                height:103px;
                align-items:center;
                justify-content:center;
                color:#8994a1;
                font-weight:900;
            "
        >

        <span class="summonName">

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- RESULT -->

<div id="result">

    <div class="resultBox">

        <div
            id="resultTitle"
            class="resultTitle">

        </div>

        <div
            id="resultText">

            Tháp địch đã bị phá hủy.

        </div>

        <button
            class="resultButton"

            CHƠI LẠI

        </button>

    </div>

</div>


</div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    MAX_ENERGY:
        100,

    ENERGY_REGEN:
        4,

    SUPERMAN_COST:
        20,

    SUPERMAN_HP:
        600,

    SUPERMAN_ATK:
        100,

    SUPERMAN_SPEED:
        1.35,

    SUPERMAN_ATTACK_RANGE:
        115,

    SUPERMAN_ATTACK_COOLDOWN:
        850,

    ENEMY_HP:
        260,

    ENEMY_ATK:
        35,

    ENEMY_SPEED:
        0.75,

    ENEMY_ATTACK_RANGE:
        90,

    ENEMY_ATTACK_COOLDOWN:
        1000,

    ENEMY_SPAWN_TIME:
        3000,

    TOWER_HP:
        1200,

    TOWER_ATTACK_COOLDOWN:
        1000

};


/* =========================================================
   ELEMENTS
========================================================= */

const battleField =
    document.getElementById(
        "battleField"
    );

const playerUnitsBox =
    document.getElementById(
        "playerUnits"
    );

const enemyUnitsBox =
    document.getElementById(
        "enemyUnits"
    );

const damageLayer =
    document.getElementById(
        "damageLayer"
    );

const playerTowerHP =
    document.getElementById(
        "playerTowerHP"
    );

const enemyTowerHP =
    document.getElementById(
        "enemyTowerHP"
    );

const energyText =
    document.getElementById(
        "energyText"
    );

const energyFill =
    document.getElementById(
        "energyFill"
    );

const goldElement =
    document.getElementById(
        "gold"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const resultElement =
    document.getElementById(
        "result"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultText =
    document.getElementById(
        "resultText"
    );


/* =========================================================
   STATE
========================================================= */

let energy =
    CONFIG.MAX_ENERGY;

let gold =
    500;

let playerTowerHealth =
    CONFIG.TOWER_HP;

let enemyTowerHealth =
    CONFIG.TOWER_HP;

let playerUnits =
    [];

let enemyUnits =
    [];

let enemyId =
    1;

let gameEnded =
    false;


/* =========================================================
   UI
========================================================= */

function updateEnergy(){

    energyText.textContent =
        Math.floor(
            energy
        );

    energyFill.style.width =
        (
            energy /
            CONFIG.MAX_ENERGY *
            100
        ) + "%";

}


function updateGold(){

    goldElement.textContent =
        "💰 " +
        gold;

}


function showMessage(
    text
){

    messageElement.textContent =
        text;

    messageElement.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            function(){

                messageElement.classList.remove(
                    "show"
                );

            },
            1000
        );

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(
    a,
    b
){

    const dx =
        b.x -
        a.x;

    const dy =
        b.y -
        a.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FIND CLOSEST ENEMY
========================================================= */

function closestEnemyFor(
    unit
){

    let target =
        null;

    let shortest =
        Infinity;


    enemyUnits.forEach(
        function(enemy){

            if(
                !enemy.alive
            ){

                return;

            }


            const d =
                distance(
                    unit,
                    enemy
                );


            /*
               Chỉ xét quân ở phía trước.
            */

            const inFront =
                unit.team ===
                "player"
                    ? enemy.x >
                      unit.x - 30
                    : enemy.x <
                      unit.x + 30;


            if(
                inFront &&
                d < shortest
            ){

                shortest =
                    d;

                target =
                    enemy;

            }

        }
    );


    return target;

}


/* =========================================================
   FIND PLAYER ENEMY
========================================================= */

function closestPlayerFor(
    enemy
){

    let target =
        null;

    let shortest =
        Infinity;


    playerUnits.forEach(
        function(unit){

            if(
                !unit.alive
            ){

                return;

            }


            const d =
                distance(
                    enemy,
                    unit
                );


            const inFront =
                unit.x <
                enemy.x + 30;


            if(
                inFront &&
                d < shortest
            ){

                shortest =
                    d;

                target =
                    unit;

            }

        }
    );


    return target;

}


/* =========================================================
   CREATE SPRITE UNIT
========================================================= */

function createSupermanElement(){

    const unit =
        document.createElement(
            "div"
        );

    unit.className =
        "unit superman";


    unit.innerHTML = `

        <div class="sprite"></div>

    `;


    return unit;

}


/* =========================================================
   SUMMON SUPERMAN
========================================================= */

function summonSuperman(){

    if(
        gameEnded
    ){

        return;

    }


    if(
        energy <
        CONFIG.SUPERMAN_COST
    ){

        showMessage(
            "Chưa đủ năng lượng!"
        );

        return;

    }


    energy -=
        CONFIG.SUPERMAN_COST;

    updateEnergy();


    const element =
        createSupermanElement();


    playerUnitsBox.appendChild(
        element
    );


    /*
       TRƯỚC THÁP MÌNH
    */

    const unit = {

        team:
            "player",

        element:
            element,

        x:
            215,

        y:
            385,

        hp:
            CONFIG.SUPERMAN_HP,

        maxHp:
            CONFIG.SUPERMAN_HP,

        atk:
            CONFIG.SUPERMAN_ATK,

        target:
            null,

        attackCooldown:
            0,

        alive:
            true

    };


    element.style.left =
        unit.x + "px";

    element.style.top =
        unit.y + "px";


    playerUnits.push(
        unit
    );


    showMessage(
        "SUPERMAN ĐÃ TRIỆU HỒI!"
    );

}


/* =========================================================
   BUTTON
========================================================= */

document
    .getElementById(
        "supermanCard"
    )
    .addEventListener(
        "click",
        summonSuperman
    );


/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy(){

    if(
        gameEnded
    ){

        return;

    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "enemy";


    element.innerHTML = `

        <div class="enemyHP">

            <div
                class="enemyHPFill">
            </div>

        </div>

        <img
            src="./quai1.png"
            alt="Quái">

    `;


    enemyUnitsBox.appendChild(
        element
    );


    /*
       TRƯỚC THÁP ĐỊCH
       nằm cùng lane.
    */

    const enemy = {

        team:
            "enemy",

        id:
            enemyId++,

        element:
            element,

        x:
            1320,

        y:
            385,

        hp:
            CONFIG.ENEMY_HP,

        maxHp:
            CONFIG.ENEMY_HP,

        atk:
            CONFIG.ENEMY_ATK,

        target:
            null,

        attackCooldown:
            0,

        alive:
            true,

        hpFill:
            element.querySelector(
                ".enemyHPFill"
            )

    };


    element.style.left =
        enemy.x + "px";

    element.style.top =
        enemy.y + "px";


    enemyUnits.push(
        enemy
    );


    showMessage(
        "QUÂN ĐỊCH XUẤT HIỆN!"
    );

}


/* =========================================================
   POSITION
========================================================= */

function positionPlayer(
    unit
){

    unit.element.style.left =
        unit.x + "px";

    unit.element.style.top =
        unit.y + "px";

}


function positionEnemy(
    unit
){

    unit.element.style.left =
        unit.x + "px";

    unit.element.style.top =
        unit.y + "px";

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayers(
    dt
){

    playerUnits.forEach(
        function(unit){

            if(
                !unit.alive
            ){

                return;

            }


            /*
               Nếu mục tiêu chết,
               tìm mục tiêu mới.
            */

            if(
                !unit.target ||
                !unit.target.alive
            ){

                unit.target =
                    closestEnemyFor(
                        unit
                    );

            }


            /*
               GẶP QUÂN ĐỊCH
            */

            if(
                unit.target
            ){

                const target =
                    unit.target;


                const d =
                    distance(
                        unit,
                        target
                    );


                if(
                    d <=
                    CONFIG.SUPERMAN_ATTACK_RANGE
                ){

                    /*
                       DỪNG.
                    */

                    attackPlayer(
                        unit,
                        target,
                        dt
                    );

                    return;

                }


                /*
                   ĐI TỚI QUÂN ĐỊCH.
                */

                movePlayerTo(
                    unit,
                    target,
                    dt
                );

                return;

            }


            /*
               KHÔNG CÓ QUÂN ĐỊCH
               → ĐI TỚI THÁP ĐỊCH.
            */

            const towerTarget = {

                x:
                    1400,

                y:
                    385

            };


            const towerDistance =
                distance(
                    unit,
                    towerTarget
                );


            if(
                towerDistance <=
                CONFIG.SUPERMAN_ATTACK_RANGE
            ){

                attackEnemyTower(
                    unit,
                    dt
                );

                return;

            }


            movePlayerTo(
                unit,
                towerTarget,
                dt
            );

        }
    );

}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayerTo(
    unit,
    target,
    dt
){

    unit.element.classList.remove(
        "attacking"
    );


    const dx =
        target.x -
        unit.x;

    const dy =
        target.y -
        unit.y;

    const len =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(
        len <= 0
    ){

        return;

    }


    unit.x +=
        dx /
        len *
        CONFIG.SUPERMAN_SPEED *
        dt;


    /*
       Giữ cùng đường chiến đấu.
    */

    unit.y +=
        (
            target.y -
            unit.y
        ) *
        .08;


    unit.y =
        385;


    unit.x =
        Math.max(
            195,
            Math.min(
                1340,
                unit.x
            )
        );


    positionPlayer(
        unit
    );

}


/* =========================================================
   PLAYER ATTACK UNIT
========================================================= */

function attackPlayer(
    unit,
    target,
    dt
){

    unit.attackCooldown -=
        dt;


    if(
        unit.attackCooldown >
        0
    ){

        return;

    }


    unit.attackCooldown =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    unit.element.classList.add(
        "attacking"
    );


    setTimeout(
        function(){

            if(
                unit.alive &&
                target.alive
            ){

                damageEnemy(
                    target,
                    unit.atk
                );

            }

        },
        180
    );


    setTimeout(
        function(){

            unit.element.classList.remove(
                "attacking"
            );

        },
        430
    );

}


/* =========================================================
   PLAYER ATTACK TOWER
========================================================= */

function attackEnemyTower(
    unit,
    dt
){

    unit.attackCooldown -=
        dt;


    if(
        unit.attackCooldown >
        0
    ){

        return;

    }


    unit.attackCooldown =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    unit.element.classList.add(
        "attacking"
    );


    setTimeout(
        function(){

            damageEnemyTower(
                unit.atk
            );

        },
        180
    );


    setTimeout(
        function(){

            unit.element.classList.remove(
                "attacking"
            );

        },
        430
    );

}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(
    dt
){

    enemyUnits.forEach(
        function(enemy){

            if(
                !enemy.alive
            ){

                return;

            }


            /*
               Nếu chưa có mục tiêu,
               tìm nhân vật bên mình.
            */

            if(
                !enemy.target ||
                !enemy.target.alive
            ){

                enemy.target =
                    closestPlayerFor(
                        enemy
                    );

            }


            /*
               GẶP NHÂN VẬT
            */

            if(
                enemy.target
            ){

                const target =
                    enemy.target;


                const d =
                    distance(
                        enemy,
                        target
                    );


                if(
                    d <=
                    CONFIG.ENEMY_ATTACK_RANGE
                ){

                    attackEnemyUnit(
                        enemy,
                        target,
                        dt
                    );

                    return;

                }


                moveEnemyTo(
                    enemy,
                    target,
                    dt
                );

                return;

            }


            /*
               KHÔNG CÓ QUÂN MÌNH
               → ĐI TỚI THÁP.
            */

            const towerTarget = {

                x:
                    135,

                y:
                    385

            };


            const towerDistance =
                distance(
                    enemy,
                    towerTarget
                );


            if(
                towerDistance <=
                CONFIG.ENEMY_ATTACK_RANGE
            ){

                attackPlayerTower(
                    enemy,
                    dt
                );

                return;

            }


            moveEnemyTo(
                enemy,
                towerTarget,
                dt
            );

        }
    );

}


/* =========================================================
   ENEMY MOVE
========================================================= */

function moveEnemyTo(
    enemy,
    target,
    dt
){

    const dx =
        target.x -
        enemy.x;

    const dy =
        target.y -
        enemy.y;

    const len =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(
        len <= 0
    ){

        return;

    }


    enemy.x +=
        dx /
        len *
        CONFIG.ENEMY_SPEED *
        dt;


    enemy.y +=
        (
            target.y -
            enemy.y
        ) *
        .08;


    enemy.y =
        385;


    enemy.x =
        Math.max(
            120,
            Math.min(
                1380,
                enemy.x
            )
        );


    positionEnemy(
        enemy
    );

}


/* =========================================================
   ENEMY ATTACK PLAYER
========================================================= */

function attackEnemyUnit(
    enemy,
    target,
    dt
){

    enemy.attackCooldown -=
        dt;


    if(
        enemy.attackCooldown >
        0
    ){

        return;

    }


    enemy.attackCooldown =
        CONFIG.ENEMY_ATTACK_COOLDOWN;


    damagePlayer(
        target,
        enemy.atk
    );

}


/* =========================================================
   ENEMY ATTACK TOWER
========================================================= */

function attackPlayerTower(
    enemy,
    dt
){

    enemy.attackCooldown -=
        dt;


    if(
        enemy.attackCooldown >
        0
    ){

        return;

    }


    enemy.attackCooldown =
        CONFIG.ENEMY_ATTACK_COOLDOWN;


    playerTowerHealth -=
        enemy.atk;


    if(
        playerTowerHealth <
        0
    ){

        playerTowerHealth =
            0;

    }


    playerTowerHP.style.width =
        (
            playerTowerHealth /
            CONFIG.TOWER_HP *
            100
        ) + "%";


    createDamage(
        125,
        350,
        enemy.atk
    );


    if(
        playerTowerHealth <=
        0
    ){

        endBattle(
            false
        );

    }

}


/* =========================================================
   DAMAGE PLAYER
========================================================= */

function damagePlayer(
    unit,
    damage
){

    if(
        !unit.alive
    ){

        return;

    }


    unit.hp -=
        damage;


    if(
        unit.hp <=
        0
    ){

        unit.hp =
            0;

        unit.alive =
            false;

        unit.element.remove();

        unit.target =
            null;

    }


    createDamage(
        unit.x,
        unit.y,
        damage
    );

}


/* =========================================================
   DAMAGE ENEMY
========================================================= */

function damageEnemy(
    enemy,
    damage
){

    if(
        !enemy.alive
    ){

        return;

    }


    enemy.hp -=
        damage;


    if(
        enemy.hp <
        0
    ){

        enemy.hp =
            0;

    }


    enemy.hpFill.style.width =
        (
            enemy.hp /
            enemy.maxHp *
            100
        ) + "%";


    createDamage(
        enemy.x,
        enemy.y,
        damage
    );


    if(
        enemy.hp <=
        0
    ){

        enemy.alive =
            false;

        enemy.element.remove();

        gold +=
            50;

        updateGold();

        /*
           Sau khi chết,
           nhân vật phe mình
           sẽ tự chọn mục tiêu mới.
        */

    }

}


/* =========================================================
   DAMAGE ENEMY TOWER
========================================================= */

function damageEnemyTower(
    damage
){

    if(
        gameEnded
    ){

        return;

    }


    enemyTowerHealth -=
        damage;


    if(
        enemyTowerHealth <
        0
    ){

        enemyTowerHealth =
            0;

    }


    enemyTowerHP.style.width =
        (
            enemyTowerHealth /
            CONFIG.TOWER_HP *
            100
        ) + "%";


    createDamage(
        1395,
        350,
        damage
    );


    if(
        enemyTowerHealth <=
        0
    ){

        endBattle(
            true
        );

    }

}


/* =========================================================
   DAMAGE TEXT
========================================================= */

function createDamage(
    x,
    y,
    damage
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "damage";

    element.textContent =
        "-" +
        damage;

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    damageLayer.appendChild(
        element
    );


    setTimeout(
        function(){

            element.remove();

        },
        600
    );

}


/* =========================================================
   END
========================================================= */

function endBattle(
    victory
){

    if(
        gameEnded
    ){

        return;

    }


    gameEnded =
        true;


    resultElement.style.display =
        "flex";


    if(
        victory
    ){

        resultTitle.textContent =
            "VICTORY";

        resultText.textContent =
            "Tháp địch đã bị phá hủy.";

    }
    else{

        resultTitle.textContent =
            "DEFEAT";

        resultText.textContent =
            "Tháp của bạn đã bị phá hủy.";

    }

}


/* =========================================================
   ENERGY REGEN
========================================================= */

setInterval(
    function(){

        if(
            gameEnded
        ){

            return;

        }


        energy +=
            CONFIG.ENERGY_REGEN *
            .5;


        if(
            energy >
            CONFIG.MAX_ENERGY
        ){

            energy =
                CONFIG.MAX_ENERGY;

        }


        updateEnergy();

    },
    500
);


/* =========================================================
   ENEMY SPAWN
========================================================= */

setInterval(
    function(){

        spawnEnemy();

    },
    CONFIG.ENEMY_SPAWN_TIME
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(
    now
){

    if(
        !gameEnded
    ){

        const dt =
            Math.min(
                (now - lastTime) /
                16.666,
                3
            );


        updatePlayers(
            dt
        );


        updateEnemies(
            dt
        );

    }


    lastTime =
        now;


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   SCALE
========================================================= */

function scaleGame(){

    const frame =
        document.getElementById(
            "frame"
        );

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const scale =
        Math.min(
            width / 1536,
            height / 864
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "scale(" +
        scale +
        ")";

}


window.addEventListener(
    "resize",
    scaleGame
);

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);


/* =========================================================
   START
========================================================= */

playerTowerHP.style.width =
    "100%";

enemyTowerHP.style.width =
    "100%";

updateEnergy();

updateGold();

scaleGame();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
