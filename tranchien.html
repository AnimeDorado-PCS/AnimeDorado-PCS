<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>ANIME DORADO - TRẬN CHIẾN</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
}

button{
    font:inherit;
    border:0;
    outline:0;
}


/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}


/* =========================================================
   DESIGN FRAME
========================================================= */

#frame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

}


/* =========================================================
   NỀN TRẬN CHIẾN
========================================================= */

#battleBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    z-index:0;

    user-select:none;

    -webkit-user-drag:none;

}


/* =========================================================
   GAME AREA
========================================================= */

#battleArea{

    position:absolute;

    left:0;
    top:76px;

    width:1536px;
    height:606px;

    overflow:hidden;

    z-index:5;

}


/* =========================================================
   TOP UI
========================================================= */

#topUI{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:76px;

    z-index:100;

    display:flex;

    align-items:center;

    padding:
        10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.74),
            rgba(0,0,0,0)
        );

}


.waveBox{

    min-width:190px;

    padding:
        9px 17px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius:16px;

    background:
        rgba(0,0,0,.52);

    color:#fff;

    box-shadow:
        0 6px 15px
        rgba(0,0,0,.25);

}


.waveSmall{

    font-size:11px;

    font-weight:900;

    color:#9fe0aa;

}


.waveMain{

    margin-top:3px;

    font-size:20px;

    font-weight:1000;

}


.energyTop{

    width:245px;

    margin-left:16px;

}


.energyText{

    margin-bottom:5px;

    color:#fff;

    font-size:11px;

    font-weight:900;

}


.energyBarTop{

    width:100%;

    height:13px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:10px;

    background:#131a23;

}


.energyFillTop{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #547eff,
            #8bdcff
        );

    transition:
        width .2s linear;

}


.goldBox{

    min-width:150px;

    margin-left:auto;

    padding:
        10px 16px;

    border:
        1px solid
        rgba(255,214,90,.3);

    border-radius:16px;

    background:
        rgba(0,0,0,.52);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:1000;

}


/* =========================================================
   LANE
========================================================= */

#lane{

    position:absolute;

    left:158px;

    right:158px;

    top:285px;

    height:170px;

    border-radius:90px;

    background:
        rgba(80,57,38,.12);

    pointer-events:none;

    z-index:2;

}


/* =========================================================
   BASE TOWERS
========================================================= */

.tower{

    position:absolute;

    bottom:93px;

    width:120px;

    height:150px;

    z-index:10;

    border:
        3px solid
        rgba(235,247,255,.94);

    border-radius:
        22px
        22px
        9px
        9px;

    background:
        linear-gradient(
            180deg,
            #879eac,
            #344d5a
        );

    box-shadow:
        0 15px 30px
        rgba(0,0,0,.4),

        inset
        0 2px 0
        rgba(255,255,255,.32);

}


.tower::before{

    content:"";

    position:absolute;

    left:12%;
    right:12%;

    top:-38px;

    height:50px;

    border:
        3px solid
        rgba(235,247,255,.94);

    border-radius:
        20px
        20px
        8px
        8px;

    background:
        linear-gradient(
            180deg,
            #95afbb,
            #435b68
        );

}


.tower::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:0;

    transform:
        translateX(-50%);

    width:40px;

    height:60px;

    border-radius:
        18px
        18px
        0
        0;

    background:#17252e;

}


.playerTower{

    left:105px;

}


.enemyTower{

    right:105px;

}


/* =========================================================
   TOWER HP
========================================================= */

.towerHpWrap{

    position:absolute;

    left:50%;

    top:-20px;

    transform:
        translateX(-50%);

    width:155px;

    height:11px;

    padding:1px;

    border-radius:10px;

    background:#22090d;

}


.towerHpFill{

    width:100%;

    height:100%;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #2ed64e,
            #a8ff58
        );

    transition:
        width .18s linear;

}


/* =========================================================
   UNIT LAYER
========================================================= */

#playerUnits,
#enemyUnits{
    position:absolute;
    inset:0;
    z-index:30;
    pointer-events:none;
}


/* =========================================================
   PLAYER UNIT
========================================================= */

.playerUnit{

    position:absolute;

    left:0;
    top:0;

    width:108px;
    height:124px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

}


/* =========================================================
   SUPERMAN SPRITE
========================================================= */

.supermanSprite{

    position:absolute;

    left:50%;
    top:50%;

    width:384px;
    height:939px;

    transform:
        translate(-50%,-50%)
        scale(.22);

    transform-origin:center center;

    background-repeat:no-repeat;

    background-position:
        0 0;

}


/* =========================================================
   SUPERMAN IDLE / ATTACK
========================================================= */

.supermanIdle{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

}


/* =========================================================
   SUPERMAN FLY
========================================================= */

.supermanFly{

    width:384px;

    height:688px;

    background-image:
        url(
            "https://i.postimg.cc/7ZWX0Vpr/20260812-191835.png"
        );

    background-size:
        1536px 688px;

    animation:
        supermanFlyAnimation
        .6s
        steps(4)
        infinite;

}


@keyframes supermanFlyAnimation{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            -1536px 0;
    }

}


/* =========================================================
   SUPERMAN ATTACK
========================================================= */

.supermanAttack{

    width:384px;

    height:939px;

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

    animation:
        supermanAttackAnimation
        .42s
        steps(4)
        1;

}


@keyframes supermanAttackAnimation{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            -1536px 0;
    }

}


/* =========================================================
   ENEMY UNIT
========================================================= */

.enemyUnit{

    position:absolute;

    left:0;
    top:0;

    width:88px;

    height:100px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

}


.enemyImage{

    width:88px;
    height:88px;

    display:block;

    object-fit:contain;

}


.enemyHpWrap{

    position:absolute;

    left:50%;

    top:-11px;

    transform:
        translateX(-50%);

    width:82px;

    height:8px;

    border-radius:8px;

    overflow:hidden;

    background:#25080d;

}


.enemyHpFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff3030,
            #ff9a32
        );

    transition:
        width .18s linear;

}


/* =========================================================
   DAMAGE
========================================================= */

.damage{

    position:absolute;

    z-index:300;

    pointer-events:none;

    color:#ffd65a;

    font-size:28px;

    font-weight:1000;

    text-shadow:
        0 3px 7px #000;

    animation:
        damageAnimation
        .55s
        ease-out
        forwards;

}


@keyframes damageAnimation{

    from{

        opacity:1;

        transform:
            translateY(0)
            scale(.8);

    }

    to{

        opacity:0;

        transform:
            translateY(-55px)
            scale(1.12);

    }

}


/* =========================================================
   SUMMON BAR
========================================================= */

#summonBar{

    position:absolute;

    left:0;
    bottom:0;

    width:1536px;

    height:182px;

    z-index:150;

    display:flex;

    align-items:center;

    gap:11px;

    padding:
        11px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.04),
            rgba(0,0,0,.91)
        );

}


.summonInfo{

    width:230px;

    flex:0 0 230px;

}


.summonInfoTitle{

    margin-bottom:5px;

    color:#fff;

    font-size:11px;

    font-weight:900;

}


.summonInfoBar{

    width:100%;

    height:14px;

    overflow:hidden;

    border-radius:10px;

    background:#121a23;

}


.summonInfoFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #527bff,
            #8be0ff
        );

    transition:
        width .2s linear;

}


.summonCard{

    position:relative;

    width:120px;

    height:140px;

    flex:0 0 120px;

    overflow:hidden;

    cursor:pointer;

    border:
        2px solid
        rgba(255,214,90,.6);

    border-radius:15px;

    background:
        linear-gradient(
            180deg,
            #80591d,
            #30200b
        );

}


.summonCard:active{

    transform:
        scale(.96);

}


.summonCard img{

    width:100%;

    height:102px;

    display:block;

    object-fit:contain;

}


.summonCost{

    position:absolute;

    right:5px;
    top:5px;

    z-index:5;

    padding:
        4px 6px;

    border-radius:8px;

    background:
        rgba(0,0,0,.78);

    color:#ffd65a;

    font-size:10px;

    font-weight:900;

}


.summonName{

    position:absolute;

    left:0;
    right:0;
    bottom:5px;

    color:#fff;

    text-align:center;

    font-size:10px;

    font-weight:900;

}


.lockedCard{

    cursor:not-allowed;

    opacity:.52;

}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    position:absolute;

    left:50%;
    top:44%;

    transform:
        translate(-50%,-50%);

    z-index:400;

    padding:
        14px 22px;

    border:
        1px solid
        rgba(255,214,90,.4);

    border-radius:14px;

    background:
        rgba(0,0,0,.84);

    color:#ffd65a;

    font-size:14px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .18s;

}


#message.show{

    opacity:1;

}


/* =========================================================
   RESULT
========================================================= */

#result{

    position:absolute;

    inset:0;

    z-index:600;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(5px);

}


.resultBox{

    width:min(
        450px,
        90vw
    );

    padding:
        32px 24px;

    border:
        2px solid
        #ffd65a;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            #263e56,
            #111a24
        );

    text-align:center;

    color:#fff;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.6);

}


.resultTitle{

    color:#ffd65a;

    font-size:
        clamp(
            40px,
            10vw,
            62px
        );

    font-weight:1000;

}


.resultText{

    margin-top:9px;

    color:#cbd4df;

    font-size:14px;

}


.resultButton{

    margin-top:22px;

    min-width:180px;

    height:50px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #summonBar{

        height:145px;

        padding:6px;

        gap:6px;

    }

    .summonInfo{

        width:105px;

        flex-basis:105px;

    }

    .summonCard{

        width:88px;

        height:108px;

        flex-basis:88px;

    }

    .summonCard img{

        height:77px;

    }

    .summonName{

        font-size:9px;

    }

}


/* =========================================================
   PORTRAIT
========================================================= */

@media(orientation:portrait){

    #frame{

        transform:
            translate(-50%,-50%)
            rotate(90deg);

    }

}

</style>

</head>


<body>


<div id="game">

<div id="frame">


<!-- =========================================================
     BACKGROUND
========================================================= -->

<img
    id="battleBackground"
    src="./tranchien.jpg"
    alt="ANIME DORADO">


<!-- =========================================================
     TOP
========================================================= -->

<div id="topUI">


    <div class="waveBox">

        <div class="waveSmall">
            NORMAL
        </div>

        <div class="waveMain">
            WAVE 1
        </div>

    </div>


    <div class="energyTop">

        <div class="energyText">

            🔋 NĂNG LƯỢNG
            <span id="energyTopNumber">
                100
            </span>
            /100

        </div>


        <div class="energyBarTop">

            <div
                id="energyTopFill"
                class="energyFillTop">
            </div>

        </div>

    </div>


    <div
        id="gold"
        class="goldBox">

        💰 500

    </div>


</div>


<!-- =========================================================
     BATTLE AREA
========================================================= -->

<div id="battleArea">


    <div id="lane"></div>


    <!-- THÁP MÌNH -->

    <div class="tower playerTower">

        <div class="towerHpWrap">

            <div
                id="playerTowerHp"
                class="towerHpFill">
            </div>

        </div>

    </div>


    <!-- THÁP ĐỊCH -->

    <div class="tower enemyTower">

        <div class="towerHpWrap">

            <div
                id="enemyTowerHp"
                class="towerHpFill">
            </div>

        </div>

    </div>


    <!-- NHÂN VẬT PHE MÌNH -->

    <div id="playerUnits"></div>


    <!-- QUÂN ĐỊCH -->

    <div id="enemyUnits"></div>


    <!-- DAMAGE -->

    <div id="damageLayer"></div>


</div>


<!-- =========================================================
     SUMMON BAR
========================================================= -->

<div id="summonBar">


    <div class="summonInfo">

        <div class="summonInfoTitle">

            🔋 NĂNG LƯỢNG

            <span id="energyNumber">
                100
            </span>
            /100

        </div>


        <div class="summonInfoBar">

            <div
                id="energyFill"
                class="summonInfoFill">
            </div>

        </div>

    </div>


    <!-- SUPERMAN -->

    <button
        id="supermanCard"
        class="summonCard">

        <span class="summonCost">
            🔋 20
        </span>


        <img
            src="https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
            alt="Superman">


        <span class="summonName">
            SUPERMAN
        </span>

    </button>


    <!-- LUFFY -->

    <button
        class="summonCard lockedCard"
        onclick="showMessage('Luffy sẽ được thêm sau')">

        <span class="summonCost">
            🔒
        </span>


        <span
            style="
                display:flex;
                align-items:center;
                justify-content:center;
                width:100%;
                height:102px;
                color:#8a96a5;
                font-size:13px;
                font-weight:900;
            "
        >
            LUFFY
        </span>


        <span class="summonName">
            LUFFY
        </span>

    </button>


    <!-- GOKU -->

    <button
        class="summonCard lockedCard"
        onclick="showMessage('Goku sẽ được thêm sau')">

        <span class="summonCost">
            🔒
        </span>


        <span
            style="
                display:flex;
                align-items:center;
                justify-content:center;
                width:100%;
                height:102px;
                color:#8a96a5;
                font-size:13px;
                font-weight:900;
            "
        >
            GOKU
        </span>


        <span class="summonName">
            GOKU
        </span>

    </button>


</div>


<!-- =========================================================
     MESSAGE
========================================================= -->

<div id="message"></div>


<!-- =========================================================
     RESULT
========================================================= -->

<div id="result">


    <div class="resultBox">


        <div
            id="resultTitle"
            class="resultTitle">

            VICTORY

        </div>


        <div
            id="resultText"
            class="resultText">

            Tháp địch đã bị phá hủy.

        </div>


        <button
            class="resultButton"
            onclick="location.reload()">

            CHƠI LẠI

        </button>


    </div>


</div>


</div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    /* năng lượng */

    MAX_ENERGY:100,

    ENERGY_START:100,

    ENERGY_REGEN_PER_SECOND:5,

    /* Superman */

    SUPERMAN_COST:20,

    SUPERMAN_HP:600,

    SUPERMAN_DAMAGE:100,

    SUPERMAN_MOVE_SPEED:95,

    SUPERMAN_ATTACK_RANGE:105,

    SUPERMAN_ATTACK_COOLDOWN:0.85,

    /* quái */

    ENEMY_HP:260,

    ENEMY_DAMAGE:35,

    ENEMY_MOVE_SPEED:58,

    ENEMY_ATTACK_RANGE:82,

    ENEMY_ATTACK_COOLDOWN:1.05,

    ENEMY_SPAWN_INTERVAL:3,

    /* tháp */

    TOWER_HP:1200,

    /* lane */

    LANE_Y:385,

    PLAYER_SPAWN_X:215,

    ENEMY_SPAWN_X:1320,

    PLAYER_TOWER_X:155,

    ENEMY_TOWER_X:1381

};


/* =========================================================
   DOM
========================================================= */

const playerUnitsLayer =
    document.getElementById(
        "playerUnits"
    );

const enemyUnitsLayer =
    document.getElementById(
        "enemyUnits"
    );

const damageLayer =
    document.getElementById(
        "damageLayer"
    );

const energyNumber =
    document.getElementById(
        "energyNumber"
    );

const energyFill =
    document.getElementById(
        "energyFill"
    );

const energyTopNumber =
    document.getElementById(
        "energyTopNumber"
    );

const energyTopFill =
    document.getElementById(
        "energyTopFill"
    );

const goldElement =
    document.getElementById(
        "gold"
    );

const playerTowerHpElement =
    document.getElementById(
        "playerTowerHp"
    );

const enemyTowerHpElement =
    document.getElementById(
        "enemyTowerHp"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const resultElement =
    document.getElementById(
        "result"
    );

const resultTitleElement =
    document.getElementById(
        "resultTitle"
    );

const resultTextElement =
    document.getElementById(
        "resultText"
    );

const frame =
    document.getElementById(
        "frame"
    );

const battleArea =
    document.getElementById(
        "battleArea"
    );


/* =========================================================
   STATE
========================================================= */

let energy =
    CONFIG.ENERGY_START;

let gold =
    500;

let playerTowerHp =
    CONFIG.TOWER_HP;

let enemyTowerHp =
    CONFIG.TOWER_HP;

let playerUnits =
    [];

let enemyUnits =
    [];

let nextEnemyId =
    1;

let nextPlayerId =
    1;

let battleFinished =
    false;


/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(
    a,
    b
){

    const dx =
        b.x -
        a.x;

    const dy =
        b.y -
        a.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


function showMessage(
    text
){

    messageElement.textContent =
        text;

    messageElement.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            function(){

                messageElement.classList.remove(
                    "show"
                );

            },
            1050
        );

}


/* =========================================================
   UI UPDATE
========================================================= */

function updateEnergyUi(){

    const percent =
        (
            energy /
            CONFIG.MAX_ENERGY
        ) *
        100;


    const rounded =
        Math.floor(
            energy
        );


    energyNumber.textContent =
        rounded;


    energyTopNumber.textContent =
        rounded;


    energyFill.style.width =
        percent + "%";


    energyTopFill.style.width =
        percent + "%";

}


function updateGoldUi(){

    goldElement.textContent =
        "💰 " +
        gold;

}


function updateTowerUi(){

    playerTowerHpElement.style.width =
        (
            playerTowerHp /
            CONFIG.TOWER_HP *
            100
        ) + "%";


    enemyTowerHpElement.style.width =
        (
            enemyTowerHp /
            CONFIG.TOWER_HP *
            100
        ) + "%";

}


/* =========================================================
   SCALE
========================================================= */

function scaleGame(){

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const scale =
        Math.min(
            width / 1536,
            height / 864
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "scale(" +
        scale +
        ")";

}


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);

/* =========================================================
   POSITION
========================================================= */

function positionPlayer(
    unit
){

        unit.x + "px";

    unit.element.style.top =
        unit.y + "px";

}

){

}


/* =========================================================
   FIND TARGET PLAYER
========================================================= */

function findEnemyTargetForPlayer(
    unit
){

    let target =
        null;

    let bestDistance =
        Infinity;


    for(
        const enemy of enemyUnits
    ){

        if(
            enemy.dead
        ){

            continue;

        }


        /*
           Chỉ chọn quân địch
           nằm phía trước.
        */

        if(
            enemy.x <=
            unit.x + 5
        ){

            continue;

        }


        const d =
            distance(
                unit,
                enemy
            );


        if(
            d <
            bestDistance
        ){

            bestDistance =
                d;

            target =
                enemy;

        }

    }


    return target;

}


/* =========================================================
   FIND TARGET ENEMY
========================================================= */

function findPlayerTargetForEnemy(
    enemy
){

    let target =
        null;

    let bestDistance =
        Infinity;


    for(
        const unit of playerUnits
    ){

        if(
            unit.dead
        ){

            continue;

        }


        /*
           Chỉ chọn quân địch
           nằm phía trước.
        */

        if(
            unit.x >=
            enemy.x - 5
        ){

            continue;

        }


        const d =
            distance(
                enemy,
                unit
            );


        if(
            d <
            bestDistance
        ){

            bestDistance =
                d;

            target =
                unit;

        }

    }


    return target;

}


/* =========================================================
   PLAYER MOVE
========================================================= */

function updatePlayerUnit(
    unit,
    dt
){

    if(
        unit.dead
    ){

        return;

    }


    /*
       Nếu mục tiêu chết:
       tìm mục tiêu mới.
    */

    if(
        !unit.target ||
        unit.target.dead
    ){

        unit.target =
            findEnemyTargetForPlayer(
                unit
            );

    }


    /*
       CÓ QUÂN ĐỊCH
    */

    if(
        unit.target
    ){

        const target =
            unit.target;


        const d =
            distance(
                unit,
                target
            );


        /*
           ĐỦ GẦN → ĐÁNH
        */

        if(
            d <=
            CONFIG.SUPERMAN_ATTACK_RANGE
        ){

            playerAttack(
                unit,
                target,
                dt
            );

            return;

        }


        /*
           CHƯA TỚI → ĐI
        */

        setSupermanMove(
            unit
        );


        moveTowards(
            unit,
            target,
            CONFIG.SUPERMAN_MOVE_SPEED,
            dt
        );


        return;

    }


    /*
       KHÔNG CÓ QUÂN ĐỊCH
       → ĐI TỚI THÁP ĐỊCH
    */

    const towerTarget = {

        x:
            CONFIG.ENEMY_TOWER_X,

        y:
            CONFIG.LANE_Y

    };


    const towerDistance =
        distance(
            unit,
            towerTarget
        );


    if(
        towerDistance <=
        CONFIG.SUPERMAN_ATTACK_RANGE
    ){

        attackEnemyTower(
            unit,
            dt
        );

        return;

    }


    setSupermanMove(
        unit
    );


    moveTowards(
        unit,
        towerTarget,
        CONFIG.SUPERMAN_MOVE_SPEED,
        dt
    );

}


/* =========================================================
   MOVE TOWARD
========================================================= */

function moveTowards(
    object,
    target,
    speed,
    dt
){

    const dx =
        target.x -
        object.x;

    const dy =
        target.y -
        object.y;


    const len =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(
        len <=
        0.001
    ){

        return;

    }


    object.x +=
        (
            dx /
            len
        ) *
        speed *
        dt;


    object.y =
        CONFIG.LANE_Y;


    /*
       Không cho quân đi qua
       vùng tháp nhà của mình.
    */

    object.x =
        clamp(
            object.x,
            195,
            1340
        );


    if(
        object.team ===
        "player"
    ){

        positionPlayer(
            object
        );

    }
    else{

        positionEnemy(
            object
        );

    }

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function playerAttack(
    unit,
    enemy,
    dt
){

    unit.attackTimer -=
        dt;


    if(
        unit.attackTimer >
        0
    ){

        return;

    }


    unit.attackTimer =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    setSupermanAttack(
        unit
    );


    /*
       Gây damage giữa animation.
    */

    setTimeout(
        function(){

            if(
                !unit.dead &&
                !enemy.dead
            ){

                damageEnemy(
                    enemy,
                    unit.damage
                );

            }

        },
        180
    );


    /*
       Sau animation
       trở lại trạng thái phù hợp.
    */

    setTimeout(
        function(){

            if(
                !unit.dead
            ){

                if(
                    enemy.dead
                ){

                    setSupermanIdle(
                        unit
                    );

                }

                else{

                    setSupermanIdle(
                        unit
                    );

                }

            }

        },
        430
    );

}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemyUnit(
    enemy,
    dt
){

    if(
        enemy.dead
    ){

        return;

    }


    /*
       Nếu mục tiêu chết:
       tìm mục tiêu mới.
    */

    if(
        !enemy.target ||
        enemy.target.dead
    ){

        enemy.target =
            findPlayerTargetForEnemy(
                enemy
            );

    }


    /*
       CÓ QUÂN MÌNH
    */

    if(
        enemy.target
    ){

        const target =
            enemy.target;


        const d =
            distance(
                enemy,
                target
            );


        /*
           Gần → đánh
        */

        if(
            d <=
            CONFIG.ENEMY_ATTACK_RANGE
        ){

            enemyAttackPlayer(
                enemy,
                target,
                dt
            );

            return;

        }


        /*
           Xa → đi
        */

        moveTowards(
            enemy,
            target,
            CONFIG.ENEMY_MOVE_SPEED,
            dt
        );


        return;

    }


    /*
       Không còn quân cản:
       đi đến tháp mình.
    */

    const towerTarget = {

        x:
            CONFIG.PLAYER_TOWER_X,

        y:
            CONFIG.LANE_Y

    };


    const towerDistance =
        distance(
            enemy,
            towerTarget
        );


    if(
        towerDistance <=
        CONFIG.ENEMY_ATTACK_RANGE
    ){

        attackPlayerTower(
            enemy,
            dt
        );

        return;

    }


    moveTowards(
        enemy,
        towerTarget,
        CONFIG.ENEMY_MOVE_SPEED,
        dt
    );

}


/* =========================================================
   ENEMY ATTACK PLAYER
========================================================= */

function enemyAttackPlayer(
    enemy,
    player,
    dt
){

    enemy.attackTimer -=
        dt;


    if(
        enemy.attackTimer >
        0
    ){

        return;

    }


    enemy.attackTimer =
        CONFIG.ENEMY_ATTACK_COOLDOWN;


    damagePlayer(
        player,
        enemy.damage
    );

}


/* =========================================================
   DAMAGE PLAYER
========================================================= */

function damagePlayer(
    unit,
    damage
){

    if(
        unit.dead
    ){

        return;

    }


    unit.hp -=
        damage;


    createDamage(
        unit.x,
        unit.y,
        damage
    );


    if(
        unit.hp <=
        0
    ){

        unit.hp =
            0;

        killPlayerUnit(
            unit
        );

    }

}


/* =========================================================
   KILL PLAYER
========================================================= */

function killPlayerUnit(
    unit
){

    if(
        unit.dead
    ){

        return;

    }


    unit.dead =
        true;


    unit.element.remove();


    /*
       Các quái có thể đang nhắm
       Superman này sẽ đổi mục tiêu.
    */

    for(
        const enemy of enemyUnits
    ){

        if(
            enemy.target ===
            unit
        ){

            enemy.target =
                null;

        }

    }

}


/* =========================================================
   DAMAGE ENEMY
========================================================= */

function damageEnemy(
    enemy,
    damage
){

    if(
        enemy.dead
    ){

        return;

    }


    enemy.hp -=
        damage;


    enemy.hp =
        Math.max(
            0,
            enemy.hp
        );


    enemy.hpFill.style.width =
        (
            enemy.hp /
            enemy.maxHp *
            100
        ) + "%";


    createDamage(
        enemy.x,
        enemy.y,
        damage
    );


    if(
        enemy.hp <=
        0
    ){

        killEnemy(
            enemy
        );

    }

}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(
    enemy
){

    if(
        enemy.dead
    ){

        return;

    }


    enemy.dead =
        true;


    enemy.element.remove();


    gold +=
        50;


    updateGoldUi();


    /*
       Superman đang đánh con này
       sẽ tự chọn mục tiêu khác
       ở frame kế tiếp.
    */

    for(
        const unit of playerUnits
    ){

        if(
            unit.target ===
            enemy
        ){

            unit.target =
                null;

        }

    }

}


/* =========================================================
   ATTACK ENEMY TOWER
========================================================= */

function attackEnemyTower(
    unit,
    dt
){

    unit.attackTimer -=
        dt;


    if(
        unit.attackTimer >
        0
    ){

        return;

    }


    unit.attackTimer =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    setSupermanAttack(
        unit
    );


    setTimeout(
        function(){

            if(
                unit.dead ||
                battleFinished
            ){

                return;

            }


            damageEnemyTower(
                unit.damage
            );

        },
        180
    );


    setTimeout(
        function(){

            if(
                !unit.dead
            ){

                setSupermanIdle(
                    unit
                );

            }

        },
        430
    );

}


/* =========================================================
   DAMAGE ENEMY TOWER
========================================================= */

function damageEnemyTower(
    damage
){

    if(
        battleFinished
    ){

        return;

    }


    enemyTowerHp -=
        damage;


    enemyTowerHp =
        Math.max(
            0,
            enemyTowerHp
        );


    updateTowerUi();


    createDamage(
        CONFIG.ENEMY_TOWER_X,
        CONFIG.LANE_Y - 60,
        damage
    );


    if(
        enemyTowerHp <=
        0
    ){

        finishBattle(
            true
        );

    }

}


/* =========================================================
   ENEMY ATTACK OUR TOWER
========================================================= */

function attackPlayerTower(
    enemy,
    dt
){

    enemy.attackTimer -=
        dt;


    if(
        enemy.attackTimer >
        0
    ){

        return;

    }


    enemy.attackTimer =
        CONFIG.ENEMY_ATTACK_COOLDOWN;


    playerTowerHp -=
        enemy.damage;


    playerTowerHp =
        Math.max(
            0,
            playerTowerHp
        );


    updateTowerUi();


    createDamage(
        CONFIG.PLAYER_TOWER_X,
        CONFIG.LANE_Y - 60,
        enemy.damage
    );


    if(
        playerTowerHp <=
        0
    ){

        finishBattle(
            false
        );

    }

}


/* =========================================================
   DAMAGE TEXT
========================================================= */

function createDamage(
    x,
    y,
    damage
){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "damage";


    element.textContent =
        "-" +
        damage;


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    damageLayer.appendChild(
        element
    );


    setTimeout(
        function(){

            element.remove();

        },
        600
    );

}


/* =========================================================
   BATTLE RESULT
========================================================= */

function finishBattle(
    victory
){

    if(
        battleFinished
    ){

        return;

    }


    battleFinished =
        true;


    resultElement.style.display =
        "flex";


    if(
        victory
    ){

        resultTitleElement.textContent =
            "VICTORY";


        resultTextElement.textContent =
            "Tháp địch đã bị phá hủy.";

    }
    else{

        resultTitleElement.textContent =
            "DEFEAT";


        resultTextElement.textContent =
            "Tháp của bạn đã bị phá hủy.";

    }

}


/* =========================================================
   ENEMY SPAWN
========================================================= */

function startEnemySpawner(){

    /*
       Con đầu tiên xuất hiện sau 3 giây.
    */

    setTimeout(
        function(){

            spawnEnemy();

            /*
               Sau đó mỗi 3 giây
               thêm một quân.
            */

            setInterval(
                function(){

                    spawnEnemy();

                },
                CONFIG.ENEMY_SPAWN_INTERVAL *
                1000
            );

        },
        CONFIG.ENEMY_SPAWN_INTERVAL *
        1000
    );

}


/* =========================================================
   SPAWN
========================================================= */

function spawnEnemy(){

    if(
        battleFinished
    ){

        return;

    }


    const element =
        createEnemyElement();


    enemyUnitsLayer.appendChild(
        element
    );


    const enemy = {

        id:
            nextEnemyId++,

        team:
            "enemy",

        element:
            element,

        x:
            CONFIG.ENEMY_SPAWN_X,

        y:
            CONFIG.LANE_Y,

        hp:
            CONFIG.ENEMY_HP,

        maxHp:
            CONFIG.ENEMY_HP,

        damage:
            CONFIG.ENEMY_DAMAGE,

        target:
            null,

        attackTimer:
            0,

        hpFill:
            element.querySelector(
                ".enemyHpFill"
            ),

        dead:
            false

    };


    positionEnemy(
        enemy
    );


    enemyUnits.push(
        enemy
    );

}


/* =========================================================
   REMOVE OLD OBJECTS
========================================================= */

function cleanupArrays(){

    playerUnits =
        playerUnits.filter(
            function(unit){

                return !unit.dead;

            }
        );


    enemyUnits =
        enemyUnits.filter(
            function(enemy){

                return !enemy.dead;

            }
        );

}


/* =========================================================
   ENERGY
========================================================= */

let lastEnergyTime =
    performance.now();


function updateEnergy(
    now
){

    const delta =
        (
            now -
            lastEnergyTime
        ) /
        1000;


    lastEnergyTime =
        now;


    if(
        energy <
        CONFIG.MAX_ENERGY
    ){

        energy +=
            CONFIG.ENERGY_REGEN_PER_SECOND *
            delta;


        if(
            energy >
            CONFIG.MAX_ENERGY
        ){

            energy =
                CONFIG.MAX_ENERGY;

        }


        updateEnergyUi();

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

let lastFrame =
    performance.now();


function gameLoop(
    now
){

    const delta =
        Math.min(
            (
                now -
                lastFrame
            ) / 1000,
            .05
        );


    lastFrame =
        now;


    if(
        !battleFinished
    ){

        updateEnergy(
            now
        );


        /*
           Cập nhật player.
        */

        for(
            const unit of playerUnits
        ){

            updatePlayerUnit(
                unit,
                delta
            );

        }


        /*
           Cập nhật enemy.
        */

        for(
            const enemy of enemyUnits
        ){

            updateEnemyUnit(
                enemy,
                delta
            );

        }


        cleanupArrays();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INITIAL
========================================================= */

updateEnergyUi();

updateGoldUi();

updateTowerUi();

scaleGame();

startEnemySpawner();

requestAnimationFrame(
    gameLoop
);

</script>
