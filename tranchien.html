<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>ANIME DORADO - TRẬN CHIẾN</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
}

button{
    font:inherit;
    border:0;
    outline:0;
}


/* =========================================================
   GAME
========================================================= */

#game{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}


/* =========================================================
   1536 x 864
========================================================= */

#frame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

}


/* =========================================================
   NỀN
========================================================= */

#battleBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    user-select:none;

    -webkit-user-drag:none;

    z-index:0;
}


/* =========================================================
   TOP
========================================================= */

#topUI{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:78px;

    z-index:100;

    display:flex;

    align-items:center;

    padding:
        10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.74),
            rgba(0,0,0,0)
        );

}

.waveBox{

    min-width:185px;

    padding:
        9px 17px;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(0,0,0,.52);

    color:#fff;
}

.waveSmall{

    color:#9fe0aa;

    font-size:11px;

    font-weight:900;
}

.waveMain{

    margin-top:3px;

    font-size:20px;

    font-weight:1000;
}

.stageLabel{

    margin-left:12px;

    padding:
        10px 15px;

    border-radius:15px;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,214,90,.24);

    color:#ffd65a;

    font-size:13px;

    font-weight:900;
}

.energyTop{

    width:245px;

    margin-left:16px;
}

.energyText{

    margin-bottom:5px;

    color:#fff;

    font-size:11px;

    font-weight:900;
}

.energyBarTop{

    width:100%;

    height:13px;

    overflow:hidden;

    border-radius:10px;

    background:#131a23;

    border:
        1px solid
        rgba(255,255,255,.16);
}

.energyFillTop{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #547eff,
            #8bdcff
        );

    transition:
        width .2s linear;
}

.goldBox{

    min-width:150px;

    margin-left:auto;

    padding:
        10px 16px;

    border-radius:16px;

    border:
        1px solid
        rgba(255,214,90,.3);

    background:
        rgba(0,0,0,.52);

    color:#ffd65a;

    text-align:center;

    font-size:15px;

    font-weight:1000;
}


/* =========================================================
   BATTLE AREA
========================================================= */

#battleArea{

    position:absolute;

    left:0;
    top:78px;

    width:1536px;
    height:606px;

    overflow:hidden;

    z-index:5;
}

#lane{

    position:absolute;

    left:158px;
    right:158px;

    top:285px;

    height:170px;

    border-radius:90px;

    background:
        rgba(80,57,38,.12);

    pointer-events:none;
}


/* =========================================================
   THÁP
========================================================= */

.tower{

    position:absolute;

    bottom:93px;

    width:120px;
    height:150px;

    z-index:10;

    border:
        3px solid
        rgba(235,247,255,.94);

    border-radius:
        22px
        22px
        9px
        9px;

    background:
        linear-gradient(
            180deg,
            #879eac,
            #344d5a
        );

    box-shadow:
        0 15px 30px
        rgba(0,0,0,.4),

        inset
        0 2px 0
        rgba(255,255,255,.32);
}

.tower::before{

    content:"";

    position:absolute;

    left:12%;
    right:12%;

    top:-38px;

    height:50px;

    border:
        3px solid
        rgba(235,247,255,.94);

    border-radius:
        20px
        20px
        8px
        8px;

    background:
        linear-gradient(
            180deg,
            #95afbb,
            #435b68
        );
}

.tower::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:
        translateX(-50%);

    width:40px;
    height:60px;

    border-radius:
        18px
        18px
        0
        0;

    background:#17252e;
}

.playerTower{
    left:105px;
}

.enemyTower{
    right:105px;
}


/* =========================================================
   HP THÁP
========================================================= */

.towerHpWrap{

    position:absolute;

    left:50%;
    top:-20px;

    transform:
        translateX(-50%);

    width:155px;
    height:11px;

    padding:1px;

    border-radius:10px;

    background:#22090d;
}

.towerHpFill{

    width:100%;
    height:100%;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #2ed64e,
            #a8ff58
        );

    transition:
        width .18s linear;
}


/* =========================================================
   UNITS
========================================================= */

#playerUnits,
#enemyUnits{

    position:absolute;

    inset:0;

    z-index:30;

    pointer-events:none;
}


/* =========================================================
   SUPERMAN
========================================================= */

.playerUnit{

    position:absolute;

    width:110px;
    height:124px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}

.supermanSprite{

    position:absolute;

    left:50%;
    top:50%;

    width:384px;
    height:939px;

    transform:
        translate(-50%,-50%)
        scale(.22);

    transform-origin:center center;

    background-repeat:no-repeat;
    background-position:0 0;
}

.supermanIdle{

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;
}

.supermanFly{

    width:384px;
    height:688px;

    background-image:
        url(
            "https://i.postimg.cc/7ZWX0Vpr/20260812-191835.png"
        );

    background-size:
        1536px 688px;

    animation:
        supermanFlyAnimation
        .6s
        steps(4)
        infinite;
}

@keyframes supermanFlyAnimation{

    from{
        background-position:0 0;
    }

    to{
        background-position:-1536px 0;
    }

}

.supermanAttack{

    width:384px;
    height:939px;

    background-image:
        url(
            "https://i.postimg.cc/VLTzTyt5/20260812-191849.png"
        );

    background-size:
        1536px 939px;

    animation:
        supermanAttackAnimation
        .4s
        steps(4)
        1;
}

@keyframes supermanAttackAnimation{

    from{
        background-position:0 0;
    }

    to{
        background-position:-1536px 0;
    }

}


/* =========================================================
   QUÁI
========================================================= */

.enemyUnit{

    position:absolute;

    width:145px;
    height:155px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}

.enemyImage{

    width:145px;
    height:145px;

    object-fit:contain;

    display:block;
}

.enemyHpWrap{

    position:absolute;

    left:50%;
    top:-15px;

    transform:
        translateX(-50%);

    width:125px;
    height:11px;

    border-radius:9px;

    overflow:hidden;

    background:#25080d;
}

.enemyHpFill{

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff3030,
            #ff9a32
        );

    transition:
        width .18s linear;
}


/* =========================================================
   COUNT
========================================================= */

#countPanel{

    position:absolute;

    left:50%;
    bottom:178px;

    transform:
        translateX(-50%);

    z-index:170;

    display:flex;

    gap:9px;
}

.countBox{

    min-width:145px;

    padding:
        7px 12px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        rgba(0,0,0,.68);

    color:#fff;

    text-align:center;

    font-size:10px;

    font-weight:900;
}

.countBox strong{

    margin-left:6px;

    color:#ffd65a;

    font-size:14px;
}

.enemyCount strong{
    color:#ff7777;
}


/* =========================================================
   DAMAGE
========================================================= */

.damage{

    position:absolute;

    z-index:300;

    pointer-events:none;

    color:#ffd65a;

    font-size:27px;

    font-weight:1000;

    text-shadow:
        0 3px 7px #000;

    animation:
        damageAnimation
        .55s
        ease-out
        forwards;
}

@keyframes damageAnimation{

    from{

        opacity:1;

        transform:
            translateY(0)
            scale(.8);

    }

    to{

        opacity:0;

        transform:
            translateY(-55px)
            scale(1.12);

    }

}


/* =========================================================
   SUMMON BAR
========================================================= */

#summonBar{

    position:absolute;

    left:0;
    bottom:0;

    width:1536px;
    height:178px;

    z-index:150;

    display:flex;

    align-items:center;

    gap:11px;

    padding:
        11px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.03),
            rgba(0,0,0,.91)
        );
}

.summonInfo{

    width:230px;

    flex:0 0 230px;
}

.summonInfoTitle{

    margin-bottom:5px;

    color:#fff;

    font-size:11px;

    font-weight:900;
}

.summonInfoBar{

    width:100%;

    height:14px;

    overflow:hidden;

    border-radius:10px;

    background:#121a23;
}

.summonInfoFill{

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #527bff,
            #8be0ff
        );

    transition:
        width .2s linear;
}

.summonCard{

    position:relative;

    width:120px;
    height:140px;

    flex:0 0 120px;

    overflow:hidden;

    cursor:pointer;

    border:
        2px solid
        rgba(255,214,90,.6);

    border-radius:15px;

    background:
        linear-gradient(
            180deg,
            #80591d,
            #30200b
        );
}

.summonCard:active{
    transform:scale(.96);
}

.summonCard img{

    width:100%;
    height:102px;

    display:block;

    object-fit:contain;
}

.summonCost{

    position:absolute;

    right:5px;
    top:5px;

    z-index:5;

    padding:
        4px 6px;

    border-radius:8px;

    background:
        rgba(0,0,0,.78);

    color:#ffd65a;

    font-size:10px;

    font-weight:900;
}

.summonName{

    position:absolute;

    left:0;
    right:0;
    bottom:5px;

    color:#fff;

    text-align:center;

    font-size:10px;

    font-weight:900;
}

.lockedCard{

    cursor:not-allowed;

    opacity:.52;
}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    position:absolute;

    left:50%;
    top:44%;

    transform:
        translate(-50%,-50%);

    z-index:400;

    padding:
        14px 22px;

    border:
        1px solid
        rgba(255,214,90,.4);

    border-radius:14px;

    background:
        rgba(0,0,0,.84);

    color:#ffd65a;

    font-size:14px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .18s;
}

#message.show{
    opacity:1;
}


/* =========================================================
   RESULT
========================================================= */

#result{

    position:absolute;

    inset:0;

    z-index:600;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(5px);
}

.resultBox{

    width:min(
        450px,
        90vw
    );

    padding:
        32px 24px;

    border:
        2px solid
        #ffd65a;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            #263e56,
            #111a24
        );

    text-align:center;

    color:#fff;
}

.resultTitle{

    color:#ffd65a;

    font-size:
        clamp(
            40px,
            10vw,
            62px
        );

    font-weight:1000;
}

.resultText{

    margin-top:9px;

    color:#cbd4df;

    font-size:14px;
}

.resultButton{

    margin-top:22px;

    min-width:185px;

    height:50px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #countPanel{

        bottom:145px;

        transform:
            translateX(-50%)
            scale(.85);

    }

    #summonBar{

        height:145px;

        padding:6px;

        gap:6px;

    }

    .summonInfo{

        width:105px;

        flex-basis:105px;

    }

    .summonCard{

        width:88px;

        height:108px;

        flex-basis:88px;

    }

    .summonCard img{

        height:77px;

    }

}


/* =========================================================
   PORTRAIT
========================================================= */

@media(orientation:portrait){

    #frame{

        transform:
            translate(-50%,-50%)
            rotate(90deg);

    }

}

</style>

</head>


<body>

<div id="game">

<div id="frame">


<!-- =========================================================
     NỀN
========================================================= -->

<img
    id="battleBackground"
    src="./tranchien.jpg"
    alt="Trận chiến">


<!-- =========================================================
     TOP UI
========================================================= -->

<div id="topUI">


    <div class="waveBox">

        <div class="waveSmall">
            NORMAL
        </div>

        <div class="waveMain">
            WAVE 1
        </div>

    </div>


    <div
        id="stageLabel"
        class="stageLabel">

        MAP 1 • STAGE 1

    </div>


    <div class="energyTop">

        <div class="energyText">

            🔋 NĂNG LƯỢNG

            <span id="energyTopNumber">
                100
            </span>

        </div>


        <div class="energyBarTop">

            <div

                class="energyFillTop">
            </div>

        </div>

    </div>


    <div
        id="gold"
        class="goldBox">

    </div>


</div>


<!-- =========================================================
     BATTLE AREA
========================================================= -->

<div id="battleArea">


    <div id="lane"></div>


    <!-- THÁP MÌNH -->

    <div class="tower playerTower">

        <div class="towerHpWrap">

            <div
                id="playerTowerHp"
                class="towerHpFill">
            </div>

        </div>

    <!-- THÁP ĐỊCH -->

    <div class="tower enemyTower">

        <div class="towerHpWrap">

                id="enemyTowerHp"

</div>


<!-- =========================================================

    <div class="countBox">

        🧙 NHÂN VẬT

            0/10
        </strong>

    </div>


    <div class="countBox enemyCount">

        👹 QUÁI

        <strong id="enemyCount">
            0/10
        </strong>

    </div>

</div>


<!-- =========================================================
     SUMMON
========================================================= -->

<div id="summonBar">


    <div class="summonInfo">

        <div class="summonInfoTitle">

            🔋 NĂNG LƯỢNG

            <span id="energyNumber">
                100
            </span>
            /100

        </div>


        <div class="summonInfoBar">

            <div
                id="energyFill"
                class="summonInfoFill">
            </div>

        </div>

    </div>


    <!-- SUPERMAN -->

    <button
        id="supermanCard"
        class="summonCard">

        <span class="summonCost">

        <img

    <!-- LUFFY -->

        </span>


        <span
            style="
                display:flex;

    <!-- GOKU -->

        <span class="summonCost">

        </span>


        <span

                display:flex;
                align-items:center;

                font-size:13px;
                font-weight:900;
            "
        >
            GOKU
        </span>

            GOKU
        </span>

    </button>


</div>


<!-- =========================================================
     MESSAGE
========================================================= -->

<div id="message"></div>


<!-- =========================================================
     RESULT
========================================================= -->

<div id="result">

    <div class="resultBox">

        <div
            id="resultTitle"
            class="resultTitle">

            VICTORY

        </div>


        <div
            id="resultText"
            class="resultText">

            Đã vượt qua Stage.

        </div>


        <button
            id="resultButton"
            class="resultButton">

            QUAY LẠI CHỌN MÀN

        </button>

    </div>

</div>


</div>

</div>


<script>

/* =========================================================
   ĐỌC MAP / STAGE TỪ URL
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const currentMap =
    Math.max(
        1,
        Number(
            urlParams.get("map") ||
            localStorage.getItem(
                "currentMap"
            ) ||
            1
        )
    );


const currentStage =
    Math.max(
        1,
        Math.min(
            20,
            Number(
                urlParams.get("stage") ||
                localStorage.getItem(
                    "currentStage"
                ) ||
                1
            )
        )
    );


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    MAX_ENERGY:100,

    ENERGY_START:100,

    ENERGY_REGEN_PER_SECOND:5,

    SUPERMAN_COST:20,

    SUPERMAN_HP:600,

    SUPERMAN_DAMAGE:100,

    SUPERMAN_ATTACK_COOLDOWN:.4,

    SUPERMAN_ATTACK_RANGE:120,

    SUPERMAN_MOVE_SPEED:95,

    ENEMY_HP:260,

    ENEMY_DAMAGE:35,

    ENEMY_ATTACK_COOLDOWN:.5,

    ENEMY_ATTACK_RANGE:95,

    ENEMY_MOVE_SPEED:58,

    ENEMY_SPAWN_INTERVAL:3,

    MAX_PLAYER_UNITS:10,

    MAX_ENEMY_UNITS:10,

    TOWER_HP:1200,

    LANE_Y:385,

    PLAYER_SPAWN_X:215,

    ENEMY_SPAWN_X:1320,

    PLAYER_TOWER_X:155,

    ENEMY_TOWER_X:1381

};


/* =========================================================
   ELEMENTS
========================================================= */

const frame =
    document.getElementById(
        "frame"
    );

const playerUnitsLayer =
    document.getElementById(
        "playerUnits"
    );

const enemyUnitsLayer =
    document.getElementById(
        "enemyUnits"
    );

const damageLayer =
    document.getElementById(
        "damageLayer"
    );

const energyNumber =
    document.getElementById(
        "energyNumber"
    );

const energyFill =
    document.getElementById(
        "energyFill"
    );

const energyTopNumber =
    document.getElementById(
        "energyTopNumber"
    );

const energyTopFill =
    document.getElementById(
        "energyTopFill"
    );

const goldElement =
    document.getElementById(
        "gold"
    );

const playerTowerHpElement =
    document.getElementById(
        "playerTowerHp"
    );

const enemyTowerHpElement =
    document.getElementById(
        "enemyTowerHp"
    );

const playerCountElement =
    document.getElementById(
        "playerCount"
    );

const enemyCountElement =
    document.getElementById(
        "enemyCount"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const resultElement =
    document.getElementById(
        "result"
    );

const resultTitleElement =
    document.getElementById(
        "resultTitle"
    );

const resultTextElement =
    document.getElementById(
        "resultText"
    );

const resultButton =
    document.getElementById(
        "resultButton"
    );

const stageLabel =
    document.getElementById(
        "stageLabel"
    );


/* =========================================================
   STAGE LABEL
========================================================= */

stageLabel.textContent =
    "MAP " +
    currentMap +
    " • STAGE " +
    currentStage;


/* =========================================================
   STATE
========================================================= */

let energy =
    CONFIG.ENERGY_START;

let gold =
    500;

let playerTowerHp =
    CONFIG.TOWER_HP;

let enemyTowerHp =
    CONFIG.TOWER_HP;

let playerUnits =
    [];

let enemyUnits =
    [];

let nextPlayerId =
    1;

/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(
    a,
    b
){

    const dx =
        b.x -
        a.x;

    const dy =
        b.y -
        a.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}

){

    }


    const alivePlayers =
        playerUnits.filter(
            function(unit){
                return !unit.dead;
            }

    ){

            "CHƯA ĐỦ NĂNG LƯỢNG!"

    energy -=

    const element =
        createSupermanElement();

        element
    );

        id:

/* =========================================================
   FIND ENEMY
========================================================= */

function findEnemyForPlayer(
    unit
){

    let target =
        null;

    let best =
        Infinity;


    for(
        const enemy of enemyUnits
    ){

        if(
            enemy.dead
        ){

            continue;

        }


        if(
            enemy.x <=
            unit.x
        ){

            continue;

        }


        const d =
            distance(
                unit,
                enemy
            );


        if(
            d <
            best
        ){

            best =
                d;

            target =
                enemy;

        }

    }


    return target;

}


/* =========================================================
   FIND PLAYER
========================================================= */

function findPlayerForEnemy(
    enemy
){

    let target =
        null;

    let best =
        Infinity;


    for(
        const unit of playerUnits
    ){

        if(
            unit.dead
        ){

            continue;

        }


        if(
            unit.x >=
            enemy.x
        ){

            continue;

        }


        const d =
            distance(
                enemy,
                unit
            );


        if(
            d <
            best
        ){

            best =
                d;

            target =
                unit;

        }

    }


    return target;

}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(
    unit,
    target,
    dt
){

    const dx =
        target.x -
        unit.x;


    if(
        Math.abs(dx) <
        1
    ){

        return;

    }


    unit.x +=
        Math.sign(dx) *
        CONFIG.SUPERMAN_MOVE_SPEED *
        dt;


    unit.y =
        CONFIG.LANE_Y;


    unit.x =
        clamp(
            unit.x,
            195,
            1340
        );


    positionPlayer(
        unit
    );

}


/* =========================================================
   MOVE ENEMY
========================================================= */

function moveEnemy(
    enemy,
    target,
    dt
){

    const dx =
        target.x -
        enemy.x;


    if(
        Math.abs(dx) <
        1
    ){

        return;

    }


    enemy.x +=
        Math.sign(dx) *
        CONFIG.ENEMY_MOVE_SPEED *
        dt;


    enemy.y =
        CONFIG.LANE_Y;


    enemy.x =
        clamp(
            enemy.x,
            120,
            1380
        );


    positionEnemy(
        enemy
    );

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    unit,
    dt
){

    if(
        unit.dead
    ){

        return;

    }


    if(
        !unit.target ||
        unit.target.dead
    ){

        unit.target =
            findEnemyForPlayer(
                unit
            );

    }


    /*
       Có quân địch.
    */

    if(
        unit.target
    ){

        const enemy =
            unit.target;


        const d =
            distance(
                unit,
                enemy
            );


        if(
            d <=
            CONFIG.SUPERMAN_ATTACK_RANGE
        ){

            attackEnemyWithSuperman(
                unit,
                enemy,
                dt
            );

        }
        else{

            setFly(
                unit
            );


            movePlayer(
                unit,
                enemy,
                dt
            );

        }


        return;

    }


    /*
       Không có quái:
       đi tới tháp địch.
    */

    const tower = {

        x:
            CONFIG.ENEMY_TOWER_X,

        y:
            CONFIG.LANE_Y

    };


    const d =
        distance(
            unit,
            tower
        );


    if(
        d <=
        CONFIG.SUPERMAN_ATTACK_RANGE
    ){

        attackEnemyTower(
            unit,
            dt
        );

    }
    else{

        setFly(
            unit
        );


        movePlayer(
            unit,
            tower,
            dt
        );

    }

}


/* =========================================================
   SUPERMAN ATTACK
========================================================= */

function attackEnemyWithSuperman(
    unit,
    enemy,
    dt
){

    unit.attackTimer -=
        dt;


    if(
        unit.attackTimer >
        0
    ){

        return;

    }


    unit.attackTimer =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    unit.attacking =
        true;


    setAttack(
        unit
    );


    /*
       Damage giữa animation.
    */

    setTimeout(
        function(){

            if(
                !unit.dead &&
                !enemy.dead
            ){

                damageEnemy(
                    enemy,
                    unit.damage
                );

            }

        },
        160
    );


    /*
       Xong 0.4 giây.
    */

    setTimeout(
        function(){

            unit.attacking =
                false;


            if(
                unit.dead
            ){

                return;

            }


            if(
                !enemy.dead
            ){

                setIdle(
                    unit
                );

            }
            else{

                unit.target =
                    null;

                setFly(
                    unit
                );

            }

        },
        400
    );

}


/* =========================================================
   ATTACK ENEMY TOWER
========================================================= */

function attackEnemyTower(
    unit,
    dt
){

    unit.attackTimer -=
        dt;


    if(
        unit.attackTimer >
        0
    ){

        return;

    }


    unit.attackTimer =
        CONFIG.SUPERMAN_ATTACK_COOLDOWN;


    unit.attacking =
        true;


    setAttack(
        unit
    );


    setTimeout(
        function(){

            if(
                !unit.dead &&
                !battleFinished
            ){

                damageEnemyTower(
                    unit.damage
                );

            }

        },
        160
    );


    setTimeout(
        function(){

            unit.attacking =
                false;


            if(
                !unit.dead
            ){

                setIdle(
                    unit
                );

            }

        },
        400
    );

}

/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemy(
    enemy,
    dt
){

    if(
        enemy.dead
    ){

        return;

    }


    if(
        !enemy.target ||
        enemy.target.dead
    ){

        enemy.target =
            findPlayerForEnemy(
                enemy
            );

    }


    /*
       Có Superman.
    */

    if(
        enemy.target
    ){

        const player =
            enemy.target;


        const d =
            distance(
                enemy,
                player
            );


        if(
            d <=
            CONFIG.ENEMY_ATTACK_RANGE
        ){

            attackPlayerWithEnemy(
                enemy,
                player,
                dt
            );

        }
        else{

            moveEnemy(
                enemy,
                player,
                dt
            );

        }


        return;

    }


    /*
       Không có Superman:
       tới tháp mình.
    */

    const tower = {

        x:
            CONFIG.PLAYER_TOWER_X,

        y:
            CONFIG.LANE_Y

    };


    const d =
        distance(
            enemy,
            tower
        );


    if(
        d <=
        CONFIG.ENEMY_ATTACK_RANGE
    ){

        attackPlayerTower(
            enemy,
            dt
        );

    }
    else{

        moveEnemy(
            enemy,
            tower,
            dt
        );

    }

}


/* =========================================================
   ENEMY ATTACK PLAYER
========================================================= */

function attackPlayerWithEnemy(
    enemy,
    player,
    dt
){

    enemy.attackTimer -=
        dt;


    if(
        enemy.attackTimer >
        0
    ){

        return;

    }


    enemy.attackTimer =
        CONFIG.ENEMY_ATTACK_COOLDOWN;


    damagePlayer(
        player,
        enemy.damage
    );

}


/* =========================================================
   DAMAGE PLAYER
========================================================= */

function damagePlayer(
    unit,
    damage
){

    if(
        unit.dead
    ){

        return;

    }


    unit.hp -=
        damage;


    createDamage(
        unit.x,
        unit.y,
        damage
    );


    if(
        unit.hp <=
        0
    ){

        killPlayer(
            unit
        );

    }

}


/* =========================================================
   KILL PLAYER
========================================================= */

function killPlayer(
    unit
){

    if(
        unit.dead
    ){

        return;

    }


    unit.dead =
        true;


    unit.element.remove();


    updateUnitCounts();


    for(
        const enemy of enemyUnits
    ){

        if(
            enemy.target ===
            unit
        ){

            enemy.target =
                null;

        }

    }

}


/* =========================================================
   DAMAGE ENEMY
========================================================= */

function damageEnemy(
    enemy,
    damage
){

    if(
        enemy.dead
    ){

        return;

    }


    enemy.hp -=
        damage;


    enemy.hp =
        Math.max(
            0,
            enemy.hp
        );


    enemy.hpFill.style.width =
        (
            enemy.hp /
            CONFIG.ENEMY_HP *
            100
        ) + "%";


    createDamage(
        enemy.x,
        enemy.y,
        damage
    );


    if(
        enemy.hp <=
        0
    ){

        killEnemy(
            enemy
        );

    }

}

/* =========================================================
   LƯU TIẾN ĐỘ SAU KHI THẮNG
========================================================= */

function saveStageVictory(){

    /*
       Stage hoàn thành cao nhất
       của Map hiện tại.
    */

    const completedKey =
        "map" +
        currentMap +
        "_completed_stage";


    const oldCompleted =
        Number(
            localStorage.getItem(
                completedKey
            ) || 0
        );


    if(
        currentStage >
        oldCompleted
    ){

        localStorage.setItem(
            completedKey,
            String(
                Math.min(
                    20,
                    currentStage
                )
            )
        );

    }


    /*
       Stage tiếp theo được mở.
    */

    const unlockedKey =
        "map" +
        currentMap +
        "_unlocked_stage";


    const oldUnlocked =
        Number(
            localStorage.getItem(
                unlockedKey
            ) || 1
        );


    const nextStage =
        Math.min(
            21,
            currentStage + 1
        );


    if(
        nextStage >
        oldUnlocked
    ){

        localStorage.setItem(
            unlockedKey,
            String(
                nextStage
            )
        );

    }


    /*
       Progress của Map.
       Dùng để mở Map tiếp theo.
    */

    const mapProgressKey =
        "animeDorado_map" +
        currentMap +
        "_progress";


    const oldProgress =
        Number(
            localStorage.getItem(
                mapProgressKey
            ) || 0
        );


    if(
        currentStage >
        oldProgress
    ){

        localStorage.setItem(
            mapProgressKey,
            String(
                Math.min(
                    20,
                    currentStage
                )
            )
        );

    }

}


/* =========================================================
   KẾT THÚC TRẬN
========================================================= */

function finishBattle(
    victory
){

    if(
        battleFinished
    ){

        return;

    }


    battleFinished =
        true;


    if(
        victory
    ){

        /*
           LƯU STAGE TRƯỚC KHI
           HIỆN MÀN HÌNH THẮNG.
        */

        saveStageVictory();


        resultTitleElement.textContent =
            "VICTORY";


        resultTextElement.textContent =
            "Đã vượt qua MAP " +
            currentMap +
            " • STAGE " +
            currentStage +
            ".";


        resultButton.textContent =
            currentStage <
            20
                ? "QUAY LẠI CHỌN MÀN"
                : "HOÀN THÀNH MAP";


    }
    else{

        resultTitleElement.textContent =
            "DEFEAT";


        resultTextElement.textContent =
            "Bạn đã thua MAP " +
            currentMap +
            " • STAGE " +
            currentStage +
            ".";


        resultButton.textContent =
            "CHƠI LẠI";

    }


    resultElement.style.display =
        "flex";

}

/* =========================================================
   ENERGY REGEN
========================================================= */

function updateEnergy(
    now
){

    const seconds =
        (
            now -
            energyLastTime
        ) /
        1000;


    energyLastTime =
        now;


    if(
        seconds <=
        0
    ){

        return;

    }


    energy +=
        CONFIG.ENERGY_REGEN_PER_SECOND *
        seconds;


    energy =
        Math.min(
            CONFIG.MAX_ENERGY,
            energy
        );


    updateEnergyUi();

}


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(
    now
){

    const dt =
        Math.min(
            (
                now -
                lastTime
            ) /
            1000,
            .05
        );


    lastTime =
        now;


    if(
        !battleFinished
    ){

        updateEnergy(
            now
        );


        for(
            const unit of playerUnits
        ){

            updatePlayer(
                unit,
                dt
            );

        }


        for(
            const enemy of enemyUnits
        ){

            updateEnemy(
                enemy,
                dt
            );

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   SCALE
========================================================= */

function scaleGame(){

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const scale =
        Math.min(
            width / 1536,
            height / 864
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "scale(" +
        scale +
        ")";

}


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);

updateUnitCounts();

scaleGame();

startEnemySpawner();

requestAnimationFrame(
    gameLoop
);
