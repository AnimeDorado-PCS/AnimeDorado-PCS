<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO - MAP 1</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#gameFrame{
    position:absolute;
    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}

#background{
    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    z-index:0;

    user-select:none;
    -webkit-user-drag:none;
}


/* =========================================
   QUAY LẠI
========================================= */

.back-hit{
    position:absolute;

    left:15px;
    top:15px;

    width:70px;
    height:65px;

    border:0;
    outline:0;

    background:transparent;

    cursor:pointer;

    z-index:100;
}


/* =========================================
   STAGE
========================================= */

.stage{

    position:absolute;

    width:145px;
    height:145px;

    border:0;
    outline:0;

    padding:0;

    background:transparent;

    cursor:pointer;

    z-index:50;

    transition:
        transform .15s ease,
        filter .15s ease,
        opacity .15s ease;
}

.stage:active{
    transform:scale(.95);
}


/* =========================================
   VỊ TRÍ 20 STAGE
========================================= */

.stage1{
    left:580px;
    top:150px;
}

.stage2{
    left:725px;
    top:150px;
}

.stage3{
    left:870px;
    top:150px;
}

.stage4{
    left:1015px;
    top:150px;
}

.stage5{
    left:1160px;
    top:150px;
}


.stage6{
    left:580px;
    top:300px;
}

.stage7{
    left:725px;
    top:300px;
}

.stage8{
    left:870px;
    top:300px;
}

.stage9{
    left:1015px;
    top:300px;
}

.stage10{
    left:1160px;
    top:300px;
}


.stage11{
    left:580px;
    top:445px;
}

.stage12{
    left:725px;
    top:445px;
}

.stage13{
    left:870px;
    top:445px;
}

.stage14{
    left:1015px;
    top:445px;
}

.stage15{
    left:1160px;
    top:445px;
}


.stage16{
    left:580px;
    top:590px;
}

.stage17{
    left:725px;
    top:590px;
}

.stage18{
    left:870px;
    top:590px;
}

.stage19{
    left:1015px;
    top:590px;
}

.stage20{
    left:1160px;
    top:590px;
}


/* =========================================
   STAGE ĐÃ HOÀN THÀNH
========================================= */

.stage.completed{

    filter:
        saturate(.55)
        brightness(.72);

}


/* viền hoàn thành */

.stage.completed::before{

    content:"";

    position:absolute;

    inset:7px;

    border:
        3px solid
        rgba(50,240,100,.85);

    border-radius:22px;

    box-shadow:
        0 0 14px
        rgba(50,240,100,.3);

    pointer-events:none;
}


/* dấu tick */

.stage.completed::after{

    content:"✓";

    position:absolute;

    right:7px;
    top:6px;

    width:31px;
    height:31px;

    border-radius:50%;

    background:#22ce55;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;

    font-weight:900;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.35);

    pointer-events:none;
}


/* =========================================
   STAGE ĐANG MỞ
========================================= */

.stage.unlocked{

    opacity:1;

    filter:none;

    cursor:pointer;
}


/* =========================================
   STAGE KHÓA
========================================= */

.stage.locked{

    opacity:.62;

    filter:
        grayscale(.65)
        brightness(.72);

    cursor:not-allowed;
}


/* khóa */

.stage.locked::after{

    content:"🔒";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:55px;
    height:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        rgba(0,0,0,.58);

    border:
        2px solid
        rgba(255,255,255,.5);

    font-size:28px;

    pointer-events:none;
}


/* =========================================
   PANEL TIẾN ĐỘ
========================================= */

#progress{

    position:absolute;

    right:18px;
    bottom:16px;

    z-index:100;

    padding:
        8px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.52);

    border:
        1px solid
        rgba(255,255,255,.17);

    color:#fff;

    font-size:10px;

    font-weight:900;
}


/* =========================================
   MESSAGE
========================================= */

#message{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.94);

    min-width:280px;

    padding:
        15px 22px;

    border-radius:15px;

    background:
        rgba(0,0,0,.84);

    border:
        1px solid
        rgba(255,214,90,.4);

    color:#ffd65a;

    text-align:center;

    font-size:14px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    z-index:200;

    transition:
        opacity .18s ease,
        transform .18s ease;
}

#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================
   SCALE
========================================= */

@media(max-width:700px){

    #progress{

        right:8px;
        bottom:8px;

        font-size:9px;

        padding:
            7px 9px;
    }
}

</style>

</head>

<body>

<div id="app">

<div id="gameFrame">


<!-- =========================================
     NỀN
========================================= -->

<img
    id="background"
    src="./chonmanmap1.png"
    alt="MAP 1">


<!-- =========================================
     QUAY LẠI
========================================= -->

<button
    class="back-hit"
    aria-label="Quay lại"
    onclick="goBack()">
</button>


<!-- =========================================
     20 STAGE
========================================= -->

<button class="stage stage1" data-stage="1"></button>
<button class="stage stage2" data-stage="2"></button>
<button class="stage stage3" data-stage="3"></button>
<button class="stage stage4" data-stage="4"></button>
<button class="stage stage5" data-stage="5"></button>

<button class="stage stage6" data-stage="6"></button>
<button class="stage stage7" data-stage="7"></button>
<button class="stage stage8" data-stage="8"></button>
<button class="stage stage9" data-stage="9"></button>
<button class="stage stage10" data-stage="10"></button>

<button class="stage stage11" data-stage="11"></button>
<button class="stage stage12" data-stage="12"></button>
<button class="stage stage13" data-stage="13"></button>
<button class="stage stage14" data-stage="14"></button>
<button class="stage stage15" data-stage="15"></button>

<button class="stage stage16" data-stage="16"></button>
<button class="stage stage17" data-stage="17"></button>
<button class="stage stage18" data-stage="18"></button>
<button class="stage stage19" data-stage="19"></button>
<button class="stage stage20" data-stage="20"></button>


<!-- =========================================
     TIẾN ĐỘ
========================================= -->

<div id="progress">
    MAP 1 • 0/20
</div>


<!-- =========================================
     THÔNG BÁO
========================================= -->

<div id="message"></div>


</div>

</div>


<script>

/* =========================================================
   MAP 1 PROGRESS
========================================================= */

const COMPLETED_KEY =
    "map1_completed_stage";

const UNLOCKED_KEY =
    "map1_unlocked_stage";


/* =========================================================
   ĐỌC SỐ STAGE ĐÃ VƯỢT
========================================================= */

function getCompletedStage(){

    let value =
        Number(
            localStorage.getItem(
                COMPLETED_KEY
            ) || 0
        );


    if(
        !Number.isFinite(value)
    ){

        value = 0;

    }


    return Math.max(
        0,
        Math.min(
            20,
            value
        )
    );

}


/* =========================================================
   ĐỌC STAGE ĐÃ MỞ
========================================================= */

function getUnlockedStage(){

    let value =
        Number(
            localStorage.getItem(
                UNLOCKED_KEY
            ) || 1
        );


    if(
        !Number.isFinite(value)
    ){

        value = 1;

    }


    /*
       Ít nhất Stage 1.
       Tối đa 21:
       21 = đã hoàn thành Stage 20.
    */

    return Math.max(
        1,
        Math.min(
            21,
            value
        )
    );

}


/* =========================================================
   ĐỒNG BỘ TIẾN ĐỘ
========================================================= */

function normalizeProgress(){

    const completed =
        getCompletedStage();

    let unlocked =
        getUnlockedStage();


    /*
       Nếu đã hoàn thành Stage N
       thì ít nhất phải mở Stage N+1.
    */

    const requiredUnlocked =
        Math.min(
            21,
            completed + 1
        );


    if(
        unlocked <
        requiredUnlocked
    ){

        unlocked =
            requiredUnlocked;


        localStorage.setItem(
            UNLOCKED_KEY,
            String(unlocked)
        );

    }

}


/* =========================================================
   UPDATE 20 STAGE
========================================================= */

function updateStages(){

    normalizeProgress();


    const completed =
        getCompletedStage();

    const unlocked =
        getUnlockedStage();


    const buttons =
        document.querySelectorAll(
            ".stage"
        );


    buttons.forEach(
        function(button){

            const stage =
                Number(
                    button.dataset.stage
                );


            /*
               RESET
            */

            button.classList.remove(
                "completed"
            );

            button.classList.remove(
                "unlocked"
            );

            button.classList.remove(
                "locked"
            );


            /*
               =========================
               ĐÃ VƯỢT
               =========================
            */

            if(
                stage <=
                completed
            ){

                button.classList.add(
                    "completed"
                );

                button.disabled =
                    false;

                return;

            }


            /*
               =========================
               ĐÃ MỞ
               =========================
            */

            if(
                stage <=
                unlocked
            ){

                button.classList.add(
                    "unlocked"
                );

                button.disabled =
                    false;

                return;

            }


            /*
               =========================
               KHÓA
               =========================
            */

            button.classList.add(
                "locked"
            );

            button.disabled =
                true;

        }
    );


    updateProgress(
        completed
    );

}


/* =========================================================
   UPDATE PROGRESS PANEL
========================================================= */

function updateProgress(
    completed
){

    document
        .getElementById(
            "progress"
        )
        .textContent =

        "MAP 1 • " +
        completed +
        "/20";

}


/* =========================================================
   CLICK STAGE
========================================================= */

document
    .querySelectorAll(
        ".stage"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const stage =
                        Number(
                            button.dataset.stage
                        );


                    const unlocked =
                        getUnlockedStage();


                    /*
                       CHƯA MỞ
                    */

                    if(
                        stage >
                        unlocked
                    ){

                        showMessage(
                            "STAGE " +
                            stage +
                            " CHƯA MỞ!"
                        );

                        return;

                    }


                    /*
                       LƯU MAP
                    */

                    localStorage.setItem(
                        "currentMap",
                        "1"
                    );


                    /*
                       LƯU STAGE ĐANG CHƠI
                    */

                    localStorage.setItem(
                        "currentStage",
                        String(stage)
                    );


                    /*
                       VÀO TRẬN
                    */

                    window.location.href =
                        "./tranchien.html" +
                        "?map=1" +
                        "&stage=" +
                        stage;

                }
            );

        }
    );


/* =========================================================
   QUAY LẠI
========================================================= */

function goBack(){

    window.location.href =
        "./chonmap.html";

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;


function showMessage(
    text
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function(){

                box.classList.remove(
                    "show"
                );

            },
            1200
        );

}


/* =========================================================
   SCALE
========================================================= */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    if(
        width >=
        height
    ){

        const scale =
            Math.min(
                width / 1536,
                height / 864
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

        return;

    }


    const scale =
        Math.min(
            width / 864,
            height / 1536
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "rotate(90deg) " +
        "scale(" +
        scale +
        ")";

}


/* =========================================================
   IMAGE ERROR
========================================================= */

document
    .getElementById(
        "background"
    )
    .addEventListener(
        "error",
        function(){

            showMessage(
                "Không tìm thấy chonmanmap1.png"
            );

        }
    );


/* =========================================================
   START
========================================================= */

updateStages();

scaleGame();


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);

</script>

</body>
</html>
