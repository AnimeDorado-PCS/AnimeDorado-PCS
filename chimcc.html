<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🐧 Chim cánh cụt chạy</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #d9edf7;
            overflow: hidden;
            font-family: sans-serif;
        }
        #penguin {
            position: fixed;
            font-size: 64px;
            left: 100px;
            top: 100px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            transition: filter 0.2s;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.35));
        }
        .left {
            transform: scaleX(-1);
        }
        .info {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 8px 20px;
            font-size: 14px;
            color: #2c4b6b;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            z-index: 20;
            pointer-events: none;
        }
        .footprint {
            position: fixed;
            font-size: 20px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 5;
            animation: fadeFoot 1.2s ease-out forwards;
        }
        @keyframes fadeFoot {
            0% { opacity: 0.9; transform: scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.2) rotate(40deg) translateY(18px); }
        }
    </style>
</head>
<body>

<div id="penguin">🐧</div>
<div class="info">🖱️ Click chim: đổi hướng | Click nền: tăng tốc | Tốc độ: <span id="speedVal">3.0</span></div>

<script>
(function() {
    const penguin = document.getElementById('penguin');
    const speedSpan = document.getElementById('speedVal');
    const body = document.body;

    let vw = window.innerWidth;
    let vh = window.innerHeight;
    const pw = 64;  // xấp xỉ kích thước emoji
    const ph = 64;

    let x = 300;
    let y = 300;
    let baseSpeed = 3.0;
    let speed = baseSpeed;
    // Hướng ban đầu ngẫu nhiên
    let angle = Math.random() * Math.PI * 2;
    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed;
    let facingLeft = vx < 0;
    let frame = 0;
    let boostTimer = 0;

    function updateFacing() {
        if (vx < -0.3 && !facingLeft) {
            facingLeft = true;
            penguin.classList.add('left');
        } else if (vx > 0.3 && facingLeft) {
            facingLeft = false;
            penguin.classList.remove('left');
        }
    }

    function setPos() {
        penguin.style.left = x + 'px';
        penguin.style.top = y + 'px';
    }

    function createFootprint() {
        const fp = document.createElement('span');
        fp.className = 'footprint';
        fp.textContent = '🐾';
        const offsetX = facingLeft ? 20 : -20;
        fp.style.left = (x + pw/2 + offsetX) + 'px';
        fp.style.top = (y + ph - 10) + 'px';
        body.appendChild(fp);
        setTimeout(() => fp.remove(), 1200);
    }

    function loop() {
        // Giảm dần boost
        if (boostTimer > 0) {
            boostTimer--;
            if (boostTimer === 0) {
                speed = baseSpeed;
                // điều chỉnh lại vận tốc
                const cur = Math.sqrt(vx*vx + vy*vy);
                if (cur > speed) {
                    vx *= speed / cur;
                    vy *= speed / cur;
                }
            }
        }

        // Di chuyển
        x += vx;
        y += vy;

        // Va chạm tường
        const margin = 4;
        if (x <= margin) { x = margin; vx = Math.abs(vx); }
        if (x >= vw - pw - margin) { x = vw - pw - margin; vx = -Math.abs(vx); }
        if (y <= margin) { y = margin; vy = Math.abs(vy); }
        if (y >= vh - ph - margin) { y = vh - ph - margin; vy = -Math.abs(vy); }

        updateFacing();
        setPos();

        // Dấu chân mỗi 6 frame khi di chuyển đủ nhanh
        frame++;
        if (frame % 6 === 0 && Math.sqrt(vx*vx + vy*vy) > 1.2) {
            createFootprint();
        }

        // Thỉnh thoảng đổi hướng nhẹ tự nhiên
        if (Math.random() < 0.002) {
            vx += (Math.random() - 0.5) * 0.9;
            vy += (Math.random() - 0.5) * 0.9;
            updateFacing();
        }

        // Hiển thị tốc độ
        const dispSpeed = Math.sqrt(vx*vx + vy*vy).toFixed(1);
        speedSpan.textContent = dispSpeed;

        requestAnimationFrame(loop);
    }

    // Click vào chim: đổi hướng ngẫu nhiên + boost nhẹ
    penguin.addEventListener('click', function(e) {
        e.stopPropagation();
        angle = Math.random() * Math.PI * 2;
        speed = baseSpeed * 1.4;
        vx = Math.cos(angle) * speed;
        vy = Math.sin(angle) * speed;
        boostTimer = 35;  // khoảng 0.6 giây ở 60fps
        updateFacing();
    });

    // Click nền: tăng tốc và hút nhẹ về phía click
    body.addEventListener('click', function(e) {
        if (e.target === penguin) return;
        const dx = e.clientX - (x + pw/2);
        const dy = e.clientY - (y + ph/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 5) {
            speed = baseSpeed * 2.2;
            vx += (dx / dist) * speed * 0.5;
            vy += (dy / dist) * speed * 0.5;
            // Giới hạn vận tốc tối đa
            const cur = Math.sqrt(vx*vx + vy*vy);
            const maxSpeed = speed * 1.8;
            if (cur > maxSpeed) {
                vx *= maxSpeed / cur;
                vy *= maxSpeed / cur;
            }
            boostTimer = 45;
        }
        updateFacing();
    });

    // Cập nhật khi resize cửa sổ
    window.addEventListener('resize', () => {
        vw = window.innerWidth;
        vh = window.innerHeight;
        x = Math.min(Math.max(x, 0), vw - pw);
        y = Math.min(Math.max(y, 0), vh - ph);
        setPos();
    });

    // Khởi tạo
    setPos();
    updateFacing();
    requestAnimationFrame(loop);
})();
</script>

</body>
</html>
