<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chim Cánh Cụt El Dorado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Nền rừng vàng El Dorado */
            background: linear-gradient(180deg, #1a3c2e 0%, #2e5a1e 50%, #e6b800 100%);
            position: relative;
        }

        /* Hiệu ứng ánh vàng lấp lánh */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 215, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        #penguin {
            position: absolute;
            width: 80px;
            height: 80px;
            font-size: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
            z-index: 10;
        }

        /* Nền thêm vàng rơi nhẹ */
        .gold-dust {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255, 215, 0, 0.6) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="gold-dust"></div>
    <div id="penguin">🐧</div>

    <script>
        (function () {
            const penguin = document.getElementById('penguin');
            const SIZE = 80; // kích thước thực của box chim

            let x, y;           // vị trí hiện tại (px)
            let dx, dy;        // vận tốc (px/frame)
            let lastTimestamp = 0;
            let directionChangeTimer = 0;
            const DIRECTION_CHANGE_INTERVAL = 1500; // 1.5 giây đổi hướng một lần

            // Tạo vector vận tốc ngẫu nhiên (tốc độ từ 2 đến 4 px/frame)
            function randomVelocity() {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 2;
                return {
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed
                };
            }

            // Khởi tạo vị trí ngẫu nhiên trong viewport
            function initPosition() {
                x = Math.random() * (window.innerWidth - SIZE);
                y = Math.random() * (window.innerHeight - SIZE);
                const vel = randomVelocity();
                dx = vel.dx;
                dy = vel.dy;
                penguin.style.left = x + 'px';
                penguin.style.top = y + 'px';
            }

            // Lật mặt chim theo hướng ngang
            function updateFlip() {
                if (dx > 0.1) {
                    penguin.style.transform = 'scaleX(1)';
                } else if (dx < -0.1) {
                    penguin.style.transform = 'scaleX(-1)';
                }
                // Nếu dx gần 0 (đang đứng yên) thì giữ nguyên hướng cũ
            }

            // Xử lý va chạm biên – nảy ngược lại
            function checkBounds() {
                if (x <= 0) {
                    x = 0;
                    dx = Math.abs(dx);
                } else if (x + SIZE >= window.innerWidth) {
                    x = window.innerWidth - SIZE;
                    dx = -Math.abs(dx);
                }

                if (y <= 0) {
                    y = 0;
                    dy = Math.abs(dy);
                } else if (y + SIZE >= window.innerHeight) {
                    y = window.innerHeight - SIZE;
                    dy = -Math.abs(dy);
                }
            }

            // Vòng lặp animation chính (requestAnimationFrame)
            function animate(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const deltaTime = timestamp - lastTimestamp;
                lastTimestamp = timestamp;

                // Cập nhật bộ đếm thời gian đổi hướng
                directionChangeTimer += deltaTime;
                if (directionChangeTimer >= DIRECTION_CHANGE_INTERVAL) {
                    directionChangeTimer = 0;
                    const vel = randomVelocity();
                    dx = vel.dx;
                    dy = vel.dy;
                }

                // Di chuyển
                x += dx;
                y += dy;

                // Kiểm tra biên
                checkBounds();

                // Cập nhật vị trí hiển thị
                penguin.style.left = x + 'px';
                penguin.style.top = y + 'px';

                // Cập nhật lật mặt
                updateFlip();

                requestAnimationFrame(animate);
            }

            // Xử lý khi người dùng resize cửa sổ – giữ chim trong khung
            window.addEventListener('resize', () => {
                if (x + SIZE > window.innerWidth) x = window.innerWidth - SIZE;
                if (y + SIZE > window.innerHeight) y = window.innerHeight - SIZE;
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                penguin.style.left = x + 'px';
                penguin.style.top = y + 'px';
            });

            // Khởi động
            initPosition();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
