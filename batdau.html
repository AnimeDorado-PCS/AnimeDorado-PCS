<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>ANIME DORADO - Bắt đầu</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    background:#05080d;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body{

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.container{

    width:min(
        520px,
        90vw
    );

    padding:28px;

    text-align:center;

    border:
        1px solid
        rgba(255,214,90,.28);

    border-radius:22px;

    background:
        rgba(0,0,0,.45);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

}


h1{

    color:#ffd65a;

    font-size:
        clamp(
            28px,
            8vw,
            42px
        );

}


p{

    margin-top:10px;

    color:#bfc8d6;

    line-height:1.5;

}


.team-preview{

    margin-top:20px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:7px;

}


.slot{

    aspect-ratio:1/1;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:10px;

    background:
        rgba(255,255,255,.04);

    overflow:hidden;

}


.slot img{

    width:100%;

    height:100%;

    object-fit:contain;

}


.slot.empty{

    display:flex;

    align-items:center;

    justify-content:center;

    color:#626d7d;

    font-size:22px;

}


.loading{

    margin-top:20px;

    color:#ffd65a;

    font-size:13px;

}


.back{

    margin-top:20px;

    width:180px;

    height:44px;

    border:0;

    border-radius:11px;

    background:
        rgba(255,255,255,.08);

    color:#fff;

    font-weight:bold;

}

</style>

</head>

<body>


<div class="container">

    <h1>
        BẮT ĐẦU
    </h1>

    <p>
        Đang chuẩn bị đội hình...
    </p>


    <div
        id="teamPreview"
        class="team-preview">
    </div>


    <div class="loading">
        Đang vào bản đồ...
    </div>


    <button
        class="back"
        onclick="goBack()">

        ← LẬP NHÓM

    </button>

</div>


<script>

/* ==================================================
   NHÂN VẬT
================================================== */

const characters = {

    superman:{
        name:"Superman",
        image:
            "https://i.postimg.cc/CLqTGxNQ/superman.png"
    },

    luffy:{
        name:"Luffy",
        image:
            "./luffy.png"
    },

    goku:{
        name:"Goku",
        image:
            "./goku.png"
    }

};


/* ==================================================
   HIỂN THỊ ĐỘI HÌNH
================================================== */

function showTeam(){

    const box =
        document.getElementById(
            "teamPreview"
        );


    let team = [];


    try{

        const saved =
            localStorage.getItem(
                "animeDoradoTeam"
            );


        if(saved){

            const data =
                JSON.parse(saved);


            if(
                Array.isArray(data)
            ){

                team = data;

            }

        }

    }
    catch(error){

        team = [];

    }


    for(
        let i=0;
        i<5;
        i++
    ){

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot";


        const id =
            team[i];


        if(
            id &&
            characters[id]
        ){

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                characters[id].image;


            image.alt =
                characters[id].name;


            slot.appendChild(
                image
            );

        }
        else{

            slot.classList.add(
                "empty"
            );


            slot.textContent =
                "+";

        }


        box.appendChild(
            slot
        );

    }

}


/* ==================================================
   KIỂM TRA ĐỘI HÌNH
================================================== */

function hasTeam(){

    try{

        const saved =
            localStorage.getItem(
                "animeDoradoTeam"
            );


        if(!saved){

            return false;

        }


        const team =
            JSON.parse(saved);


        if(
            !Array.isArray(team)
        ){

            return false;

        }


        return team.some(
            function(id){

                return (
                    id &&
                    characters[id]
                );

            }
        );

    }
    catch(error){

        return false;

    }

}


/* ==================================================
   VÀO MAP
================================================== */

function goMap(){

    window.location.href =
        "/AnimeDorado-PCS/map.html";

}


/* ==================================================
   QUAY LẠI
================================================== */

function goBack(){

    window.location.href =
        "/AnimeDorado-PCS/lapnhom.html";

}


/* ==================================================
   START
================================================== */

showTeam();


/*
   Nếu có đội hình:
   chờ một chút rồi vào map.
*/

if(
    hasTeam()
){

    setTimeout(
        function(){

            goMap();

        },
        1200
    );

}

else{

    document
        .querySelector(
            ".loading"
        )
        .textContent =
        "Bạn chưa trang bị nhân vật.";

}

</script>


</body>

</html>
