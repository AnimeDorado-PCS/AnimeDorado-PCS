<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO - BẮT ĐẦU</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#app{

    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #294968 0%,
            #111c2b 48%,
            #030609 100%
        );

}

.box{

    width:min(
        500px,
        90vw
    );

    padding:35px 25px;

    text-align:center;

    border:
        1px solid
        rgba(255,214,90,.28);

    border-radius:24px;

    background:
        rgba(0,0,0,.38);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

}

.title{

    color:#ffd65a;

    font-size:
        clamp(
            35px,
            9vw,
            58px
        );

    font-weight:1000;

    text-shadow:
        0 4px 15px
        rgba(0,0,0,.7);

}

.text{

    margin-top:10px;

    color:#c1cbd7;

    font-size:14px;

}

.loading{

    margin-top:18px;

    color:#ffd65a;

    font-size:12px;

}

</style>

</head>


<body>

<div id="app">

    <div class="box">

        <div class="title">
            BẮT ĐẦU
        </div>

        <div class="text">
            Đang chuẩn bị hành trình...
        </div>

        <div class="loading">
            Đang vào chọn bản đồ
        </div>

    </div>

</div>


<script>

/*
==================================================
BATDAU → CHONMAP
==================================================
*/

setTimeout(
    function(){

        window.location.href =
            "./chonmap.html";

    },
    800
);

</script>

</body>

</html>
