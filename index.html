<!DOCTYPE html>

<title>ANIME DORADO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

}

button{

    font:inherit;

}


/* ==================================================
   SCREEN
================================================== */

.screen{

    position:absolute;

    inset:0;

    display:none;

    overflow:hidden;

}

.screen.active{

    display:block;

}


/* ==================================================
   LANDING
================================================== */

#landingScreen{

    background:
        radial-gradient(
            circle at center,
            #294268 0%,
            #101827 55%,
            #020408 100%
        );

}

.landing-box{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(
        560px,
        90vw
    );

    padding:35px;

    text-align:center;

    border:
        1px solid
        rgba(255,214,90,.35);

    border-radius:24px;

    background:
        rgba(0,0,0,.45);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

}

.landing-title{

    font-size:42px;

    font-weight:900;

    color:#ffd65a;

}

.landing-text{

    margin-top:10px;

    color:#c8cedb;

}

.experience-button{

    margin-top:25px;

    min-width:240px;

    min-height:58px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;

}


/* ==================================================
   HOME
================================================== */

#homeScreen{

    background:#000;

}

.game-frame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

}

#gameBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    object-fit:fill;

    display:block;

}

.button-layer{

    position:absolute;

    inset:0;

    pointer-events:none;

}

.game-button{

    position:absolute;

    border:none;

    background:transparent;

    pointer-events:auto;

    cursor:pointer;

}


/* HOME BUTTONS */

.btn-profile{

    left:18px;
    top:15px;

    width:430px;
    height:130px;

}

.btn-gold{

    left:565px;
    top:8px;

    width:285px;
    height:75px;

}

.btn-ruby{

    left:875px;
    top:8px;

    width:275px;
    height:75px;

}

.btn-lapnhom{

    left:35px;
    bottom:8px;

    width:145px;
    height:125px;

}

.btn-nangcap{

    left:245px;
    bottom:8px;

    width:145px;
    height:125px;

}

.btn-rutnhanvat{

    left:450px;
    bottom:8px;

    width:160px;
    height:125px;

}

.btn-cuahang{

    left:650px;
    bottom:8px;

    width:160px;
    height:125px;

}

.btn-batdau{

    bottom:0;

    height:175px;

/* ==================================================
   LẬP NHÓM
================================================== */

#lapnhomScreen{

.team-page{

/* ==================================================
   HEADER
================================================== */

.team-header{

}

.back-button{

    border-radius:14px;

.team-header-title{

.team-header-title p{

    font-size:12px;

    color:#aeb7c6;

}

.header-space{

    width:48px;

/* ==================================================
   TEAM SLOTS
================================================== */

.team-panel{

    border:

        rgba(255,214,90,.25);

    border-radius:22px;

    padding:15px;

    background:
        rgba(0,0,0,.3);

    box-shadow:

        rgba(0,0,0,.25);

}

.panel-title{

    color:#ffd65a;

    font-size:15px;

    font-weight:bold;

    text-align:center;

    margin-bottom:12px;

}

.team-slots{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:10px;

}

.team-slot{

    position:relative;

    aspect-ratio:1/1;

    min-height:80px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:16px;

    background:
        linear-gradient(

            rgba(0,0,0,.3)
        );

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    cursor:pointer;

}

.team-slot.selected{

    border:
        2px solid
        #ffd65a;

    box-shadow:
        0 0 18px
        rgba(255,214,90,.2);

}

.team-slot.empty::before{

    content:"+";

    font-size:31px;

    color:#657084;

}

.slot-number{

    position:absolute;

    left:7px;

    top:6px;

    font-size:11px;

    color:#858ea0;

    z-index:3;

}

.slot-image{

    width:100%;

    height:100%;

    object-fit:contain;

}

.slot-name{

    position:absolute;

    left:0;

    right:0;

    padding:5px 2px;

    background:

    text-align:center;

    font-size:10px;

    font-weight:bold;

   CHARACTER AREA
================================================== */

    gap:15px;

    margin-top:15px;

.character-view{

.character-top{

.character-name{

<script>

/* ==================================================
   DỮ LIỆU NHÂN VẬT
================================================== */

const characters = {

    superman:{

        id:"superman",

        name:"Superman",

        rarity:"SSR",

        level:1,

        hp:1000,

        atk:120,

        def:80,

        image:
            "./characters/superman/sprite.png"

    }

};


/* ==================================================
   ANIMATION NHÂN VẬT
================================================== */

class CharacterAnimation{


    constructor(){

        this.canvas =
            document.getElementById(
                "characterCanvas"
            );

        this.ctx =
            this.canvas.getContext(
                "2d"
            );


        this.image =
            new Image();


        this.image.onload =
            () => {

                this.draw();

            };


        this.image.src =
            characters.superman.image;


        this.frames = [

            {x:20,y:90,w:120,h:160},
            {x:150,y:90,w:125,h:160},
            {x:280,y:90,w:125,h:160},
            {x:410,y:90,w:125,h:160},

            {x:515,y:75,w:165,h:180},
            {x:660,y:75,w:165,h:180},
            {x:800,y:75,w:165,h:180},
            {x:940,y:75,w:190,h:190},

            {x:10,y:340,w:145,h:190},
            {x:135,y:335,w:145,h:190},
            {x:260,y:330,w:155,h:190},
            {x:385,y:335,w:150,h:195},

            {x:495,y:330,w:175,h:195},
            {x:640,y:325,w:180,h:200},
            {x:790,y:325,w:180,h:205},
            {x:940,y:320,w:200,h:210},

            {x:5,y:610,w:155,h:205},
            {x:140,y:605,w:155,h:205},
            {x:255,y:605,w:180,h:210},
            {x:390,y:600,w:160,h:220},

            {x:510,y:600,w:170,h:210},
            {x:650,y:590,w:190,h:220},
            {x:805,y:590,w:190,h:230},
            {x:945,y:585,w:190,h:240},

            {x:0,y:875,w:180,h:235},
            {x:120,y:865,w:220,h:245},
            {x:245,y:865,w:200,h:245},
            {x:360,y:855,w:210,h:260},
            {x:530,y:850,w:270,h:270},
            {x:740,y:845,w:390,h:290}

        ];


        this.idleFrames =
            [0,1,2,3];


        this.index =
            0;


        this.lastTime =
            performance.now();


        requestAnimationFrame(
            this.loop.bind(this)
        );

    }


    draw(){

        if(
            !this.image.complete
        ){

            return;

        }


        const frame =
            this.frames[
                this.idleFrames[
                    this.index
                ]
            ];


        const ctx =
            this.ctx;


        ctx.clearRect(
            0,
            0,
            this.canvas.width,
            this.canvas.height
        );


        const scale =
            Math.min(

                380 / frame.w,

                380 / frame.h

            );


        const width =
            frame.w * scale;


        const height =
            frame.h * scale;


        const x =
            (this.canvas.width -
                width) / 2;


        const y =
            (this.canvas.height -
                height) / 2;


        ctx.drawImage(

            this.image,

            frame.x,
            frame.y,
            frame.w,
            frame.h,

            x,
            y,
            width,
            height

        );

    }


    loop(time){

        if(
            time -
            this.lastTime
            >
            150
        ){

            this.index++;

            if(
                this.index >=
                this.idleFrames.length
            ){

                this.index=0;

            }


            this.lastTime =
                time;


            this.draw();

        }


        requestAnimationFrame(
            this.loop.bind(this)
        );

    }

}

function showScreen(
    screen
){

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "active"
                );

            }
        );


    screen.classList.add(
        "active"
    );

================================================== */

document
    .getElementById(
        "experienceButton"
    )
    .onclick =

        showScreen(
            document.getElementById(
                "homeScreen"
            )
        );

    };


/* ==================================================
   LẬP NHÓM
================================================== */

document
    .getElementById(
        "openTeam"
    )
    .onclick =
    function(){

        showScreen(
            document.getElementById(
                "lapnhomScreen"
            )
        );


        if(!animation){

        }

    };


/* ==================================================
   QUAY LẠI HOME
================================================== */

document
    .getElementById(
        "teamBack"
    )
    .onclick =
    function(){

        showScreen(
            document.getElementById(
                "homeScreen"
            )
        );

    };


/* ==================================================
   CHỌN Ô ĐỘI HÌNH
================================================== */

document
    .querySelectorAll(
        ".team-slot"
    )
    .forEach(

        function(slot){

            slot.onclick =
                function(){

                    selectedSlot =
                        Number(
                            slot.dataset.slot
                        );


                    document
                        .querySelectorAll(
                            ".team-slot"
                        )
                        .forEach(
                            function(s){

                                s.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    slot.classList.add(
                        "selected"
                    );

                };

        }

    );


/* ==================================================
   CHỌN NHÂN VẬT
================================================== */

document
    .querySelectorAll(
        ".character-card"
    )
    .forEach(

        function(card){

            card.onclick =
                function(){

                    const id =
                        card.dataset.character;


                    selectedCharacter =
                        characters[id];


                    document
                        .querySelectorAll(
                            ".character-card"
                        )
                        .forEach(
                            function(c){

                                c.classList.remove(
                                    "active"
                                );

                            }
                        );


                    card.classList.add(
                        "active"
                    );


                    updateCharacterInfo();

                };

        }

    );


/* ==================================================
   CẬP NHẬT THÔNG TIN
================================================== */

function updateCharacterInfo(){

    document
        .getElementById(
            "selectedName"
        )
        .textContent =
        selectedCharacter.name;


    document
        .getElementById(
            "infoLevel"
        )
        .textContent =
        "Lv." +
        selectedCharacter.level;


    document
        .getElementById(
            "infoHp"
        )
        .textContent =
        selectedCharacter.hp;


    document
        .getElementById(
            "infoAtk"
        )
        .textContent =
        selectedCharacter.atk;


    document
        .getElementById(
            "infoDef"
        )
        .textContent =
        selectedCharacter.def;

}


/* ==================================================
   TRANG BỊ
================================================== */

document
    .getElementById(
        "equipButton"
    )
    .onclick =
    function(){

        team[
            selectedSlot
        ] =
        selectedCharacter.id;


        renderTeam();

    };


/* ==================================================
   THÁO
================================================== */

document
    .getElementById(
        "removeButton"
    )
    .onclick =
    function(){

        team[
            selectedSlot
        ] =
        null;


        renderTeam();

    };


/* ==================================================
   VẼ ĐỘI HÌNH
================================================== */

function renderTeam(){

    const slots =
        document
            .querySelectorAll(
                ".team-slot"
            );


    slots.forEach(

        function(slot){

            const index =
                Number(
                    slot.dataset.slot
                );


            const id =
                team[index];


            const oldImage =
                slot.querySelector(
                    ".slot-image"
                );


            const oldName =
                slot.querySelector(
                    ".slot-name"
                );


            if(oldImage){

                oldImage.remove();

            }


            if(oldName){

                oldName.remove();

            }


            slot.classList.remove(
                "empty"
            );


            if(!id){

                slot.classList.add(
                    "empty"
                );

                return;

            }


            const char =
                characters[id];


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "slot-image";


            image.src =
                char.image;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "slot-name";


            name.textContent =
                char.name;


            slot.appendChild(
                image
            );


            slot.appendChild(
                name
            );

        }

    );

}


/* ==================================================
   NÚT KHÁC
================================================== */

document
    .querySelectorAll(
        ".game-button[data-route]"
    )
    .forEach(

        function(button){

            if(
                button.id ===
                "openTeam"
            ){

                return;

            }


            button.onclick =
                function(){

                    showScreen(
                        document.getElementById(
                            "errorScreen"
                        )
                    );


                    document
                        .getElementById(
                            "errorText"
                        )
                        .innerHTML =
                        "Trang <b>/" +
                        button.dataset.route +
                        "</b> chưa được tạo.";

                };

        }

    );

   404 BACK
================================================== */

document
    .getElementById(

    )
    .onclick =

        showScreen(
            document.getElementById(

            )
        );

    };


/* ==================================================
   START
================================================== */

updateCharacterInfo();

renderTeam();

</script>
