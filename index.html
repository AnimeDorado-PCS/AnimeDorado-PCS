<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>AnimeDorado</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================
   MÀN HÌNH
========================================= */

#home{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================
   ẢNH KHÔNG GIAN
========================================= */

#space{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:
        translate(-50%,-50%)
        scale(1.02);

    animation:
        spaceMove 14s
        ease-in-out
        infinite alternate;

    will-change:
        transform;

    user-select:none;
    -webkit-user-drag:none;
}

/* Chuyển động camera rất nhẹ */

@keyframes spaceMove{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1.02)
            translate3d(0,0,0);
    }

    50%{
        transform:
            translate(-49.5%,-50.5%)
            scale(1.07)
            translate3d(-8px,5px,0);
    }

    100%{
        transform:
            translate(-50%,-49.5%)
            scale(1.04)
            translate3d(8px,-5px,0);
    }

}

/* =========================================
   LỚP TỐI / ÁNH SÁNG
========================================= */

.dark{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(30,160,255,.05),
            rgba(0,0,0,.58)
        );

    pointer-events:none;
}

/* =========================================
   HÀO QUANG
========================================= */

.glow{
    position:absolute;

    left:50%;
    top:50%;

    width:45vw;
    height:45vw;

    min-width:280px;
    min-height:280px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(40,130,255,.10),
            transparent 68%
        );

    filter:blur(18px);

    animation:
        glowPulse 5s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes glowPulse{

    0%,100%{
        opacity:.5;
        transform:
            translate(-50%,-50%)
            scale(.95);
    }

    50%{
        opacity:.9;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}

/* =========================================
   SAO BAY
========================================= */

.stars{
    position:absolute;
    inset:0;

    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    background:white;

    border-radius:50%;

    opacity:.5;

    animation:
        starFloat
        linear
        infinite;
}

@keyframes starFloat{

    0%{
        transform:
            translate3d(0,20px,0)
            scale(.7);

        opacity:.15;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:
            translate3d(
                25px,
                -120px,
                0
            )
            scale(1.4);

        opacity:0;
    }

}

/* =========================================
   LOGO
========================================= */

.logo{
    position:absolute;

    left:50%;
    top:15%;

    transform:
        translateX(-50%);

    text-align:center;

    width:90%;

    animation:
        logoFloat 4s
        ease-in-out
        infinite alternate;
}

@keyframes logoFloat{

    from{
        transform:
            translateX(-50%)
            translateY(0);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-8px);
    }

}

.logo h1{

    font-size:
        clamp(
            38px,
            7vw,
            82px
        );

    font-weight:1000;

    letter-spacing:
        clamp(
            3px,
            .8vw,
            10px
        );

    color:#fff;

    text-shadow:
        0 0 8px #7d8cff,
        0 0 22px #5a50ff,
        0 0 45px rgba(70,110,255,.8);

}

.logo h2{

    margin-top:8px;

    font-size:
        clamp(
            14px,
            2.5vw,
            25px
        );

    letter-spacing:5px;

    color:#76d7ff;

    text-shadow:
        0 0 12px #00bfff;

}

/* =========================================
   NÚT CHƠI
========================================= */

.play-area{
    position:absolute;

    left:50%;
    bottom:14%;

    transform:
        translateX(-50%);

    text-align:center;

    width:100%;
}

.play-button{

    width:
        min(
            330px,
            72vw
        );

    height:
        min(
            80px,
            14vw
        );

    min-height:60px;

    border:2px solid #a984ff;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(101,42,255,.95),
            rgba(22,115,255,.95)
        );

    color:white;

    font-size:
        clamp(
            20px,
            4vw,
            34px
        );

    font-weight:900;

    letter-spacing:2px;

    box-shadow:
        0 0 12px #6e4cff,
        0 0 30px rgba(77,80,255,.7),
        inset 0 0 18px
        rgba(255,255,255,.15);

    cursor:pointer;

    animation:
        buttonPulse 2.2s
        ease-in-out
        infinite;

    transition:.2s;
}

@keyframes buttonPulse{

    0%,100%{
        box-shadow:
            0 0 12px #6e4cff,
            0 0 30px rgba(77,80,255,.55),
            inset 0 0 18px
            rgba(255,255,255,.15);
    }

    50%{
        box-shadow:
            0 0 20px #9f70ff,
            0 0 50px rgba(77,100,255,.9),
            inset 0 0 25px
            rgba(255,255,255,.2);
    }

}

.play-button:active{

    transform:
        scale(.95);

}

/* =========================================
   DÒNG PHỤ
========================================= */

.subtitle{

    margin-top:14px;

    color:#9fdfff;

    font-size:
        clamp(
            11px,
            2vw,
            15px
        );

    letter-spacing:3px;

    text-shadow:
        0 0 8px #008cff;

}

/* =========================================
   ICON GÓC
========================================= */

.corner{

    position:absolute;

    top:18px;

    width:53px;
    height:53px;

    border:
        1px solid
        rgba(120,180,255,.7);

    border-radius:14px;

    background:
        rgba(0,20,60,.45);

    color:white;

    font-size:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    backdrop-filter:
        blur(5px);

}

.left-icon{
    left:18px;
}

.right-icon{
    right:18px;
}

/* =========================================
   FOOTER
========================================= */

.footer{

    position:absolute;

    left:50%;
    bottom:3.5%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.45);

    font-size:10px;

    letter-spacing:2px;

    white-space:nowrap;

}

/* =========================================
   ĐIỆN THOẠI DỌC
========================================= */

@media(max-width:600px){

    .logo{
        top:12%;
    }

    .play-area{
        bottom:13%;
    }

}

/* =========================================
   MÀN HÌNH THẤP
========================================= */

@media(max-height:500px){

    .logo{
        top:7%;
    }

    .play-area{
        bottom:8%;
    }

    .footer{
        display:none;
    }

}
</style>
</head>

<body>

<div id="home">

    <!-- ẢNH SPACE.JPEG -->
    <img
        id="space"
        src="./space.jpeg"
        alt="Space">


    <!-- TỐI NỀN -->
    <div class="dark"></div>

    <!-- HÀO QUANG -->
    <div class="glow"></div>


    <!-- SAO -->
    <div
        class="stars"
        id="stars">
    </div>


    <!-- ICON -->
    <div class="corner left-icon">
        🔊
    </div>

    <div class="corner right-icon">
        ⚙️
    </div>


    <!-- LOGO -->
    <div class="logo">

        <h1>
            ANIME DORADO
        </h1>

        <h2>
            ANIME ADVENTURE
        </h2>

    </div>


    <!-- CHƠI -->
    <div class="play-area">

        <button
            class="play-button"
            onclick="playGame()">

            ★ &nbsp; CHƠI THỬ &nbsp; ★

        </button>

        <div class="subtitle">
            BẮT ĐẦU HÀNH TRÌNH CỦA BẠN
        </div>

    </div>


    <div class="footer">
        ANIME DORADO © 2026
    </div>

</div>


<script>

/* =========================================
   TẠO SAO NGẪU NHIÊN
========================================= */

const stars =
    document.getElementById(
        "stars"
    );


for(
    let i = 0;
    i < 55;
    i++
){

    const star =
        document.createElement(
            "div"
        );

    star.className =
        "star";


    star.style.left =
        Math.random() * 100 +
        "%";


    star.style.top =
        Math.random() * 100 +
        "%";


    const size =
        Math.random() * 2 + 1;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";


    star.style.animationDuration =
        (4 + Math.random() * 8) +
        "s";


    star.style.animationDelay =
        (-Math.random() * 8) +
        "s";


    stars.appendChild(
        star
    );
}


/* =========================================
   NÚT CHƠI
========================================= */

function playGame(){

    const home =
        document.getElementById(
            "home"
        );


    home.style.transition =
        "opacity .6s ease";


    home.style.opacity =
        "0";


    setTimeout(
        function(){

            window.location.href =
                "./giaodien.html";

        },
        600
    );

}


/* =========================================
   KIỂM TRA ẢNH
========================================= */

document
    .getElementById("space")
    .addEventListener(
        "error",
        function(){

            document.body.innerHTML = `

                <div style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#05070d;
                    color:white;
                    text-align:center;
                    padding:30px;
                    font-family:Arial;
                ">

                    <div>

                        <h2>
                            Không tìm thấy space.jpeg
                        </h2>

                        <p style="
                            margin-top:12px;
                            color:#999;
                        ">

                            Hãy upload file
                            <b>space.jpeg</b>
                            vào cùng thư mục với
                            <b>index.html</b>.

                        </p>

                    </div>

                </div>

            `;

        }
    );

</script>

</body>
</html>
