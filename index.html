<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}


/* ==================================================
   APP
================================================== */

#app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* ==================================================
   EXPERIENCE
================================================== */

#experience{
    position:absolute;
    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#000;
}

.experience-bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;

    display:block;

    user-select:none;

    -webkit-user-drag:none;
}

.experience-overlay{
    position:absolute;
    inset:0;
    z-index:1;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.06),
            rgba(0,0,0,.20)
        );
}

.experience-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:min(700px,100vw);
    height:min(500px,75vh);

    transform:translate(-50%,-50%);

    z-index:2;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,220,110,.18) 0%,
            rgba(255,220,110,.06) 36%,
            transparent 70%
        );

    filter:blur(12px);

    pointer-events:none;
}

.experience-content{
    position:relative;

    z-index:5;

    width:min(700px,92vw);

    padding:20px;

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.game-logo{
    text-align:center;

    filter:
        drop-shadow(
            0 8px 18px
            rgba(0,0,0,.65)
        );
}

.logo-small{
    color:#fff;

    font-size:
        clamp(
            14px,
            3vw,
            19px
        );

    letter-spacing:
        clamp(
            4px,
            1vw,
            8px
        );

    font-weight:800;
}

.logo-main{
    margin-top:-4px;

    color:#ffd65a;

    font-size:
        clamp(
            52px,
            12vw,
            92px
        );

    line-height:.95;

    font-weight:1000;

    letter-spacing:
        clamp(
            2px,
            1vw,
            6px
        );

    text-shadow:
        0 3px 0 #8f5e0c,
        0 7px 12px rgba(0,0,0,.7);
}

.logo-line{
    width:min(280px,60vw);
    height:2px;

    margin:13px auto 9px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ffd65a,
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(255,214,90,.55);
}

.logo-sub{
    color:rgba(255,255,255,.82);

    font-size:
        clamp(
            8px,
            2vw,
            11px
        );

    letter-spacing:3px;

    font-weight:bold;
}

.welcome-text{
    margin-top:27px;

    color:rgba(255,255,255,.9);

    font-size:
        clamp(
            10px,
            2.5vw,
            14px
        );

    letter-spacing:3px;

    font-weight:bold;

    text-shadow:
        0 2px 6px #000;
}

.experience-button{
    position:relative;

    margin-top:18px;

    width:min(340px,82vw);

    height:68px;

    border:
        2px solid
        rgba(255,245,190,.85);

    border-radius:18px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #8a5808,
            #ffd65a 50%,
            #b77809
        );

    color:#211505;

    font-size:
        clamp(
            15px,
            3.8vw,
            19px
        );

    font-weight:1000;

    cursor:pointer;

    box-shadow:
        0 8px 24px rgba(0,0,0,.4),
        0 0 28px rgba(255,214,90,.18),
        inset 0 2px 0 rgba(255,255,255,.55);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.experience-button:active{
    transform:scale(.97);
}

.button-light{
    position:absolute;
    top:0;
    left:-35%;

    width:35%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        buttonShine 2.8s infinite;

    pointer-events:none;
}

@keyframes buttonShine{

    0%{
        left:-40%;
    }

    45%{
        left:120%;
    }

    100%{
        left:120%;
    }

}

.button-text{
    position:relative;
    z-index:2;
}

.button-arrow{
    position:absolute;
    right:20px;
    top:50%;

    transform:translateY(-50%);

    font-size:24px;

    z-index:3;
}

.version{
    margin-top:15px;

    color:rgba(255,255,255,.55);

    font-size:9px;

    letter-spacing:2px;

    text-shadow:0 2px 5px #000;
}


/* ==================================================
   HOME
================================================== */

#home{
    position:absolute;
    inset:0;

    display:none;

    background:#000;
}

#gameFrame{
    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;
}

#homeBackground{
    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    display:block;

    object-fit:fill;

    user-select:none;
    -webkit-user-drag:none;
}


/* ==================================================
   NÚT ẨN HOME
================================================== */

.game-button{
    position:absolute;

    border:0;

    background:transparent;

    outline:none;

    cursor:pointer;
}


/* Hồ sơ */

.btn-profile{
    left:18px;
    top:15px;

    width:430px;
    height:130px;
}


/* Vàng */

.btn-gold{
    left:565px;
    top:8px;

    width:285px;
    height:75px;
}


/* Ruby */

.btn-ruby{
    left:875px;
    top:8px;

    width:275px;
    height:75px;
}


/* Lập nhóm */

.btn-lapnhom{
    left:35px;
    bottom:8px;

    width:145px;
    height:125px;
}


/* Nâng cấp */

.btn-nangcap{
    left:245px;
    bottom:8px;

    width:145px;
    height:125px;
}


/* Rút nhân vật */

.btn-rutnhanvat{
    left:450px;
    bottom:8px;

    width:160px;
    height:125px;
}


/* Cửa hàng */

.btn-cuahang{
    left:650px;
    bottom:8px;

    width:160px;
    height:125px;
}


/* Bắt đầu */

.btn-batdau{
    right:0;
    bottom:0;

    width:430px;
    height:175px;

    border-radius:
        55px 0 0 0;
}


/* ==================================================
   MOBILE
================================================== */

@media(
    max-width:600px
){

    .experience-content{
        padding:14px;
    }

    .logo-main{
        font-size:
            clamp(
                48px,
                16vw,
                76px
            );
    }

    .experience-button{
        width:min(
            310px,
            84vw
        );

        height:62px;
    }

}

@media(
    max-height:520px
) and (
    orientation:landscape
){

    .logo-main{
        font-size:54px;
    }

    .welcome-text{
        margin-top:12px;
    }

    .experience-button{
        margin-top:10px;
        height:55px;
    }

}

</style>

</head>


<body>

<div id="app">


<!-- ==================================================
     MỞ TRẢI NGHIỆM
================================================== -->

<section id="experience">

    <img
        class="experience-bg"
        src="./space.jpeg"
        alt="ANIME DORADO">

    <div class="experience-overlay"></div>

    <div class="experience-glow"></div>


    <div class="experience-content">

        <div class="game-logo">

            <div class="logo-small">
                ANIME
            </div>

            <div class="logo-main">
                DORADO
            </div>

            <div class="logo-line"></div>

            <div class="logo-sub">
                ADVENTURE • FANTASY • BATTLE
            </div>

        </div>


        <div class="welcome-text">
            CHÀO MỪNG ĐẾN VỚI
        </div>


        <button
            id="experienceButton"
            class="experience-button">

            <span class="button-light"></span>

            <span class="button-text">
                MỞ TRẢI NGHIỆM
            </span>

            <span class="button-arrow">
                →
            </span>

        </button>


        <div class="version">
            ANIME DORADO
        </div>

    </div>

</section>



<!-- ==================================================
     HOME
================================================== -->

<section id="home">

    <div id="gameFrame">

        <img
            id="homeBackground"
            src="./nengame.png"
            alt="ANIME DORADO">


        <!-- Hồ sơ -->

        <button
            class="game-button btn-profile"
            onclick="goToPage('profile')">
        </button>


        <!-- Vàng -->

        <button
            class="game-button btn-gold"
            onclick="goToPage('gold')">
        </button>


        <!-- Ruby -->

        <button
            class="game-button btn-ruby"
            onclick="goToPage('ruby')">
        </button>


        <!-- Lập nhóm -->

        <button
            class="game-button btn-lapnhom"
            onclick="goToPage('lapnhom')">
        </button>


        <!-- Nâng cấp -->

        <button
            class="game-button btn-nangcap"
            onclick="goToPage('nangcap')">
        </button>


        <!-- Rút nhân vật -->

        <button
            class="game-button btn-rutnhanvat"
            onclick="goToPage('rutnhanvat')">
        </button>


        <!-- Cửa hàng -->

        <button
            class="game-button btn-cuahang"
            onclick="goToPage('cuahang')">
        </button>


        <!-- Bắt đầu -->

        <button
            class="game-button btn-batdau"
            onclick="goToPage('batdau')">
        </button>


    </div>

</section>


</div>


<script>

/* ==================================================
   MỞ GIAO DIỆN
================================================== */

document
    .getElementById(
        "experienceButton"
    )
    .addEventListener(
        "click",
        function(){

            document
                .getElementById(
                    "experience"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "home"
                )
                .style.display =
                "block";


            scaleGame();

        }
    );


/* ==================================================
   ĐƯỜNG DẪN CÁC FILE
================================================== */

const pageFiles = {

    profile:
        "profile.html",

    gold:
        "gold.html",

    ruby:
        "ruby.html",

    lapnhom:
        "lapnhom.html",

    nangcap:
        "nangcap.html",

    rutnhanvat:
        "rutnhanvat.html",

    cuahang:
        "cuahang.html",

    batdau:
        "batdau.html"

};


/* ==================================================
   CHUYỂN TRANG
   Không hiện 404.
   Không kiểm tra file.
   Chỉ đi thẳng tới file.
================================================== */

function goToPage(
    page
){

    const file =
        pageFiles[page];


    if(!file){

        return;

    }


    /*
       Dùng pushState để URL đổi trước,
       sau đó chuyển tới file thật.
    */

    window.location.href =
        file;

}


/* ==================================================
   SCALE HOME
================================================== */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    /*
       MÀN HÌNH NGANG
    */

    if(
        width >= height
    ){

        const scale =
            Math.min(
                width / 1536,
                height / 864
            );


        frame.style.transform =
            "translate(-50%,-50%) " +
            "scale(" +
            scale +
            ")";

        return;

    }


    /*
       MÀN HÌNH DỌC:
       vẫn giữ khung game ngang.
    */

    const scale =
        Math.min(
            width / 864,
            height / 1536
        );


    frame.style.transform =
        "translate(-50%,-50%) " +
        "rotate(90deg) " +
        "scale(" +
        scale +
        ")";

}


window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            250
        );

    }
);

</script>

</body>

</html>
