<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>AnimeDorado - Đăng nhập</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b12;
    color:white;
}

body{
    min-height:100vh;
    overflow:auto;
}

/* =========================
   NỀN
========================= */

#background{
    position:fixed;
    inset:0;
    z-index:0;

    background:
        radial-gradient(
            circle at center,
            #25344d 0%,
            #111827 45%,
            #05070b 100%
        );
}

#background::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,190,70,.18),
            transparent 35%
        );
}

/* =========================
   CONTAINER
========================= */

.page{
    position:relative;
    z-index:1;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

/* =========================
   LOGIN BOX
========================= */

.box{
    width:100%;
    max-width:430px;

    padding:32px 25px 28px;

    background:
        linear-gradient(
            145deg,
            rgba(24,32,48,.96),
            rgba(7,10,17,.97)
        );

    border:1px solid rgba(255,210,100,.28);

    border-radius:18px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.05);
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:38px;
    letter-spacing:3px;

    color:#ffd66b;

    text-shadow:
        0 0 10px rgba(255,193,55,.5),
        0 3px 10px #000;
}

.logo p{
    margin-top:6px;

    color:#aeb8c9;

    font-size:13px;
    letter-spacing:2px;
}

/* =========================
   TITLE
========================= */

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h2{
    font-size:24px;
}

.title p{
    color:#8d98aa;
    font-size:13px;
    margin-top:6px;
}

/* =========================
   INPUT
========================= */

.field{
    margin-bottom:15px;
}

.field label{
    display:block;

    font-size:13px;
    color:#c5ccd8;

    margin-bottom:7px;
}

.field input{
    width:100%;
    height:50px;

    border-radius:10px;

    border:1px solid #303b4d;

    outline:none;

    padding:0 14px;

    color:white;
    background:#111722;

    font-size:15px;

    transition:.2s;
}

.field input:focus{
    border-color:#e3ad3c;

    box-shadow:
        0 0 0 2px
        rgba(227,173,60,.12);
}

.field input::placeholder{
    color:#657084;
}

/* =========================
   BUTTON
========================= */

.main-button{
    width:100%;
    height:52px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            180deg,
            #ffd96d,
            #c88c20
        );

    color:#181108;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 20px rgba(214,155,42,.25);

    transition:.15s;
}

.main-button:active{
    transform:scale(.98);
}

.main-button:disabled{
    opacity:.55;
}

/* =========================
   SWITCH
========================= */

.switch{
    text-align:center;

    margin-top:18px;

    font-size:13px;

    color:#8994a6;
}

.switch button{
    border:0;
    background:none;

    color:#ffd15a;

    font-weight:bold;

    cursor:pointer;

    font-size:13px;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:8px;

    font-size:13px;

    text-align:center;
}

.message.error{
    display:block;

    color:#ffb5b5;

    background:rgba(160,30,30,.18);

    border:1px solid rgba(255,80,80,.2);
}

.message.success{
    display:block;

    color:#b8ffc9;

    background:rgba(30,150,70,.15);

    border:1px solid rgba(80,255,120,.2);
}

/* =========================
   LOADING
========================= */

.loading{
    display:none;
    text-align:center;

    margin-top:12px;

    color:#9ba7ba;
    font-size:12px;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:22px;

    color:#596476;

    font-size:11px;
}
</style>
</head>

<body>

<div id="background"></div>

<div class="page">

    <div class="box">

        <!-- LOGO -->

        <div class="logo">
            <h1>ANIMEDORADO</h1>
            <p>ANIME ADVENTURE</p>
        </div>


        <!-- TITLE -->

        <div class="title">

            <h2 id="formTitle">
                Đăng nhập
            </h2>

            <p id="formSubtitle">
                Chào mừng bạn trở lại
            </p>

        </div>


        <!-- THÔNG BÁO -->

        <div
            id="message"
            class="message">
        </div>


        <!-- FORM -->

        <form id="authForm">

            <!-- EMAIL -->

            <div class="field">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Nhập email của bạn"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label>
                    Mật khẩu
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Nhập mật khẩu"
                    minlength="6"
                    required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div
                class="field"
                id="confirmField"
                style="display:none;">

                <label>
                    Nhập lại mật khẩu
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Nhập lại mật khẩu"
                    minlength="6">

            </div>


            <!-- BUTTON -->

            <button
                id="submitButton"
                class="main-button"
                type="submit">

                ĐĂNG NHẬP

            </button>

        </form>


        <!-- SWITCH -->

        <div class="switch">

            <span id="switchText">
                Chưa có tài khoản?
            </span>

            <button
                id="switchButton"
                type="button">

                Đăng ký

            </button>

        </div>


        <div
            id="loading"
            class="loading">

            Đang xử lý...

        </div>


        <div class="footer">

            AnimeDorado © 2026

        </div>

    </div>

</div>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://mhgxcwplgadwkvcejgjj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bukAPz_IlAB5tEVLT1SWUA_7GLDTw-A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const authForm =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const confirmField =
    document.getElementById("confirmField");

const submitButton =
    document.getElementById("submitButton");

const switchButton =
    document.getElementById("switchButton");

const switchText =
    document.getElementById("switchText");

const formTitle =
    document.getElementById("formTitle");

const formSubtitle =
    document.getElementById("formSubtitle");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");


/* =========================================
   MODE
========================================= */

let registerMode = false;


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type = "error"
){

    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage(){

    message.textContent = "";

    message.className =
        "message";

}


/* =========================================
   REGISTER / LOGIN SWITCH
========================================= */

switchButton.addEventListener(
    "click",
    function(){

        registerMode =
            !registerMode;

        clearMessage();

        if(registerMode){

            formTitle.textContent =
                "Đăng ký";

            formSubtitle.textContent =
                "Tạo tài khoản AnimeDorado";

            confirmField.style.display =
                "block";

            confirmPasswordInput.required =
                true;

            submitButton.textContent =
                "TẠO TÀI KHOẢN";

            switchText.textContent =
                "Đã có tài khoản?";

            switchButton.textContent =
                "Đăng nhập";

        }else{

            formTitle.textContent =
                "Đăng nhập";

            formSubtitle.textContent =
                "Chào mừng bạn trở lại";

            confirmField.style.display =
                "none";

            confirmPasswordInput.required =
                false;

            submitButton.textContent =
                "ĐĂNG NHẬP";

            switchText.textContent =
                "Chưa có tài khoản?";

            switchButton.textContent =
                "Đăng ký";

        }

    }
);


/* =========================================
   LOADING
========================================= */

function setLoading(state){

    submitButton.disabled =
        state;

    loading.style.display =
        state ? "block" : "none";

}


/* =========================================
   REGISTER
========================================= */

async function register(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    if(password.length < 6){

        showMessage(
            "Mật khẩu phải có ít nhất 6 ký tự."
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Mật khẩu nhập lại không giống nhau."
        );

        return;

    }


    setLoading(true);
    clearMessage();


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signUp({

                email: email,

                password: password

            });


        if(error){

            throw error;

        }


        /*
          Nếu Supabase đang bật xác nhận email,
          data.session sẽ chưa có.
        */

        if(!data.session){

            showMessage(
                "Đăng ký thành công! Hãy kiểm tra email để xác nhận tài khoản.",
                "success"
            );

        }else{

            showMessage(
                "Đăng ký thành công! Đang vào game...",
                "success"
            );

            setTimeout(
                goToGame,
                700
            );

        }

    }catch(error){

        showMessage(
            getVietnameseError(
                error
            )
        );

    }finally{

        setLoading(false);

    }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    setLoading(true);
    clearMessage();


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if(error){

            throw error;

        }


        showMessage(
            "Đăng nhập thành công! Đang vào game...",
            "success"
        );


        /*
           Lưu email để giaodien.html
           có thể sử dụng sau này.
        */

        localStorage.setItem(
            "eldoradoPlayerEmail",
            email
        );


        setTimeout(
            goToGame,
            500
        );


    }catch(error){

        showMessage(
            getVietnameseError(
                error
            )
        );

    }finally{

        setLoading(false);

    }

}


/* =========================================
   FORM SUBMIT
========================================= */

authForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(registerMode){

            await register();

        }else{

            await login();

        }

    }
);


/* =========================================
   VÀO GAME
========================================= */

function goToGame(){

    /*
      giaodien.html phải nằm cùng thư mục
      với index.html.
    */

    window.location.href =
        "./giaodien.html";

}


/* =========================================
   KIỂM TRA ĐÃ ĐĂNG NHẬP
========================================= */

async function checkExistingSession(){

    try{

        const {
            data
        } =
        await supabaseClient.auth
            .getSession();


        if(
            data &&
            data.session
        ){

            /*
              Nếu đã đăng nhập từ trước,
              tự động vào game.
            */

            window.location.href =
                "./giaodien.html";

        }

    }catch(error){

        console.log(
            "Session check:",
            error
        );

    }

}


checkExistingSession();


/* =========================================
   DỊCH LỖI
========================================= */

function getVietnameseError(error){

    const msg =
        (
            error &&
            error.message
        ) ?
        error.message.toLowerCase()
        :
        "";


    if(
        msg.includes(
            "invalid login credentials"
        )
    ){

        return "Email hoặc mật khẩu không đúng.";

    }


    if(
        msg.includes(
            "email not confirmed"
        )
    ){

        return "Email chưa được xác nhận. Hãy kiểm tra hộp thư.";

    }


    if(
        msg.includes(
            "user already registered"
        )
    ){

        return "Email này đã được đăng ký.";

    }


    if(
        msg.includes(
            "password should be at least"
        )
    ){

        return "Mật khẩu phải có ít nhất 6 ký tự.";

    }


    if(
        msg.includes(
            "unable to validate email"
        )
    ){

        return "Email không hợp lệ.";

    }


    if(
        msg.includes(
            "rate limit"
        )
    ){

        return "Bạn thao tác quá nhiều lần. Hãy chờ một chút rồi thử lại.";

    }


    if(
        msg.includes(
            "network"
        )
    ){

        return "Không thể kết nối máy chủ. Kiểm tra Internet.";

    }


    return (
        error &&
        error.message
    ) ||
    "Có lỗi xảy ra. Hãy thử lại.";

}

</script>

</body>
</html>
