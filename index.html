<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

button{
    font:inherit;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

.screen.active{
    display:block;
}


/* ==================================================
   MỞ TRẢI NGHIỆM
================================================== */

#landingScreen{

    background:
        radial-gradient(
            circle at center,
            #294268 0%,
            #101827 55%,
            #020408 100%
        );

}

.landing-box{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(
        560px,
        90vw
    );

    padding:34px;

    text-align:center;

    border:
        1px solid
        rgba(255,214,90,.35);

    border-radius:24px;

    background:
        rgba(0,0,0,.45);

}

.landing-title{

    font-size:42px;

    font-weight:900;

    color:#ffd65a;

}

.landing-text{

    margin-top:10px;

    color:#c8cedb;

    line-height:1.5;

}

.experience-button{

    margin-top:25px;

    min-width:240px;

    min-height:58px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:900;

}


/* ==================================================
   HOME
================================================== */

#homeScreen{

    background:#000;

}

.game-frame{

    position:absolute;

    left:50%;
    top:50%;

    width:1536px;
    height:864px;

    transform:
        translate(-50%,-50%)
        scale(1);

    transform-origin:center center;

}

#gameBackground{

    position:absolute;

    left:0;
    top:0;

    width:1536px;
    height:864px;

    object-fit:fill;

    display:block;

    user-select:none;

    -webkit-user-drag:none;

}


/* ==================================================
   NÚT ẨN
================================================== */

.button-layer{

    position:absolute;

    inset:0;

    pointer-events:none;

}

.game-button{

    position:absolute;

    border:none;

    background:transparent;

    cursor:pointer;

    pointer-events:auto;

}


/* Hồ sơ */

.btn-profile{

    left:18px;
    top:15px;

    width:430px;
    height:130px;

}


/* Vàng */

.btn-gold{

    left:565px;
    top:8px;

    width:285px;
    height:75px;

}


/* Ruby */

.btn-ruby{

    left:875px;
    top:8px;

    width:275px;
    height:75px;

}


/* Lập nhóm */

.btn-lapnhom{

    left:35px;
    bottom:8px;

    width:145px;
    height:125px;

}


/* Nâng cấp */

.btn-nangcap{

    left:245px;
    bottom:8px;

    width:145px;
    height:125px;

}


/* Rút nhân vật */

.btn-rutnhanvat{

    left:450px;
    bottom:8px;

    width:160px;
    height:125px;

}


/* Cửa hàng */

.btn-cuahang{

    left:650px;
    bottom:8px;

    width:160px;
    height:125px;

}


/* Bắt đầu */

.btn-batdau{

    right:0;
    bottom:0;

    width:430px;
    height:175px;

    border-radius:
        55px 0 0 0;

}


/* ==================================================
   LẬP NHÓM
================================================== */

#lapnhomScreen{

    background:
        radial-gradient(
            circle at center,
            #243a5e 0%,
            #0d1320 58%,
            #020305 100%
        );

    overflow:auto;

}

.team{

    width:min(
        960px,
        94vw
    );

    min-height:100%;

    margin:auto;

    padding:
        20px
        0
        30px;

}

.team-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.team-title{

    font-size:28px;

    font-weight:900;

    color:#ffd65a;

}

.back-button{

    border:none;

    border-radius:11px;

    padding:
        11px
        15px;

    background:#202a3a;

    color:white;

    font-weight:bold;

}

.team-grid{

    display:grid;

    grid-template-columns:
        minmax(300px,420px)
        1fr;

    gap:18px;

    margin-top:18px;

}

.card{

    border:
        1px solid
        rgba(255,214,90,.22);

    border-radius:20px;

    background:
        rgba(0,0,0,.35);

}

.character-card{

    padding:12px;

}

.character-name{

    text-align:center;

    font-size:23px;

    font-weight:900;

}

.character-rarity{

    text-align:center;

    color:#ffd65a;

    margin-top:4px;

}

#characterCanvas{

    display:block;

    width:100%;

    max-width:420px;

    height:auto;

    margin:auto;

}

.skill-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;

}

.skill-button{

    min-height:46px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #5a3707,
            #c88915
        );

    color:white;

    font-weight:900;

}

.info-card{

    padding:18px;

}

.info-card h2{

    color:#ffd65a;

    margin-bottom:12px;

}

.stat{

    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    color:#ccd2df;

}

.stat b{

    color:white;

}


/* ==================================================
   404
================================================== */

#errorScreen{

    background:
        radial-gradient(
            circle at center,
            #263b5c 0%,
            #101827 55%,
            #020408 100%
        );

}

.error-box{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(
        520px,
        88vw
    );

    padding:30px;

    text-align:center;

    border:
        1px solid
        rgba(255,215,100,.35);

    border-radius:20px;

    background:
        rgba(0,0,0,.45);

}

.error-box h1{

    font-size:58px;

    color:#ffd65a;

}

.error-box p{

    margin-top:10px;

    color:#bbc4d2;

    line-height:1.5;

}

.error-box button{

    margin-top:20px;

    min-width:180px;

    min-height:48px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #b8790a,
            #ffd65a
        );

    color:#1b1304;

    font-weight:bold;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:760px){

    .landing-title{

        font-size:32px;

    }

    .team-grid{

        grid-template-columns:1fr;

    }

}

</style>
</head>


<body>


<!-- ==================================================
     MỞ TRẢI NGHIỆM
================================================== -->

<section
    id="landingScreen"
    class="screen active">

    <div class="landing-box">

        <div class="landing-title">
            ANIME DORADO
        </div>

        <div class="landing-text">

            Game web • nhân vật • lập nhóm • chiến đấu

        </div>

        <button
            class="experience-button"
            id="experienceButton">

            MỞ TRẢI NGHIỆM

        </button>

    </div>

</section>


<!-- ==================================================
     HOME
================================================== -->

<section
    id="homeScreen"
    class="screen">


    <div
        id="gameFrame"
        class="game-frame">


        <img
            id="gameBackground"
            src="./nengame.png"
            alt="ANIME DORADO">


        <div class="button-layer">


            <button
                class="game-button btn-profile"
                data-route="profile">
            </button>


            <button
                class="game-button btn-gold"
                data-route="gold">
            </button>


            <button
                class="game-button btn-ruby"
                data-route="ruby">
            </button>


            <button
                class="game-button btn-lapnhom"
                data-route="lapnhom">
            </button>


            <button
                class="game-button btn-nangcap"
                data-route="nangcap">
            </button>


            <button
                class="game-button btn-rutnhanvat"
                data-route="rutnhanvat">
            </button>


            <button
                class="game-button btn-cuahang"
                data-route="cuahang">
            </button>


            <button
                class="game-button btn-batdau"
                data-route="batdau">
            </button>


        </div>

    </div>

</section>


<!-- ==================================================
     LẬP NHÓM
================================================== -->

<section
    id="lapnhomScreen"
    class="screen">


    <div class="team">


        <div class="team-top">

            <div class="team-title">
                LẬP NHÓM
            </div>


            <button
                class="back-button"
                id="backHome">

                ← QUAY LẠI

            </button>

        </div>


        <div class="team-grid">


            <!-- NHÂN VẬT -->

            <div>


                <div
                    class="card character-card">


                    <div class="character-name">
                        Superman
                    </div>


                    <div
                        class="character-rarity">

                        SSR • Lv.1

                    </div>


                    <canvas
                        id="characterCanvas"
                        width="420"
                        height="420">
                    </canvas>


                    <div class="skill-grid">


                        <button
                            class="skill-button"
                            data-animation="idle">

                            IDLE

                        </button>


                        <button
                            class="skill-button"
                            data-animation="run">

                            CHẠY

                        </button>


                        <button
                            class="skill-button"
                            data-animation="attack">

                            ĐÁNH THƯỜNG

                        </button>


                        <button
                            class="skill-button"
                            data-animation="skill1">

                            SKILL 1

                        </button>


                        <button
                            class="skill-button"
                            data-animation="skill2">

                            SKILL 2

                        </button>


                        <button
                            class="skill-button"
                            data-animation="skill3">

                            SKILL 3

                        </button>


                    </div>


                </div>


            </div>


            <!-- THÔNG TIN -->

            <div
                class="card info-card">


                <h2>
                    THÔNG TIN NHÂN VẬT
                </h2>


                <div class="stat">

                    <span>HP</span>

                    <b>1000</b>

                </div>


                <div class="stat">

                    <span>ATK</span>

                    <b>120</b>

                </div>


                <div class="stat">

                    <span>DEF</span>

                    <b>80</b>

                </div>


                <div class="stat">

                    <span>Tốc độ đánh</span>

                    <b>1.2s</b>

                </div>


                <div
                    style="
                        margin-top:20px;
                        color:#c8cedb;
                        line-height:1.5;
                    ">

                    Superman đã có trong đội.
                    <br>
                    Bạn có thể thử toàn bộ animation
                    bằng các nút bên trái.

                </div>


            </div>


        </div>


    </div>


</section>


<!-- ==================================================
     404
================================================== -->

<section
    id="errorScreen"
    class="screen">


    <div class="error-box">


        <h1>
            404
        </h1>


        <p
            id="errorText">
        </p>


        <button
            id="errorBack">

            ← QUAY LẠI

        </button>


    </div>


</section>


<script>

/* ==================================================
   NHÂN VẬT
================================================== */

const superman = {

    image:
        "./characters/superman/sprite.png",

    fps:10

};


/* ==================================================
   ANIMATION
================================================== */

class Character {


    constructor(){

        this.canvas =
            document.getElementById(
                "characterCanvas"
            );

        this.ctx =
            this.canvas.getContext(
                "2d"
            );


        this.image =
            new Image();


        this.image.src =
            superman.image;


        /*
           30 frame:

           01-04 IDLE
           05-08 RUN
           17-20 ATTACK
           21-24 SKILL 1
           25-28 SKILL 2
           29-30 SKILL 3
        */

        this.animations = {

            idle:{
                frames:[0,1,2,3],
                loop:true
            },

            run:{
                frames:[4,5,6,7],
                loop:true
            },

            attack:{
                frames:[16,17,18,19],
                loop:false
            },

            skill1:{
                frames:[20,21,22,23],
                loop:false
            },

            skill2:{
                frames:[24,25,26,27],
                loop:false
            },

            skill3:{
                frames:[28,29],
                loop:false
            }

        };


        /*
           Vùng 30 frame
           theo ảnh bạn gửi
        */

        this.frames = [

            {x:20,y:90,w:120,h:160},
            {x:150,y:90,w:125,h:160},
            {x:280,y:90,w:125,h:160},
            {x:410,y:90,w:125,h:160},

            {x:515,y:75,w:165,h:180},
            {x:660,y:75,w:165,h:180},
            {x:800,y:75,w:165,h:180},
            {x:940,y:75,w:190,h:190},

            {x:10,y:340,w:145,h:190},
            {x:135,y:335,w:145,h:190},
            {x:260,y:330,w:155,h:190},
            {x:385,y:335,w:150,h:195},

            {x:495,y:330,w:175,h:195},
            {x:640,y:325,w:180,h:200},
            {x:790,y:325,w:180,h:205},
            {x:940,y:320,w:200,h:210},

            {x:5,y:610,w:155,h:205},
            {x:140,y:605,w:155,h:205},
            {x:255,y:605,w:180,h:210},
            {x:390,y:600,w:160,h:220},

            {x:510,y:600,w:170,h:210},
            {x:650,y:590,w:190,h:220},
            {x:805,y:590,w:190,h:230},
            {x:945,y:585,w:190,h:240},

            {x:0,y:875,w:180,h:235},
            {x:120,y:865,w:220,h:245},
            {x:245,y:865,w:200,h:245},
            {x:360,y:855,w:210,h:260},
            {x:530,y:850,w:270,h:270},
            {x:740,y:845,w:390,h:290}

        ];


        this.animation =
            "idle";


        this.frameIndex =
            0;


        this.lastTime =
            performance.now();


        this.running =
            true;


        this.image.onload =
            () => {

                this.draw();

            };


        requestAnimationFrame(
            this.loop.bind(this)
        );

    }


    play(name){

        if(
            !this.animations[name]
        ){

            return;

        }


        this.animation =
            name;


        this.frameIndex =
            0;


        this.running =
            true;


        this.lastTime =
            performance.now();


        this.draw();

    }


    draw(){

        if(
            !this.image.complete
        ){

            return;

        }


        const animation =
            this.animations[
                this.animation
            ];


        const number =
            animation.frames[
                this.frameIndex
            ];


        const frame =
            this.frames[number];


        if(!frame){

            return;

        }


        const ctx =
            this.ctx;


        ctx.clearRect(
            0,
            0,
            this.canvas.width,
            this.canvas.height
        );


        const padding =
            10;


        const scale =
            Math.min(

                (this.canvas.width -
                    padding * 2)
                    / frame.w,

                (this.canvas.height -
                    padding * 2)
                    / frame.h

            );


        const width =
            frame.w * scale;


        const height =
            frame.h * scale;


        const x =
            (this.canvas.width -
                width) / 2;


        const y =
            (this.canvas.height -
                height) / 2;


        ctx.drawImage(

            this.image,

            frame.x,
            frame.y,
            frame.w,
            frame.h,

            x,
            y,
            width,
            height

        );

    }


    loop(time){

        if(
            this.running
        ){

            const animation =
                this.animations[
                    this.animation
                ];


            const delay =
                1000 /
                superman.fps;


            if(
                time -
                this.lastTime
                >=
                delay
            ){

                this.frameIndex++;


                this.lastTime =
                    time;


                if(
                    this.frameIndex
                    >=
                    animation.frames.length
                ){

                    if(
                        animation.loop
                    ){

                        this.frameIndex =
                            0;

                    }
                    else{

                        this.frameIndex =
                            animation.frames.length - 1;


                        this.running =
                            false;


                        setTimeout(

                            () => {

                                this.play(
                                    "idle"
                                );

                            },

                            100

                        );

                    }

                }


                this.draw();

            }

        }


        requestAnimationFrame(
            this.loop.bind(this)
        );

    }

}


/* ==================================================
   MÀN HÌNH
================================================== */

const landingScreen =
    document.getElementById(
        "landingScreen"
    );


const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const lapnhomScreen =
    document.getElementById(
        "lapnhomScreen"
    );


const errorScreen =
    document.getElementById(
        "errorScreen"
    );


let character =
    null;


/* ==================================================
   HIỆN MÀN HÌNH
================================================== */

function showScreen(
    screen
){

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(

            function(item){

                item.classList.remove(
                    "active"
                );

            }

        );


    screen.classList.add(
        "active"
    );


    scaleGame();

}


/* ==================================================
   SCALE
================================================== */

function scaleGame(){

    const frame =
        document.getElementById(
            "gameFrame"
        );


    const scale =
        Math.min(

            window.innerWidth /
            1536,

            window.innerHeight /
            864

        );


    frame.style.transform =
        "translate(-50%,-50%) scale(" +
        scale +
        ")";

}


/* ==================================================
   MỞ TRẢI NGHIỆM
================================================== */

document
    .getElementById(
        "experienceButton"
    )
    .onclick = function(){

        showScreen(
            homeScreen
        );

    };


/* ==================================================
   MỞ LẬP NHÓM
================================================== */

document
    .querySelector(
        ".btn-lapnhom"
    )
    .onclick = function(){

        showScreen(
            lapnhomScreen
        );


        if(
            !character
        ){

            character =
                new Character();

        }
        else{

            character.play(
                "idle"
            );

        }

    };


/* ==================================================
   CÁC NÚT KHÁC
================================================== */

document
    .querySelectorAll(
        ".game-button"
    )
    .forEach(

        function(button){

            button.addEventListener(
                "click",
                function(){

                    const route =
                        button.dataset.route;


                    if(
                        route ===
                        "lapnhom"
                    ){

                        return;

                    }


                    show404(
                        route
                    );

                }
            );

        }

    );


/* ==================================================
   404
================================================== */

function show404(
    route
){

    showScreen(
        errorScreen
    );


    document
        .getElementById(
            "errorText"
        )
        .innerHTML =
        "Trang <b>/" +
        route +
        "</b> chưa được tạo.";

}


/* ==================================================
   QUAY LẠI
================================================== */

document
    .getElementById(
        "backHome"
    )
    .onclick = function(){

        showScreen(
            homeScreen
        );

    };


document
    .getElementById(
        "errorBack"
    )
    .onclick = function(){

        showScreen(
            homeScreen
        );

    };


/* ==================================================
   NÚT ANIMATION
================================================== */

document
    .querySelectorAll(
        "[data-animation]"
    )
    .forEach(

        function(button){

            button.onclick =
                function(){

                    if(
                        character
                    ){

                        character.play(

                            button.dataset.animation

                        );

                    }

                };

        }

    );


/* ==================================================
   SCALE
================================================== */

window.addEventListener(
    "resize",
    scaleGame
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            scaleGame,
            200
        );

    }
);


scaleGame();

</script>

</body>
</html>
