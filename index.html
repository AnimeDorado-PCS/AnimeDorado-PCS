<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AnimeDorado</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================
   HOME
========================================= */

#home{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================
   SPACE IMAGE
========================================= */

#space{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:
        translate(-50%,-50%)
        scale(1.02);

    animation:
        spaceMove 16s
        ease-in-out
        infinite alternate;

    will-change:transform;

    user-select:none;
    -webkit-user-drag:none;
}

@keyframes spaceMove{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1.02)
            translate3d(0,0,0);
    }

    50%{
        transform:
            translate(-49.6%,-50.4%)
            scale(1.055)
            translate3d(-7px,4px,0);
    }

    100%{
        transform:
            translate(-50.2%,-49.7%)
            scale(1.04)
            translate3d(7px,-4px,0);
    }
}

/* =========================================
   OVERLAY
========================================= */

.dark{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 44%,
            rgba(30,140,255,.08),
            rgba(0,0,0,.63)
        );

    pointer-events:none;
}

/* =========================================
   GLOW
========================================= */

.glow{
    position:absolute;

    left:50%;
    top:50%;

    width:46vmax;
    height:46vmax;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(45,120,255,.12),
            transparent 68%
        );

    filter:blur(22px);

    animation:
        glowPulse 5s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes glowPulse{

    0%,100%{
        opacity:.45;
        transform:
            translate(-50%,-50%)
            scale(.95);
    }

    50%{
        opacity:.9;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}

/* =========================================
   STARS
========================================= */

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    background:#fff;

    border-radius:50%;

    opacity:.55;

    animation:
        starFloat linear infinite;
}

@keyframes starFloat{

    0%{
        transform:
            translate3d(0,30px,0)
            scale(.7);

        opacity:.15;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:
            translate3d(22px,-140px,0)
            scale(1.4);

        opacity:0;
    }
}

/* =========================================
   TOP BUTTONS
========================================= */

.top-button{
    position:absolute;

    top:20px;

    width:54px;
    height:54px;

    border:1px solid
        rgba(130,190,255,.8);

    border-radius:14px;

    background:
        rgba(0,15,45,.5);

    color:#fff;

    font-size:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 12px rgba(50,130,255,.25);

    backdrop-filter:blur(5px);

    cursor:pointer;

    z-index:20;
}

.top-button:active{
    transform:scale(.93);
}

#soundButton{
    left:20px;
}

#settingsButton{
    right:20px;
}

/* =========================================
   LOGO
========================================= */

.logo{
    position:absolute;

    left:50%;
    top:13%;

    width:92%;

    transform:
        translateX(-50%);

    text-align:center;

    animation:
        logoFloat 4s
        ease-in-out
        infinite alternate;

    z-index:10;
}

@keyframes logoFloat{

    from{
        transform:
            translateX(-50%)
            translateY(0);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-7px);
    }
}

.logo h1{
    font-size:
        clamp(
            38px,
            7vw,
            84px
        );

    font-weight:1000;

    letter-spacing:
        clamp(
            3px,
            .8vw,
            10px
        );

    color:#fff;

    text-shadow:
        0 0 8px rgba(120,150,255,.9),
        0 0 22px rgba(90,70,255,.85),
        0 0 45px rgba(70,110,255,.7);
}

.logo h2{
    margin-top:9px;

    font-size:
        clamp(
            13px,
            2.2vw,
            24px
        );

    letter-spacing:
        clamp(
            2px,
            .4vw,
            6px
        );

    color:#79dbff;

    text-shadow:
        0 0 12px rgba(0,190,255,.9);
}

/* =========================================
   PLAY AREA
========================================= */

.play-area{
    position:absolute;

    left:50%;

    bottom:13%;

    transform:
        translateX(-50%);

    width:100%;

    text-align:center;

    z-index:10;
}

.play-button{

    width:
        min(
            360px,
            72vw
        );

    height:
        min(
            82px,
            13vw
        );

    min-height:60px;

    border:
        2px solid
        #a984ff;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(104,40,255,.96),
            rgba(23,112,255,.96)
        );

    color:#fff;

    font-size:
        clamp(
            21px,
            4vw,
            34px
        );

    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 12px rgba(120,75,255,.9),
        0 0 32px rgba(75,90,255,.7),
        inset 0 0 18px
        rgba(255,255,255,.15);

    animation:
        buttonPulse 2.2s
        ease-in-out
        infinite;

    transition:.2s;
}

@keyframes buttonPulse{

    0%,100%{
        box-shadow:
            0 0 12px rgba(120,75,255,.9),
            0 0 30px rgba(75,90,255,.55),
            inset 0 0 18px
            rgba(255,255,255,.15);
    }

    50%{
        box-shadow:
            0 0 20px rgba(160,110,255,1),
            0 0 50px rgba(80,110,255,.9),
            inset 0 0 25px
            rgba(255,255,255,.2);
    }
}

.play-button:active{
    transform:scale(.95);
}

.subtitle{

    margin-top:13px;

    color:#9fe2ff;

    font-size:
        clamp(
            10px,
            1.8vw,
            15px
        );

    letter-spacing:3px;

    text-shadow:
        0 0 8px
        rgba(0,150,255,.8);
}

/* =========================================
   FOOTER
========================================= */

.footer{

    position:absolute;

    left:50%;
    bottom:3%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.42);

    font-size:10px;

    letter-spacing:2px;

    white-space:nowrap;

    z-index:10;
}

/* =========================================
   LANDSCAPE
========================================= */

@media (orientation:landscape){

    .logo{
        top:10%;
    }

    .play-area{
        bottom:10%;
    }

    .play-button{
        width:290px;
        height:64px;
        min-height:0;
        font-size:26px;
    }

    .subtitle{
        margin-top:8px;
        font-size:11px;
    }

    .footer{
        display:none;
    }

}

/* =========================================
   LANDSCAPE MÀN HÌNH RẤT THẤP
========================================= */

@media (orientation:landscape) and (max-height:500px){

    .top-button{
        width:46px;
        height:46px;
        top:12px;
    }

    #soundButton{
        left:12px;
    }

    #settingsButton{
        right:12px;
    }

    .logo{
        top:5%;
    }

    .logo h1{
        font-size:
            clamp(
                30px,
                7vh,
                58px
            );
    }

    .logo h2{
        font-size:12px;
        margin-top:4px;
    }

    .play-area{
        bottom:5%;
    }

    .play-button{
        width:260px;
        height:54px;
        font-size:21px;
    }

    .subtitle{
        margin-top:5px;
        font-size:9px;
    }

}

/* =========================================
   DỌC
========================================= */

@media (orientation:portrait){

    .logo{
        top:12%;
    }

    .play-area{
        bottom:12%;
    }

}

/* =========================================
   MÁY RẤT NHỎ
========================================= */

@media (max-width:380px){

    .logo h1{
        font-size:31px;
    }

    .logo h2{
        font-size:11px;
    }

    .play-button{
        height:60px;
        font-size:19px;
    }
}
</style>
</head>

<body>

<div id="home">

    <!-- ẢNH NỀN -->
    <img
        id="space"
        src="./space.jpeg"
        alt="Space">


    <div class="dark"></div>

    <div class="glow"></div>


    <!-- SAO -->
    <div
        class="stars"
        id="stars">
    </div>


    <!-- NÚT ÂM THANH -->
    <button
        id="soundButton"
        class="top-button"
        type="button"
        onclick="toggleSound()">

        🔊

    </button>


    <!-- NÚT CÀI ĐẶT -->
    <button
        id="settingsButton"
        class="top-button"
        type="button">

        ⚙️

    </button>


    <!-- LOGO -->

    <div class="logo">

        <h1>
            ANIME DORADO
        </h1>

        <h2>
            ANIME ADVENTURE
        </h2>

    </div>


    <!-- PLAY -->

    <div class="play-area">

        <button
            id="playButton"
            class="play-button"
            type="button"
            onclick="playGame()">

            ★ &nbsp; CHƠI THỬ &nbsp; ★

        </button>

        <div class="subtitle">

            BẮT ĐẦU HÀNH TRÌNH CỦA BẠN

        </div>

    </div>


    <div class="footer">

        ANIME DORADO © 2026

    </div>


    <!--
      NHẠC NỀN

      Đặt file music.mp3 cùng thư mục
      với index.html.
    -->

    <audio
        id="music"
        src="./music.mp3"
        loop
        preload="auto">
    </audio>

</div>


<script>

/* =========================================
   TẠO SAO
========================================= */

const stars =
    document.getElementById(
        "stars"
    );

for(
    let i = 0;
    i < 60;
    i++
){

    const star =
        document.createElement(
            "div"
        );

    star.className =
        "star";

    star.style.left =
        Math.random()*100 +
        "%";

    star.style.top =
        Math.random()*100 +
        "%";

    const size =
        Math.random()*2 + 1;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.animationDuration =
        (4 + Math.random()*8) +
        "s";

    star.style.animationDelay =
        (-Math.random()*8) +
        "s";

    stars.appendChild(
        star
    );
}


/* =========================================
   ÂM THANH
========================================= */

const music =
    document.getElementById(
        "music"
    );

const soundButton =
    document.getElementById(
        "soundButton"
    );


let soundOn =
    localStorage.getItem(
        "animeDoradoSound"
    ) !== "off";


function updateSoundButton(){

    soundButton.textContent =
        soundOn
        ? "🔊"
        : "🔇";
}


async function startMusic(){

    if(!soundOn){
        return;
    }

    try{

        music.volume =
            0.45;

        await music.play();

    }catch(error){

        /*
          Trình duyệt có thể chặn
          autoplay trước khi người dùng
          chạm màn hình.
        */

        console.log(
            "Autoplay blocked"
        );

    }
}


function toggleSound(){

    soundOn =
        !soundOn;

    localStorage.setItem(
        "animeDoradoSound",
        soundOn
        ? "on"
        : "off"
    );


    if(soundOn){

        music.volume =
            0.45;

        music.play()
            .catch(
                function(){}
            );

    }else{

        music.pause();

    }


    updateSoundButton();
}


/*
  Lần đầu người chơi chạm vào màn hình
  thì cố gắng bật nhạc.
*/

document.addEventListener(
    "pointerdown",
    function(){

        if(soundOn){

            startMusic();

        }

    },
    {
        once:true
    }
);


updateSoundButton();


/* =========================================
   CHƠI THỬ
========================================= */

function playGame(){

    /*
       Bấm nút = chắc chắn có tương tác
       nên có thể phát nhạc nếu chưa phát.
    */

    if(soundOn){

        music.volume =
            0.45;

        music.play()
            .catch(
                function(){}
            );

    }


    const home =
        document.getElementById(
            "home"
        );

    home.style.transition =
        "opacity .6s ease";

    home.style.opacity =
        "0";


    setTimeout(
        function(){

            window.location.href =
                "./giaodien.html";

        },
        600
    );
}


/* =========================================
   KIỂM TRA SPACE.JPEG
========================================= */

document
.getElementById("space")
.addEventListener(
    "error",
    function(){

        document.body.innerHTML = `

        <div style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#05070d;
            color:white;
            text-align:center;
            padding:30px;
            font-family:Arial;
        ">

            <div>

                <h2>
                    Không tìm thấy space.jpeg
                </h2>

                <p style="
                    margin-top:12px;
                    color:#999;
                ">

                    Hãy upload file
                    <b>space.jpeg</b>
                    cùng thư mục với
                    <b>index.html</b>.

                </p>

            </div>

        </div>

        `;

    }
);


/* =========================================
   GIỮ GIAO DIỆN ĐÚNG KHI XOAY MÀN HÌNH
========================================= */

window.addEventListener(
    "orientationchange",
    function(){

        window.setTimeout(
            function(){

                window.dispatchEvent(
                    new Event("resize")
                );

            },
            300
        );

    }
);

</script>

</body>
</html>
