<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ANIME DORADO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:auto;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#03040b;
    color:white;
}

/* ====================================
   NỀN
==================================== */

.page{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at center,
            #17214d 0%,
            #080b1d 48%,
            #020308 100%
        );
}

/* ====================================
   KHUNG CHÍNH
==================================== */

.game-card{

    position:relative;

    width:min(92vw,600px);

    aspect-ratio:1 / 1;

    overflow:hidden;

    border-radius:28px;

    border:
        2px solid
        rgba(110,190,255,.35);

    background:#050816;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.75),
        0 0 45px
        rgba(50,130,255,.18);

}

/* ====================================
   ẢNH KHÔNG GIAN
==================================== */

.space-image{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center center;

    display:block;

    user-select:none;

    -webkit-user-drag:none;

    transform:scale(1.03);
}

/* ====================================
   LỚP TỐI
==================================== */

.overlay{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08) 0%,
            rgba(0,0,0,.05) 35%,
            rgba(0,0,0,.18) 55%,
            rgba(0,0,0,.78) 100%
        );

    pointer-events:none;
}

/* ====================================
   ÁNH SÁNG
==================================== */

.glow{

    position:absolute;

    width:55%;
    height:55%;

    right:-10%;
    bottom:-10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,180,255,.22),
            transparent 70%
        );

    filter:blur(25px);

    pointer-events:none;
}

/* ====================================
   LOGO
==================================== */

.logo{

    position:absolute;

    top:7%;

    left:0;
    right:0;

    text-align:center;

    z-index:5;
}

.logo h1{

    font-size:
        clamp(32px,8vw,56px);

    font-weight:900;

    letter-spacing:4px;

    color:#f7fbff;

    text-shadow:
        0 0 10px
        rgba(100,190,255,.9),
        0 0 30px
        rgba(120,100,255,.7),
        0 4px 10px
        #000;
}

.logo h2{

    margin-top:5px;

    font-size:
        clamp(13px,3vw,19px);

    letter-spacing:6px;

    color:#66d8ff;

    text-shadow:
        0 0 12px
        rgba(80,200,255,.8);
}

/* ====================================
   PHI HÀNH GIA
==================================== */

.astronaut-label{

    position:absolute;

    left:6%;
    bottom:35%;

    z-index:5;

    padding:8px 13px;

    border-radius:20px;

    background:
        rgba(0,0,0,.42);

    border:
        1px solid
        rgba(255,255,255,.2);

    color:#dcefff;

    font-size:
        clamp(10px,2.3vw,14px);

    letter-spacing:1px;

    backdrop-filter:blur(6px);

}

/* ====================================
   PHỤ ĐỀ
==================================== */

.subtitle{

    position:absolute;

    left:0;
    right:0;

    bottom:25%;

    text-align:center;

    z-index:5;

    font-size:
        clamp(11px,2.6vw,16px);

    color:#d8e9ff;

    text-shadow:
        0 2px 5px #000;
}

/* ====================================
   NÚT CHƠI
==================================== */

.play-button{

    position:absolute;

    left:50%;
    bottom:9%;

    transform:translateX(-50%);

    width:60%;

    min-width:210px;

    max-width:360px;

    height:58px;

    border:2px solid
        rgba(255,255,255,.75);

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #7b32ff,
            #3158ff,
            #00b7ff
        );

    color:white;

    font-size:
        clamp(16px,4vw,25px);

    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 18px
        rgba(60,150,255,.75),
        0 7px 20px
        rgba(0,0,0,.55);

    z-index:10;

    transition:
        transform .15s,
        filter .15s;
}

.play-button:hover{

    filter:brightness(1.15);

}

.play-button:active{

    transform:
        translateX(-50%)
        scale(.96);

}

/* ====================================
   HẠT SÁNG
==================================== */

.star{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white;

    opacity:.85;

    animation:
        twinkle 2.5s infinite alternate;

    z-index:4;
}

.star.s1{
    top:16%;
    left:14%;
}

.star.s2{
    top:26%;
    right:16%;
}

.star.s3{
    top:42%;
    left:8%;
}

.star.s4{
    top:12%;
    right:35%;
}

.star.s5{
    top:52%;
    right:11%;
}

@keyframes twinkle{

    from{
        opacity:.25;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.3);
    }

}

/* ====================================
   MOBILE
==================================== */

@media(max-width:500px){

    .page{
        padding:10px;
    }

    .game-card{
        width:94vw;
        border-radius:22px;
    }

    .play-button{
        width:68%;
        min-width:190px;
    }

}

</style>
</head>

<body>

<div class="page">

    <div class="game-card">

        <!-- ẢNH PHI HÀNH GIA -->
        <img
            class="space-image"
            src="./space.jpg"
            alt="AnimeDorado Space">

        <!-- TỐI ẢNH -->
        <div class="overlay"></div>

        <!-- ÁNH SÁNG -->
        <div class="glow"></div>


        <!-- SAO -->
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>
        <div class="star s5"></div>


        <!-- LOGO -->
        <div class="logo">

            <h1>
                ANIME DORADO
            </h1>

            <h2>
                ANIME ADVENTURE
            </h2>

        </div>


        <!-- NHÃN -->
        <div class="astronaut-label">
            🚀 SPACE EXPLORER
        </div>


        <!-- PHỤ ĐỀ -->
        <div class="subtitle">

            Khám phá vũ trụ.
            <br>
            Bắt đầu hành trình của bạn.

        </div>


        <!-- NÚT -->
        <button
            class="play-button"
            onclick="playGame()">

            ★ &nbsp; CHƠI THỬ &nbsp; ★

        </button>

    </div>

</div>


<script>

function playGame(){

    /*
       Chuyển thẳng sang
       giao diện game.
    */

    window.location.href =
        "./giaodien.html";

}

</script>

</body>
</html>
