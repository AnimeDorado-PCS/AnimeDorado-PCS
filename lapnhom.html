<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Anime Dorado - Lập nhóm</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            circle at center,
            #263b5c,
            #06080d
        );

    color:white;

    font-family:Arial;

    display:flex;

    justify-content:center;

    align-items:center;

}


.game{

    width:100%;

    max-width:700px;

    text-align:center;

    padding:20px;

}


.title{

    color:#ffd65a;

    font-size:28px;

    margin-bottom:10px;

}


.character-box{

    width:100%;

    max-width:430px;

    margin:auto;

    border:2px solid
        rgba(255,215,90,.3);

    border-radius:20px;

    background:
        rgba(0,0,0,.45);

    padding:10px;

}


#characterCanvas{

    width:100%;

    max-width:420px;

    display:block;

    margin:auto;

}


.buttons{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}


button{

    min-height:50px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #6d4307,
            #e2ad32
        );

    color:white;

    font-weight:bold;

    font-size:14px;

}


button:active{

    transform:scale(.96);

}


.back{

    margin-top:15px;

    background:#202633;

}

</style>

</head>


<body>


<div class="game">


    <div class="title">
        ANIME DORADO
    </div>


    <div class="character-box">

        <canvas
            id="characterCanvas">
        </canvas>

    </div>


    <div class="buttons">

        <button
            onclick="
                character.play('idle')
            ">

            IDLE

        </button>


        <button
            onclick="
                character.play('run')
            ">

            CHẠY

        </button>


        <button
            onclick="
                character.play('normalAttack')
            ">

            ĐÁNH THƯỜNG

        </button>


        <button
            onclick="
                character.play('skill1')
            ">

            SKILL 1

        </button>


        <button
            onclick="
                character.play('skill2')
            ">

            SKILL 2

        </button>


        <button
            onclick="
                character.play('skill3')
            ">

            SKILL 3

        </button>

    </div>


    <button
        class="back"
        onclick="
            history.back()
        ">

        ← QUAY LẠI

    </button>


</div>


<script src="./character.js"></script>


<script>

const character =
    new Character({

        canvas:
            document.getElementById(
                "characterCanvas"
            ),

        image:
            "./characters/superman-30frames.png",

        fps:12

    });

</script>


</body>

</html>
