<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ANIME DORADO • LẬP NHÓM</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#061117;
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
}

button{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
}

img{
    user-select:none;
    -webkit-user-drag:none;
}

/* =========================================================
   ROOT
========================================================= */

#app{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

#background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    pointer-events:none;
}

#backgroundShade{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.14) 0%,
            rgba(0,0,0,.05) 30%,
            rgba(0,20,30,.18) 100%
        );
}

#ui{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;
    padding-bottom:28px;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    width:100%;
    min-height:72px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
}

.back-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.38);
    border-radius:14px;
    background:rgba(0,0,0,.28);
    color:#fff;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

.page-title{
    flex:1;
    min-width:0;
}

.page-title h1{
    font-size:clamp(22px,6vw,34px);
    font-weight:900;
    line-height:1;
    text-shadow:0 3px 10px rgba(0,0,0,.65);
}

.page-title p{
    margin-top:5px;
    font-size:10px;
    color:rgba(255,255,255,.72);
    letter-spacing:1.5px;
}

.resources{
    display:flex;
    gap:7px;
    margin-left:auto;
}

.resource{
    min-width:88px;
    height:38px;
    padding:0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    background:rgba(0,0,0,.28);
    color:#fff;
    font-size:11px;
    font-weight:900;
    backdrop-filter:blur(8px);
}

.resource-icon{
    font-size:14px;
}

/* =========================================================
   CONTENT WIDTH
========================================================= */

.content{
    width:min(1080px,94vw);
    margin:0 auto;
}

/* =========================================================
   TEAM HEADER
========================================================= */

.team-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:3px;
    margin-bottom:9px;
}

.team-label{
    color:#fff;
    font-size:14px;
    font-weight:900;
    text-shadow:0 2px 7px #000;
}

.team-count{
    padding:5px 10px;
    border-radius:14px;
    background:rgba(0,0,0,.24);
    color:#ffd65a;
    font-size:11px;
    font-weight:900;
    backdrop-filter:blur(7px);
}

/* =========================================================
   TEAM SLOTS
========================================================= */

.team-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:10px;
}

.team-slot{
    position:relative;
    min-width:0;
    aspect-ratio:1/1;
    border:1px solid rgba(255,255,255,.17);
    border-radius:15px;
    background:
        linear-gradient(
            180deg,
            rgba(75,159,188,.55),
            rgba(10,45,65,.72)
        );
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 10px 25px rgba(0,0,0,.22);
    overflow:hidden;
    cursor:pointer;
    color:#fff;
    transition:transform .14s ease,
               border-color .14s ease,
               box-shadow .14s ease;
}

.team-slot:active{
    transform:scale(.97);
}

.team-slot.selected{
    border:2px solid #ffd65a;
    box-shadow:
        0 0 22px rgba(255,214,90,.25),
        inset 0 0 14px rgba(255,214,90,.08);
}

.team-slot.empty::before{
    content:"+";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffd65a;
    font-size:40px;
    font-weight:200;
}

.slot-number{
    position:absolute;
    left:7px;
    top:6px;
    z-index:4;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(0,0,0,.32);
    color:#dce7ee;
    font-size:9px;
    font-weight:900;
}

.slot-image{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.slot-bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:5;
    padding:7px 4px 5px;
    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.82)
        );
    text-align:center;
}

.slot-name{
    display:block;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.slot-status{
    display:block;
    margin-top:2px;
    color:#ffd65a;
    font-size:8px;
    font-weight:900;
}

/* =========================================================
   MAIN CHARACTER SECTION
========================================================= */

.hero-section{
    margin-top:17px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 240px;
    gap:12px;
    align-items:stretch;
}

.hero-card{
    position:relative;
    min-height:350px;
    border:1px solid rgba(255,215,100,.38);
    border-radius:20px;
    background:
        linear-gradient(
            180deg,
            rgba(242,192,91,.96),
            rgba(205,138,42,.94)
        );
    box-shadow:
        0 20px 45px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.35);
    color:#40200a;
    overflow:visible;
}

.hero-ribbon{
    position:absolute;
    left:-7px;
    top:14px;
    z-index:10;
    padding:8px 13px;
    background:#e55e16;
    color:#fff;
    font-size:11px;
    font-weight:900;
    clip-path:
        polygon(
            0 0,
            100% 0,
            84% 100%,
            0 88%
        );
}

.hero-star{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:68px;
    height:34px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#71430f;
    color:#ffd65a;
    font-size:18px;
    box-shadow:0 5px 12px rgba(0,0,0,.25);
}

.hero-header{
    padding:22px 16px 0;
    text-align:center;
}

.hero-name{
    font-size:25px;
    font-weight:900;
}

.hero-rarity{
    display:inline-block;
    margin-top:4px;
    padding:4px 9px;
    border-radius:20px;
    background:rgba(90,45,7,.13);
    color:#5a2a08;
    font-size:10px;
    font-weight:900;
}

.hero-visual{
    width:150px;
    height:150px;
    margin:9px auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-visual img{
    width:132px;
    height:132px;
    object-fit:contain;
    filter:
        drop-shadow(
            0 8px 8px rgba(0,0,0,.34)
        );
}

.hero-stats{
    width:min(390px,88%);
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 15px;
}

.stat{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:5px 0;
    border-bottom:1px solid rgba(89,43,7,.16);
    font-size:12px;
}

.stat-label{
    opacity:.68;
}

.stat-value{
    font-weight:900;
}

/* =========================================================
   SIDE ACTION PANEL
========================================================= */

.action-card{
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    background:rgba(0,0,0,.28);
    padding:10px;
    backdrop-filter:blur(8px);
}

.action-card-title{
    padding:5px 4px 8px;
    color:#ffd65a;
    font-size:12px;
    font-weight:900;
    text-align:center;
}

.action-list{
    display:grid;
    gap:7px;
}

.action-button{
    width:100%;
    min-height:45px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.09),
            rgba(0,0,0,.22)
        );
    color:#fff;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.action-button.primary{
    background:
        linear-gradient(
            135deg,
            #f4c842,
            #b96d0a
        );
    color:#1b1304;
}

.action-button.danger{
    background:
        linear-gradient(
            180deg,
            rgba(170,40,40,.8),
            rgba(83,17,17,.8)
        );
}

/* =========================================================
   INVENTORY
========================================================= */

.inventory-panel{
    margin-top:13px;
    padding:13px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(7px);
}

.inventory-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
}

.inventory-title{
    color:#fff;
    font-size:14px;
    font-weight:900;
    text-shadow:0 2px 6px #000;
}

.inventory-sub{
    color:#b7c0cc;
    font-size:10px;
}

.inventory-grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(96px,1fr)
        );
    gap:8px;
}

.character-card{
    position:relative;
    min-height:128px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.07),
            rgba(0,0,0,.24)
        );
    color:#fff;
    overflow:hidden;
    cursor:pointer;
}

.character-card.active{
    border:2px solid #ffd65a;
    box-shadow:
        0 0 16px rgba(255,214,90,.18);
}

.character-card.equipped{
    opacity:.58;
}

.character-card img{
    width:100%;
    height:84px;
    object-fit:contain;
    display:block;
}

.character-card-name{
    display:block;
    margin-top:2px;
    text-align:center;
    font-size:11px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.character-card-rarity{
    display:block;
    margin-top:3px;
    text-align:center;
    color:#ffd65a;
    font-size:9px;
    font-weight:900;
}

.equipped-mark{
    position:absolute;
    top:6px;
    right:6px;
    padding:3px 5px;
    border-radius:8px;
    background:rgba(0,0,0,.58);
    color:#ffd65a;
    font-size:8px;
    font-weight:900;
}

/* =========================================================
   MENU
========================================================= */

.character-menu{
    position:absolute;
    right:-143px;
    top:70px;
    width:138px;
    padding:5px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:12px;
    background:
        rgba(16,25,33,.96);
    box-shadow:
        0 18px 35px rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    z-index:50;
    display:none;
}

.character-menu.show{
    display:block;
}

.menu-button{
    width:100%;
    height:41px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:left;
    padding:0 11px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.menu-button:active{
    background:rgba(255,255,255,.09);
}

.menu-button.primary{
    background:
        linear-gradient(
            135deg,
            #e4af24,
            #9c600a
        );
    color:#1c1305;
}

.menu-button.close{
    color:#aeb8c6;
}

/* =========================================================
   BOTTOM ACTIONS
========================================================= */

.bottom-actions{
    width:min(620px,94vw);
    margin:15px auto 0;
    display:grid;
    grid-template-columns:1fr 1.35fr;
    gap:9px;
}

.bottom-button{
    min-height:55px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:15px;
    color:#fff;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.28);
}

.bottom-button.draw{
    background:
        linear-gradient(
            180deg,
            #9b55ff,
            #5f2eb9
        );
}

.bottom-button.start{
    background:
        linear-gradient(
            180deg,
            #61caff,
            #207bc8
        );
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:
        translateX(-50%)
        translateY(20px);
    z-index:100;
    padding:10px 15px;
    border-radius:12px;
    background:rgba(8,13,18,.92);
    border:1px solid rgba(255,214,90,.28);
    color:#fff;
    font-size:11px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    transition:.22s ease;
}

.toast.show{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media (orientation:portrait){

    .resources{
        display:none;
    }

    .hero-section{
        grid-template-columns:1fr;
    }

    .action-card{
        order:2;
    }

    .action-list{
        grid-template-columns:
            repeat(3,1fr);
    }

    .action-button{
        min-height:42px;
        font-size:11px;
    }

    .character-menu{
        right:0;
        top:64px;
    }

}

/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width:430px){

    .content{
        width:calc(100% - 14px);
    }

    .topbar{
        padding:8px 9px;
    }

    .back-button{
        width:43px;
        height:43px;
        flex-basis:43px;
    }

    .page-title h1{
        font-size:23px;
    }

    .team-grid{
        gap:5px;
    }

    .team-slot{
        border-radius:10px;
    }

    .slot-number{
        width:17px;
        height:17px;
        font-size:8px;
    }

    .slot-name{
        font-size:8px;
    }

    .hero-card{
        min-height:325px;
    }

    .hero-visual{
        width:120px;
        height:120px;
    }

    .hero-visual img{
        width:105px;
        height:105px;
    }

    .bottom-actions{
        grid-template-columns:1fr 1fr;
    }

    .bottom-button{
        min-height:50px;
        font-size:12px;
    }

}

/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (
    orientation:landscape
) and (max-height:520px){

    #ui{
        padding-bottom:15px;
    }

    .topbar{
        min-height:58px;
        padding:6px 10px;
    }

    .back-button{
        width:40px;
        height:40px;
        flex-basis:40px;
        font-size:22px;
    }

    .page-title h1{
        font-size:22px;
    }

    .page-title p{
        display:none;
    }

    .hero-section{
        grid-template-columns:
            minmax(0,1fr)
            210px;
    }

    .hero-card{
        min-height:280px;
    }

    .hero-visual{
        height:105px;
        width:105px;
    }

    .hero-visual img{
        width:95px;
        height:95px;
    }

    .action-button{
        min-height:37px;
        font-size:10px;
    }

    .inventory-grid{
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(82px,1fr)
            );
    }

    .character-card{
        min-height:105px;
    }

    .character-card img{
        height:66px;
    }

}

</style>
</head>

<body>

<div id="app">

    <img
        id="background"
        src="./nennhom.png"
        alt="ANIME DORADO">

    <div id="backgroundShade"></div>

    <div id="ui">

        <!-- =============================================
             TOP BAR
        ============================================== -->

        <header class="topbar">

            <button
                id="backButton"
                class="back-button"
                aria-label="Quay lại">

                ←

            </button>

            <div class="page-title">

                <h1>LẬP NHÓM</h1>

                <p>TRANG BỊ ĐỘI HÌNH</p>

            </div>

            <div class="resources">

                <div class="resource">
                    <span class="resource-icon">🪙</span>
                    <span>0</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">💎</span>
                    <span>665</span>
                </div>

                <div class="resource">
                    <span class="resource-icon">🪙</span>
                    <span>700000</span>
                </div>

            </div>

        </header>


        <main class="content">

            <!-- =========================================
                 TEAM
            ========================================== -->

            <div class="team-head">

                <div class="team-label">
                    ĐỘI HÌNH CỦA BẠN
                </div>

                <div
                    id="teamCount"
                    class="team-count">

                    0 / 5

                </div>

            </div>


            <div
                id="teamGrid"
                class="team-grid">

                <button
                    class="team-slot empty selected"
                    data-slot="0">

                    <span class="slot-number">1</span>

                </button>

                <button
                    class="team-slot empty"
                    data-slot="1">

                    <span class="slot-number">2</span>

                </button>

                <button
                    class="team-slot empty"
                    data-slot="2">

                    <span class="slot-number">3</span>

                </button>

                <button
                    class="team-slot empty"
                    data-slot="3">

                    <span class="slot-number">4</span>

                </button>

                <button
                    class="team-slot empty"
                    data-slot="4">

                    <span class="slot-number">5</span>

                </button>

            </div>


            <!-- =========================================
                 MAIN CHARACTER
            ========================================== -->

            <section class="hero-section">


                <div
                    id="heroCard"
                    class="hero-card">

                    <div class="hero-ribbon">
                        ĐANG CHỌN
                    </div>

                    <div class="hero-star">
                        ★
                    </div>


                    <div class="hero-header">

                        <div
                            id="heroName"
                            class="hero-name">

                            Superman

                        </div>

                        <div
                            id="heroRarity"
                            class="hero-rarity">

                            SSR • Lv.1

                        </div>

                    </div>


                    <div class="hero-visual">

                        <img
                            id="heroImage"
                            src="./characters/superman/sprite.png"
                            alt="Superman">

                    </div>


                    <div class="hero-stats">

                        <div class="stat">
                            <span class="stat-label">
                                LV
                            </span>
                            <span
                                id="statLevel"
                                class="stat-value">
                                1
                            </span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">
                                EXP
                            </span>
                            <span
                                id="statExp"
                                class="stat-value">
                                0%
                            </span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">
                                HP
                            </span>
                            <span
                                id="statHP"
                                class="stat-value">
                                1000
                            </span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">
                                ATK
                            </span>
                            <span
                                id="statATK"
                                class="stat-value">
                                120
                            </span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">
                                DEF
                            </span>
                            <span
                                id="statDEF"
                                class="stat-value">
                                80
                            </span>
                        </div>

                        <div class="stat">
                            <span class="stat-label">
                                AP
                            </span>
                            <span
                                id="statAP"
                                class="stat-value">
                                30
                            </span>
                        </div>

                    </div>


                    <!-- CHARACTER MENU -->

                    <div
                        id="characterMenu"
                        class="character-menu">

                        <button
                            class="menu-button primary"
                            data-menu="equip">

                            Trang bị

                        </button>

                        <button
                            class="menu-button"
                            data-menu="upgrade">

                            Nâng cấp

                        </button>

                        <button
                            class="menu-button"
                            data-menu="info">

                            Chi tiết

                        </button>

                        <button
                            class="menu-button"
                            data-menu="lock">

                            Khóa nhân vật

                        </button>

                        <button
                            class="menu-button close"
                            data-menu="close">

                            Đóng

                        </button>

                    </div>

                </div>


                <!-- =====================================
                     ACTIONS
                ====================================== -->

                <aside class="action-card">

                    <div class="action-card-title">
                        THAO TÁC
                    </div>

                    <div class="action-list">

                        <button
                            class="action-button primary"
                            id="equipButton">

                            TRANG BỊ

                        </button>

                        <button
                            class="action-button"
                            id="detailButton">

                            CHI TIẾT

                        </button>

                        <button
                            class="action-button"
                            id="upgradeButton">

                            NÂNG CẤP

                        </button>

                        <button
                            class="action-button"
                            id="lockButton">

                            KHÓA

                        </button>

                        <button
                            class="action-button danger"
                            id="removeButton">

                            THÁO

                        </button>

                    </div>

                </aside>

            </section>


            <!-- =========================================
                 INVENTORY
            ========================================== -->

            <section class="inventory-panel">

                <div class="inventory-head">

                    <div class="inventory-title">
                        NHÂN VẬT CỦA BẠN
                    </div>

                    <div class="inventory-sub">
                        3 nhân vật
                    </div>

                </div>


                <div
                    id="inventoryGrid"
                    class="inventory-grid">


                    <!-- SUPERMAN -->

                    <button
                        class="character-card active"
                        data-character-id="superman">

                        <img
                            src="./characters/superman/sprite.png"
                            alt="Superman">

                        <span class="character-card-name">
                            Superman
                        </span>

                        <span class="character-card-rarity">
                            SSR • Lv.1
                        </span>

                    </button>


                    <!-- LUFFY -->

                    <button
                        class="character-card"
                        data-character-id="luffy">

                        <img
                            src="./characters/luffy/sprite.png"
                            alt="Luffy">

                        <span class="character-card-name">
                            Luffy
                        </span>

                        <span class="character-card-rarity">
                            SSR • Lv.1
                        </span>

                    </button>


                    <!-- GOKU -->

                    <button
                        class="character-card"
                        data-character-id="goku">

                        <img
                            src="./characters/goku/sprite.png"
                            alt="Goku">

                        <span class="character-card-name">
                            Goku
                        </span>

                        <span class="character-card-rarity">
                            SSR • Lv.1
                        </span>

                    </button>


                </div>

            </section>


            <!-- =========================================
                 BOTTOM
            ========================================== -->

            <div class="bottom-actions">

                <button
                    id="drawButton"
                    class="bottom-button draw">

                    🎴 DRAW NHÂN VẬT

                </button>

                <button
                    id="startButton"
                    class="bottom-button start">

                    BẮT ĐẦU

                </button>

            </div>

        </main>

    </div>

    <div
        id="toast"
        class="toast">

        Đã cập nhật

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const characters = {

    superman:{
        id:"superman",
        name:"Superman",
        rarity:"SSR",
        level:1,
        exp:0,
        hp:1000,
        atk:120,
        def:80,
        ap:30,
        image:"./characters/superman/sprite.png"
    },

    luffy:{
        id:"luffy",
        name:"Luffy",
        rarity:"SSR",
        level:1,
        exp:0,
        hp:1100,
        atk:130,
        def:75,
        ap:30,
        image:"./characters/luffy/sprite.png"
    },

    goku:{
        id:"goku",
        name:"Goku",
        rarity:"SSR",
        level:1,
        exp:0,
        hp:1050,
        atk:145,
        def:85,
        ap:30,
        image:"./characters/goku/sprite.png"
    }

};


/* =========================================================
   STATE
========================================================= */

let team = [
    null,
    null,
    null,
    null,
    null
];

let selectedSlot = 0;

let selectedCharacterId = "superman";

let characterLocked = false;


/* =========================================================
   HELPERS
========================================================= */

function getCharacter(id){

    return characters[id] || null;

}

function findCharacterSlot(id){

    return team.indexOf(id);

}

function saveTeam(){

    localStorage.setItem(
        "animeDoradoTeam",
        JSON.stringify(team)
    );

}

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );

}


/* =========================================================
   LOAD TEAM
========================================================= */

function loadTeam(){

    try{

        const saved =
            localStorage.getItem(
                "animeDoradoTeam"
            );

        if(!saved){

            return;

        }

        const parsed =
            JSON.parse(saved);

        if(
            !Array.isArray(parsed)
        ){

            return;

        }

        const clean = [
            null,
            null,
            null,
            null,
            null
        ];

        const used =
            new Set();

        for(
            let i = 0;
            i < 5;
            i++
        ){

            const id =
                parsed[i];

            if(
                !characters[id]
            ){

                continue;

            }

            /*
             * Chống 1 nhân vật xuất hiện
             * ở nhiều ô.
             */
            if(
                used.has(id)
            ){

                continue;

            }

            used.add(id);

            clean[i] =
                id;

        }

        team = clean;

    }
    catch(error){

        team = [
            null,
            null,
            null,
            null,
            null
        ];

    }

}


/* =========================================================
   SELECT SLOT
========================================================= */

function selectSlot(index){

    if(
        index < 0 ||
        index > 4
    ){

        return;

    }

    selectedSlot = index;

    document
        .querySelectorAll(".team-slot")
        .forEach(
            function(slot){

                slot.classList.toggle(
                    "selected",
                    Number(
                        slot.dataset.slot
                    ) === index
                );

            }
        );

}


/* =========================================================
   SELECT CHARACTER
========================================================= */

function selectCharacter(id){

    const character =
        getCharacter(id);

    if(!character){

        return;

    }

    selectedCharacterId =
        id;

    updateHero();

    updateInventory();

}


/* =========================================================
   UPDATE HERO
========================================================= */

function updateHero(){

    const character =
        getCharacter(
            selectedCharacterId
        );

    if(!character){

        return;

    }

    document
        .getElementById("heroName")
        .textContent =
        character.name;

    document
        .getElementById("heroRarity")
        .textContent =
        character.rarity +
        " • Lv." +
        character.level;

    document
        .getElementById("heroImage")
        .src =
        character.image;

    document
        .getElementById("statLevel")
        .textContent =
        character.level;

    document
        .getElementById("statExp")
        .textContent =
        character.exp + "%";

    document
        .getElementById("statHP")
        .textContent =
        character.hp;

    document
        .getElementById("statATK")
        .textContent =
        character.atk;

    document
        .getElementById("statDEF")
        .textContent =
        character.def;

    document
        .getElementById("statAP")
        .textContent =
        character.ap;

}


/* =========================================================
   EQUIP
   1 CHARACTER = 1 SLOT
========================================================= */

function equipSelected(){

    const character =
        getCharacter(
            selectedCharacterId
        );

    if(!character){

        return;

    }

    const oldSlot =
        findCharacterSlot(
            character.id
        );

    /*
     * Đang ở chính slot.
     */
    if(
        oldSlot === selectedSlot
    ){

        showToast(
            character.name +
            " đã ở ô này"
        );

        renderTeam();

        return;

    }

    /*
     * Đã nằm ở ô khác:
     * xóa ô cũ trước.
     */
    if(
        oldSlot !== -1
    ){

        team[oldSlot] = null;

    }

    /*
     * Gắn vào ô mới.
     * Một slot chỉ chứa một nhân vật.
     */
    team[selectedSlot] =
        character.id;

    saveTeam();

    renderTeam();

    showToast(
        character.name +
        " đã được trang bị"
    );

}


/* =========================================================
   REMOVE
========================================================= */

function removeSelected(){

    const oldSlot =
        findCharacterSlot(
            selectedCharacterId
        );

    if(
        oldSlot === -1
    ){

        showToast(
            "Nhân vật chưa được trang bị"
        );

        return;

    }

    team[oldSlot] = null;

    saveTeam();

    renderTeam();

    showToast(
        "Đã tháo nhân vật"
    );

}


/* =========================================================
   RENDER TEAM
========================================================= */

function renderTeam(){

    const slots =
        document.querySelectorAll(
            ".team-slot"
        );

    let count = 0;

    slots.forEach(
        function(slot){

            const index =
                Number(
                    slot.dataset.slot
                );

            const id =
                team[index];

            /*
             * Xóa nội dung cũ.
             */
            slot
                .querySelectorAll(
                    ".slot-image,.slot-bottom"
                )
                .forEach(
                    function(node){

                        node.remove();

                    }
                );

            slot.classList.remove(
                "empty"
            );

            if(!id){

                slot.classList.add(
                    "empty"
                );

                return;

            }

            const character =
                getCharacter(id);

            if(!character){

                team[index] =
                    null;

                slot.classList.add(
                    "empty"
                );

                return;

            }

            count++;

            const image =
                document.createElement("img");

            image.className =
                "slot-image";

            image.src =
                character.image;

            image.alt =
                character.name;

            const bottom =
                document.createElement("div");

            bottom.className =
                "slot-bottom";

            const name =
                document.createElement("span");

            name.className =
                "slot-name";

            name.textContent =
                character.name;

            const status =
                document.createElement("span");

            status.className =
                "slot-status";

            status.textContent =
                "TRANG BỊ";

            bottom.appendChild(name);

            bottom.appendChild(status);

            slot.appendChild(image);

            slot.appendChild(bottom);

        }
    );

    document
        .getElementById("teamCount")
        .textContent =
        count + " / 5";

    updateInventory();

    saveTeam();

}


/* =========================================================
   INVENTORY
========================================================= */

function updateInventory(){

    document
        .querySelectorAll(
            ".character-card"
        )
        .forEach(
            function(card){

                const id =
                    card.dataset.characterId;

                card.classList.toggle(
                    "active",
                    id ===
                    selectedCharacterId
                );

                card.classList.remove(
                    "equipped"
                );

                card
                    .querySelectorAll(
                        ".equipped-mark"
                    )
                    .forEach(
                        function(mark){

                            mark.remove();

                        }
                    );

                if(
                    findCharacterSlot(id)
                    !== -1
                ){

                    card.classList.add(
                        "equipped"
                    );

                    const mark =
                        document.createElement(
                            "span"
                        );

                    mark.className =
                        "equipped-mark";

                    mark.textContent =
                        "ĐÃ TRANG BỊ";

                    card.appendChild(
                        mark
                    );

                }

            }
        );

}


/* =========================================================
   MENU
========================================================= */

const characterMenu =
    document.getElementById(
        "characterMenu"
    );

const heroCard =
    document.getElementById(
        "heroCard"
    );

function openMenu(){

    characterMenu.classList.add(
        "show"
    );

}

function closeMenu(){

    characterMenu.classList.remove(
        "show"
    );

}

function toggleMenu(){

    if(
        characterMenu.classList.contains(
            "show"
        )
    ){

        closeMenu();

    }
    else{

        openMenu();

    }

}


/*
 * Bấm thẻ nhân vật:
 * menu mở / đóng.
 */
heroCard.addEventListener(
    "click",
    function(event){

        if(
            event.target.closest(
                ".character-menu"
            )
        ){

            return;

        }

        toggleMenu();

    }
);


/* =========================================================
   INVENTORY CLICK
========================================================= */

document
    .querySelectorAll(
        ".character-card"
    )
    .forEach(
        function(card){

            card.addEventListener(
                "click",
                function(){

                    selectCharacter(
                        card.dataset.characterId
                    );

                    openMenu();

                }
            );

        }
    );


/* =========================================================
   TEAM SLOT CLICK
========================================================= */

document
    .querySelectorAll(
        ".team-slot"
    )
    .forEach(
        function(slot){

            slot.addEventListener(
                "click",
                function(){

                    selectSlot(
                        Number(
                            slot.dataset.slot
                        )
                    );

                    const id =
                        team[
                            selectedSlot
                        ];

                    if(id){

                        selectCharacter(
                            id
                        );

                    }

                }
            );

        }
    );


/* =========================================================
   SIDE ACTION BUTTONS
========================================================= */

document
    .getElementById("equipButton")
    .addEventListener(
        "click",
        function(){

            equipSelected();

        }
    );

document
    .getElementById("removeButton")
    .addEventListener(
        "click",
        function(){

            removeSelected();

        }
    );

document
    .getElementById("detailButton")
    .addEventListener(
        "click",
        function(){

            openMenu();

            showToast(
                "Mở Chi tiết nhân vật"
            );

        }
    );

document
    .getElementById("upgradeButton")
    .addEventListener(
        "click",
        function(){

            closeMenu();

            window.location.href =
                "/AnimeDorado-PCS/nangcap.html";

        }
    );

document
    .getElementById("lockButton")
    .addEventListener(
        "click",
        function(){

            characterLocked =
                !characterLocked;

            this.textContent =
                characterLocked
                    ? "ĐÃ KHÓA"
                    : "KHÓA";

            showToast(
                characterLocked
                    ? "Đã khóa nhân vật"
                    : "Đã mở khóa nhân vật"
            );

        }
    );


/* =========================================================
   MENU ACTIONS
========================================================= */

document
    .querySelectorAll(
        "[data-menu]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const action =
                        button.dataset.menu;

                    if(
                        action ===
                        "equip"
                    ){

                        equipSelected();

                    }

                    if(
                        action ===
                        "upgrade"
                    ){

                        window.location.href =
                            "/AnimeDorado-PCS/nangcap.html";

                    }

                    if(
                        action ===
                        "info"
                    ){

                        showToast(
                            "Chi tiết nhân vật"
                        );

                    }

                    if(
                        action ===
                        "lock"
                    ){

                        characterLocked =
                            !characterLocked;

                        showToast(
                            characterLocked
                                ? "Đã khóa nhân vật"
                                : "Đã mở khóa nhân vật"
                        );

                    }

                    if(
                        action ===
                        "close"
                    ){

                        closeMenu();

                    }

                }
            );

        }
    );


/* =========================================================
   DRAW
========================================================= */

document
    .getElementById("drawButton")
    .addEventListener(
        "click",
        function(){

            showToast(
                "Hệ thống Draw sẽ được làm sau"
            );

        }
    );


/* =========================================================
   START
========================================================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "/AnimeDorado-PCS/batdau.html";

        }
    );


/* =========================================================
   BACK
========================================================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "/AnimeDorado-PCS/";

        }
    );


/* =========================================================
   INIT
========================================================= */

loadTeam();

selectSlot(0);

selectCharacter("superman");

renderTeam();

</script>

</body>
</html>
