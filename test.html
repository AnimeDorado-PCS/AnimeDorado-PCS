<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Anime Dorado - Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{

    position:relative;

    width:100vw;
    height:100vh;

    max-width:1280px;
    max-height:720px;

    overflow:hidden;

    /* ĐÚNG FILE NỀN */
    background-image:url("nentest.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

}


/* ==============================
   HERO
============================== */

#hero{

    position:absolute;

    left:70px;
    bottom:18%;

    width:190px;
    height:220px;

    z-index:20;

}


#heroSprite{

    position:absolute;

    width:100%;
    height:100%;

    left:0;
    top:0;

    object-fit:contain;

    pointer-events:none;

}


/* ==============================
   BOSS
============================== */

#boss{

    position:absolute;

    right:90px;
    bottom:17%;

    width:220px;
    height:270px;

    z-index:15;

}


#boss img{

    width:100%;
    height:100%;

    object-fit:contain;

}


/* ==============================
   HP
============================== */

#bossHP{

    position:absolute;

    top:-15px;

    left:50%;

    transform:translateX(-50%);

    width:180px;

}


#hpBack{

    width:100%;
    height:18px;

    background:#222;

    border:2px solid #000;

    border-radius:20px;

    overflow:hidden;

}


#hp{

    width:100%;
    height:100%;

    background:#e53935;

    transition:
    width .2s;

}


#bossText{

    color:white;

    text-align:center;

    font:bold 13px Arial;

    margin-top:4px;

    text-shadow:
    0 2px 4px #000;

}


/* ==============================
   STATUS
============================== */

#status{

    position:absolute;

    top:15px;
    left:50%;

    transform:
    translateX(-50%);

    color:white;

    background:
    rgba(0,0,0,.55);

    padding:8px 15px;

    border-radius:12px;

    font:bold 14px Arial;

    z-index:100;

}


/* ==============================
   HIT
============================== */

#hit{

    position:absolute;

    width:150px;
    height:150px;

    border:
    7px solid
    rgba(150,230,255,.9);

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    z-index:50;

}


#hit.show{

    animation:
    hitAnimation
    .45s
    ease-out;

}


@keyframes hitAnimation{

    0%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale:.2);

    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale:1.5);

    }

}


/* ==============================
   BUTTON
============================== */

#buttons{

    position:absolute;

    bottom:12px;

    left:50%;

    transform:
    translateX(-50%);

    display:flex;

    gap:8px;

    z-index:100;

}


button{

    border:0;

    padding:10px 15px;

    border-radius:10px;

    background:#246bdb;

    color:white;

    font-weight:bold;

}


@media(max-width:600px){

    #hero{

        width:145px;
        height:170px;

        left:20px;

    }

    #boss{

        width:165px;
        height:205px;

        right:15px;

    }

}

</style>

</head>


<body>


<div id="game">


    <div id="status">
        🪽 Chuẩn bị bay...
    </div>


    <!-- NHÂN VẬT -->

    <div id="hero">

        <img
        id="heroSprite"
        src="">

    </div>


    <!-- BOSS -->

    <div id="boss">

        <div id="bossHP">

            <div id="hpBack">

                <div id="hp"></div>

            </div>

            <div id="bossText">
                BOSS
            </div>

        </div>

        <img
        src="boss.png">

    </div>


    <div id="hit"></div>


    <div id="buttons">

        <button onclick="startBattle()">
            ▶ BẮT ĐẦU
        </button>

        <button onclick="playSkill1()">
            ❄️ SKILL 1
        </button>

        <button onclick="playSkill2()">
            💥 SKILL 2
        </button>

        <button onclick="location.reload()">
            🔄 RESET
        </button>

    </div>


</div>


<script>

/* ========================================================
   ẢNH CỦA BẠN
======================================================== */


/*
    BAY
    10 KEYFRAME
*/

const FLY =
"https://i.postimg.cc/KjqDWPRR/20260818-141757-removebg-preview.png";


/*
    SKILL 1
    5 KEYFRAME
*/

const SKILL1 =
"https://i.postimg.cc/j5R6dgf9/20260818-142613.png";


/*
    SKILL 2
    5 KEYFRAME
*/

const SKILL2 =
"https://i.postimg.cc/jdBzJdNY/20260818-142454-removebg-preview.png";


/* ========================================================
   CẤU HÌNH
======================================================== */

const FLY_FRAMES = 10;

const SKILL1_FRAMES = 5;

const SKILL2_FRAMES = 5;


/*
    Mỗi keyframe xuất hiện 1 lần trong animation.
*/

const FLY_TIME = 90;

const SKILL1_TIME = 130;

const SKILL2_TIME = 130;


/* ========================================================
   BIẾN
======================================================== */

const hero =
document.getElementById("hero");

const sprite =
document.getElementById("heroSprite");

const boss =
document.getElementById("boss");

const hp =
document.getElementById("hp");

const status =
document.getElementById("status");

const hit =
document.getElementById("hit");


let heroX = 70;

let bossHP = 100;

let attacking = false;


/* ========================================================
   HIỂN THỊ 1 KEYFRAME
========================================================
   QUAN TRỌNG:

   Nếu ảnh của bạn là sprite-sheet ngang:

   | 1 | 2 | 3 | 4 | 5 |

   thì hàm này chỉ hiển thị ĐÚNG 1 frame.
======================================================== */

function showFrame(
    image,
    frame,
    totalFrames
){

    const frameWidth =
        100 / totalFrames;


    /*
       Đặt ảnh lớn đúng số lần
       để chỉ có 1 frame lọt vào ô nhân vật.
    */

    sprite.src = image;


    sprite.style.width =
        totalFrames * 100 + "%";


    sprite.style.height =
        "100%";


    sprite.style.maxWidth =
        "none";


    sprite.style.objectFit =
        "fill";


    /*
       Dịch chính xác tới frame.
    */

    sprite.style.left =
        -(frame * frameWidth) + "%";


    sprite.style.top =
        "0";


    sprite.style.transform =
        "none";

}


/* ========================================================
   CHẠY BAY 10 FRAME
======================================================== */

async function playFly(){

    for(
        let frame = 0;
        frame < FLY_FRAMES;
        frame++
    ){

        /*
           Frame:

           1
        */

        showFrame(
            FLY,
            frame,
            FLY_FRAMES
        );


        /*
           Chỉ chạy frame này 1 lần.
        */

        await wait(
            FLY_TIME
        );

    }

}


/* ========================================================
   BAY LIÊN TỤC TỚI BOSS
======================================================== */

async function flyToBoss(){

    status.textContent =
        "🪽 Nhân vật đang bay tới Boss...";


    const target =
        game.clientWidth
        - 90
        - 220
        - 170;


    let frame = 0;


    while(
        heroX < target
    ){

        /*
           Di chuyển
        */

        heroX += 3;


        hero.style.left =
            heroX + "px";


        /*
           MỖI LẦN CHỈ HIỆN 1 FRAME
        */

        showFrame(
            FLY,
            frame,
            FLY_FRAMES
        );


        /*
           Sang frame kế tiếp
        */

        frame++;

        if(
            frame >= FLY_FRAMES
        ){

            frame = 0;

        }


        await wait(
            FLY_TIME
        );

    }


    /*
       Giữ frame cuối khi tới boss.
    */

    showFrame(
        FLY,
        9,
        FLY_FRAMES
    );


    status.textContent =
        "⚔️ Đã đến gần Boss!";


    await wait(400);

}


/* ========================================================
   SKILL 1 — CHÍNH XÁC 5 FRAME
======================================================== */

async function playSkill1(){

    if(attacking)
        return;


    if(bossHP <= 0)
        return;


    attacking = true;


    status.textContent =
        "❄️ SKILL 1";


    /*
       FRAME 1
    */

    showFrame(
        SKILL1,
        0,
        SKILL1_FRAMES
    );

    await wait(
        SKILL1_TIME
    );


    /*
       FRAME 2
    */

    showFrame(
        SKILL1,
        1,
        SKILL1_FRAMES
    );

    await wait(
        SKILL1_TIME
    );


    /*
       FRAME 3
    */

    showFrame(
        SKILL1,
        2,
        SKILL1_FRAMES
    );

    await wait(
        SKILL1_TIME
    );


    /*
       FRAME 4
    */

    showFrame(
        SKILL1,
        3,
        SKILL1_FRAMES
    );

    await wait(
        SKILL1_TIME
    );


    /*
       FRAME 5
       CHỈ XUẤT HIỆN 1 LẦN
    */

    showFrame(
        SKILL1,
        4,
        SKILL1_FRAMES
    );

    await wait(
        SKILL1_TIME
    );


    /*
       ĐÚNG LÚC FRAME 5 XONG
       → ĐÁNH TRÚNG BOSS
    */

    damageBoss(20);


    attacking = false;

}


/* ========================================================
   SKILL 2 — CHÍNH XÁC 5 FRAME
======================================================== */

async function playSkill2(){

    if(attacking)
        return;


    if(bossHP <= 0)
        return;


    attacking = true;


    status.textContent =
        "💥 SKILL 2";


    /*
       FRAME 1
    */

    showFrame(
        SKILL2,
        0,
        SKILL2_FRAMES
    );

    await wait(
        SKILL2_TIME
    );


    /*
       FRAME 2
    */

    showFrame(
        SKILL2,
        1,
        SKILL2_FRAMES
    );

    await wait(
        SKILL2_TIME
    );


    /*
       FRAME 3
    */

    showFrame(
        SKILL2,
        2,
        SKILL2_FRAMES
    );

    await wait(
        SKILL2_TIME
    );


    /*
       FRAME 4
    */

    showFrame(
        SKILL2,
        3,
        SKILL2_FRAMES
    );

    await wait(
        SKILL2_TIME
    );


    /*
       FRAME 5
       CHỈ XUẤT HIỆN 1 LẦN
    */

    showFrame(
        SKILL2,
        4,
        SKILL2_FRAMES
    );

    await wait(
        SKILL2_TIME
    );


    /*
       FRAME 5 KẾT THÚC
       → DAMAGE BOSS
    */

    damageBoss(30);


    attacking = false;

}


/* ========================================================
   DAMAGE
======================================================== */

function damageBoss(
    damage
){

    bossHP -= damage;


    if(
        bossHP < 0
    ){

        bossHP = 0;

    }


    hp.style.width =
        bossHP + "%";


    /*
       Hiệu ứng trúng Boss
    */

    const br =
        boss.getBoundingClientRect();

    const gr =
        game.getBoundingClientRect();


    hit.style.left =
        (
            br.left -
            gr.left +
            br.width / 2
        ) + "px";


    hit.style.top =
        (
            br.top -
            gr.top +
            br.height / 2
        ) + "px";


    hit.classList.remove(
        "show"
    );


    void hit.offsetWidth;


    hit.classList.add(
        "show"
    );


    if(
        bossHP <= 0
    ){

        status.textContent =
            "💀 BOSS BỊ HẠ!";

    }

}


/* ========================================================
   ĐỢI
======================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* ========================================================
   TẤN CÔNG HẾT SKILL
======================================================== */

async function attackAllSkills(){

    /*
       SKILL 1
       5 FRAME
       MỖI FRAME 1 LẦN
    */

    await playSkill1();


    if(
        bossHP <= 0
    ){

        return;

    }


    await wait(400);


    /*
       SKILL 2
       5 FRAME
       MỖI FRAME 1 LẦN
    */

    await playSkill2();


    if(
        bossHP <= 0
    ){

        return;

    }


    /*
       Nếu boss chưa chết,
       tiếp tục lại chu kỳ.
    */

    await wait(500);


    await attackAllSkills();

}


/* ========================================================
   BẮT ĐẦU
======================================================== */

async function startBattle(){

    /*
       Vị trí ban đầu
    */

    heroX =
        game.clientWidth * 0.06;


    hero.style.left =
        heroX + "px";


    bossHP = 100;

    hp.style.width =
        "100%";


    /*
       BAY
       10 → 1 → 2 → ... → 10
       cho tới khi tới Boss
    */

    await flyToBoss();


    /*
       TỚI BOSS
       → SKILL 1
       → SKILL 2
    */

    await attackAllSkills();

}


/* ========================================================
   FRAME BAN ĐẦU
======================================================== */

showFrame(
    FLY,
    0,
    FLY_FRAMES
);

</script>

</body>
</html>
